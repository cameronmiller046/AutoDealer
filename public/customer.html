<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer 360 — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eaeef4; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 10px 24px -18px rgba(16,32,60,0.26); --radius:15px; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:104px; height:9px; margin-bottom:4px; } .brand .wm { font-size:21px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:19px; height:19px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { margin-top:auto; display:flex; align-items:center; gap:11px; padding:14px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:38px; height:38px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13.5px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11.5px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:11px 26px; }
    .back { display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-size:13.5px; font-weight:600; padding:8px 12px; border-radius:9px; } .back:hover { background:var(--bg); color:var(--accent); } .back svg { width:16px; height:16px; }
    .crumb { color:var(--faint); font-size:13px; } .crumb b { color:var(--text); font-weight:600; }
    .tb-icons { display:flex; align-items:center; gap:4px; margin-left:auto; }
    .ib { position:relative; border:none; background:none; color:var(--muted); width:40px; height:40px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; } .ib:hover { background:var(--bg); color:var(--accent); } .ib svg { width:21px; height:21px; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:8px; }
    .content { padding:16px 22px 40px; }

    /* ============ COMMAND CENTER HEADER ============ */
    .cc-head { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 20px; }
    .cch-top { display:flex; align-items:flex-start; gap:16px; }
    .cch-av { width:60px; height:60px; border-radius:16px; flex:none; color:#fff; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; position:relative; box-shadow:0 10px 22px -12px rgba(16,32,60,.5); }
    .cch-id h1 { font-size:22px; font-weight:800; letter-spacing:-0.5px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .vip { background:linear-gradient(180deg,#fef3c7,#fde68a); color:#92600a; font-size:10px; font-weight:800; letter-spacing:0.5px; padding:3px 8px; border-radius:6px; }
    .stars { color:#f5b638; letter-spacing:1px; font-size:13px; }
    .cch-contact { color:var(--muted); font-size:13px; margin-top:5px; display:flex; flex-wrap:wrap; gap:4px 16px; } .cch-contact span { display:inline-flex; align-items:center; gap:6px; } .cch-contact svg { width:14px; height:14px; color:var(--faint); }
    .cch-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex:none; }
    .cch-btn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:600; } .cch-btn:hover { border-color:#cfe0f7; color:var(--accent); } .cch-btn svg { width:15px; height:15px; }
    .cch-kebab { border:1px solid var(--line); background:var(--card); color:var(--muted); width:38px; height:38px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; } .cch-kebab:hover { color:var(--accent); }
    .cch-stats { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:12px 8px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line); }
    .cs-item .k { color:var(--faint); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
    .cs-item .v { font-weight:700; font-size:14px; margin-top:3px; letter-spacing:-.2px; }
    .cs-item .v small { display:block; font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:0; text-transform:none; margin-top:1px; }
    .cs-prob .v { color:#16a34a; } .cs-score .v { color:#7c3aed; }
    .cs-metric { display:flex; align-items:center; gap:9px; }
    .cs-metric .mini-ring { width:34px; height:34px; flex:none; position:relative; } .cs-metric .mini-ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; }

    /* ============ STICKY ACTION BAR ============ */
    .cw-bar { position:sticky; z-index:25; background:var(--card); backdrop-filter:saturate(180%) blur(8px); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); padding:8px 9px; margin:12px 0; display:flex; align-items:center; gap:7px; overflow-x:auto; }
    .cw-bar::-webkit-scrollbar { height:0; }
    .cw-ab { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:9px 13px; font-size:12.5px; font-weight:700; white-space:nowrap; flex:none; transition:.14s; } .cw-ab:hover { border-color:var(--accent-soft); color:var(--accent); background:var(--accent-soft); } .cw-ab svg { width:16px; height:16px; }
    .cw-ab.pri { background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border-color:transparent; } .cw-ab.pri:hover { color:#fff; filter:brightness(1.05); }
    .cw-ab.g { background:color-mix(in srgb,#16a34a 12%,var(--card)); border-color:transparent; color:#16a34a; } .cw-ab.g:hover { color:#15803d; }
    .cw-ab[disabled] { opacity:.45; cursor:not-allowed; }

    /* ============ GRID ============ */
    .cc-r1, .cc-r2, .cc-r3 { display:grid; gap:14px; margin-bottom:14px; align-items:stretch; }
    .cc-r1 { grid-template-columns:1.45fr 1.3fr 1.05fr 1.2fr 1.1fr; }
    .cc-r2 { grid-template-columns:1fr 1.55fr 1fr 1.1fr; }
    .cc-r3 { grid-template-columns:1.1fr 1.35fr 1.1fr 1fr 0.95fr; }
    .cc { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:15px 16px; min-width:0; display:flex; flex-direction:column; }
    .cc h3 { font-size:12.5px; font-weight:800; letter-spacing:.2px; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .cc h3 svg { width:15px; height:15px; flex:none; color:var(--accent); } .cc h3 .spark svg { color:#7c3aed; }
    .cc h3 .more { margin-left:auto; font-size:11.5px; color:var(--accent); font-weight:700; cursor:pointer; } .cc h3 .more:hover { text-decoration:underline; }
    .cc h3 .beta { margin-left:6px; font-size:8.5px; font-weight:800; letter-spacing:.4px; color:#7c3aed; background:color-mix(in srgb,#7c3aed 14%,var(--card)); padding:2px 6px; border-radius:5px; }
    .cc h3 .tag-live { margin-left:auto; font-size:10px; font-weight:800; color:#16a34a; }
    .instk { font-size:9.5px; font-weight:800; letter-spacing:.3px; color:#16a34a; background:color-mix(in srgb,#16a34a 14%,var(--card)); padding:2px 8px; border-radius:6px; }

    /* AI Executive Brief */
    .brief-hd { display:flex; gap:13px; }
    .brief-ring { width:66px; height:66px; flex:none; position:relative; } .brief-ring b { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; } .brief-ring b em { font-style:normal; font-size:17px; font-weight:900; line-height:1; } .brief-ring b i { font-style:normal; font-size:8px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
    .brief-txt { font-size:12px; line-height:1.5; color:var(--muted); } .brief-txt b { color:var(--text); }
    .brief-facts { margin-top:12px; display:flex; flex-direction:column; gap:0; }
    .bf { display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; } .bf:first-child { border-top:none; }
    .bf .bfi { width:7px; height:7px; border-radius:50%; flex:none; } .bf .bfk { color:var(--muted); } .bf .bfv { margin-left:auto; font-weight:700; text-align:right; }
    .brief-rec { margin-top:12px; background:color-mix(in srgb,var(--accent) 6%,var(--card)); border:1px solid color-mix(in srgb,var(--accent) 16%,var(--card)); border-radius:11px; padding:11px 12px; }
    .brief-rec .rl { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--accent); } .brief-rec .rv { font-size:12.5px; font-weight:700; margin-top:3px; }
    .brief-open { margin-top:9px; font-size:12px; font-style:italic; color:var(--muted); line-height:1.5; border-left:2px solid var(--accent); padding-left:10px; }
    .brief-acts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; }
    .brief-acts button { border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px 0; font-size:11px; font-weight:700; color:var(--accent); display:flex; flex-direction:column; align-items:center; gap:4px; } .brief-acts button:hover { background:var(--accent); color:#fff; border-color:transparent; } .brief-acts button svg { width:15px; height:15px; }

    /* mini feed / timeline */
    .fe { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); cursor:pointer; } .fe:first-child { border-top:none; padding-top:2px; } .fe:hover .fe-b b { color:var(--accent); }
    .fe .fe-i { width:28px; height:28px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; } .fe .fe-i svg { width:14px; height:14px; }
    .fe .fe-b { flex:1; min-width:0; } .fe .fe-b b { font-size:12.5px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .fe .fe-b span { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
    .fe .fe-t { font-size:10.5px; color:var(--faint); font-weight:600; flex:none; white-space:nowrap; text-align:right; }

    /* Health */
    .hs-ring { display:flex; align-items:center; gap:14px; }
    .hs-rc { width:78px; height:78px; flex:none; position:relative; } .hs-rc b { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; } .hs-rc b em { font-style:normal; font-size:22px; font-weight:900; line-height:1; } .hs-rc b i { font-style:normal; font-size:10px; font-weight:800; }
    .hs-lab b { font-size:15px; font-weight:800; display:block; } .hs-lab span { font-size:11.5px; color:var(--muted); }
    .hs-g { color:#16a34a; } .hs-y { color:#d97706; } .hs-r { color:#dc2626; }
    .hs-fac { margin-top:13px; display:flex; flex-direction:column; gap:8px; }
    .hs-f .hs-ft { display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px; } .hs-f .hs-ft .k { color:var(--muted); } .hs-f .hs-ft .v { font-weight:700; }
    .hs-bar { height:5px; border-radius:999px; background:var(--line); overflow:hidden; } .hs-bar i { display:block; height:100%; border-radius:999px; }
    .hs-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line); text-align:center; }
    .hs-stats .v { font-size:14px; font-weight:800; } .hs-stats .k { font-size:9.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px; margin-top:2px; }

    /* Next Activity (light) */
    .na2 .na-top { display:flex; align-items:center; gap:11px; margin-bottom:12px; }
    .na2 .na-ic { width:38px; height:38px; border-radius:11px; flex:none; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; } .na2 .na-ic svg { width:19px; height:19px; }
    .na2 .na-when { font-size:11.5px; font-weight:700; color:var(--accent); } .na2 .na-t { font-size:14.5px; font-weight:800; letter-spacing:-.2px; } .na2 .na-sub { font-size:11.5px; color:var(--muted); }
    .na2 .na-meta { display:flex; flex-direction:column; gap:0; }
    .na2 .na-row { display:flex; padding:7px 0; border-top:1px solid var(--line); font-size:12px; } .na2 .na-row:first-child { border-top:none; } .na2 .na-row .k { color:var(--muted); width:88px; flex:none; } .na2 .na-row .v { font-weight:600; }
    .pri-badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:10.5px; font-weight:800; } .pri-High,.pri-Critical { background:color-mix(in srgb,#dc2626 14%,var(--card)); color:#dc2626; } .pri-Medium { background:color-mix(in srgb,#d97706 15%,var(--card)); color:#b45309; } .pri-Low { background:color-mix(in srgb,var(--muted) 15%,var(--card)); color:var(--muted); }
    .na2 .na-cta { margin-top:auto; padding-top:12px; display:flex; flex-direction:column; gap:7px; }
    .na2 .na-cta .full { width:100%; border:none; background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border-radius:10px; padding:10px; font-size:13px; font-weight:700; }
    .na2 .na-cta .split { display:flex; gap:7px; } .na2 .na-cta .split button { flex:1; border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px; font-size:12px; font-weight:700; color:var(--text); } .na2 .na-cta .split button:hover { border-color:#cfe0f7; color:var(--accent); }
    .na2 .na-empty { color:var(--muted); font-size:12.5px; text-align:center; padding:16px 0; } .na2 .na-empty .full { margin-top:12px; }

    /* Vehicle of interest */
    .veh-photo { position:relative; width:100%; height:118px; border-radius:12px; overflow:hidden; background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 8%,var(--card)),var(--card)); border:1px solid var(--line); margin-bottom:11px; }
    .veh-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .veh-q { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--faint); }
    .veh-q .qm { font-size:40px; font-weight:900; line-height:1; color:color-mix(in srgb,var(--muted) 60%,var(--card)); }
    .veh-q .ql { font-size:10.5px; font-weight:700; letter-spacing:.3px; }
    .veh-photo .instk { position:absolute; top:9px; right:9px; }
    .veh-t { font-size:14px; font-weight:800; letter-spacing:-.2px; } .veh-s { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .veh-spec { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:11px 0; }
    .veh-spec .k { font-size:9.5px; color:var(--faint); font-weight:600; text-transform:uppercase; letter-spacing:.3px; } .veh-spec .v { font-size:12px; font-weight:700; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .veh-pay { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .veh-pay .col { flex:1; } .veh-pay .k { font-size:9.5px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.3px; } .veh-pay .v { font-size:15px; font-weight:800; letter-spacing:-.3px; margin-top:2px; } .veh-pay .v small { font-size:11px; font-weight:600; color:var(--muted); }
    .veh-acts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:11px; }
    .veh-acts button { border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px 0 6px; font-size:10px; font-weight:700; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px; } .veh-acts button:hover { border-color:var(--accent); color:var(--accent); } .veh-acts button svg { width:15px; height:15px; color:var(--accent); }

    /* Opportunity Snapshot */
    .op-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; } .op-row:first-child { border-top:none; } .op-row .k { color:var(--muted); } .op-row .v { font-weight:800; }
    .op-prob { margin-top:10px; padding-top:11px; border-top:1px solid var(--line); }
    .op-prob .lt { display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:5px; } .op-prob .lt .k { color:var(--muted); font-weight:600; } .op-prob .lt .v { font-weight:800; color:#16a34a; }
    .op-prob .bar { height:7px; border-radius:999px; background:var(--line); overflow:hidden; } .op-prob .bar i { display:block; height:100%; background:linear-gradient(90deg,#22c55e,#16a34a); border-radius:999px; }
    .op-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:11px; border-top:1px solid var(--line); }
    .op-foot .big { } .op-foot .big .v { font-size:18px; font-weight:900; letter-spacing:-.5px; } .op-foot .big .k { font-size:10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
    .op-foot .tgt { text-align:right; } .op-foot .tgt .v { font-size:13px; font-weight:800; color:var(--accent); } .op-foot .tgt .k { font-size:10px; color:var(--muted); font-weight:600; }

    /* Communications hub */
    .cmz-tabs { display:flex; gap:4px; margin-bottom:11px; flex-wrap:wrap; }
    .cmz-tabs button { border:none; background:var(--bg); color:var(--muted); border-radius:8px; padding:6px 11px; font-size:11.5px; font-weight:700; } .cmz-tabs button.on { background:var(--accent); color:#fff; }
    .cmz-feed { flex:1; min-height:0; max-height:236px; overflow-y:auto; }
    .cmz { display:flex; gap:11px; padding:10px 0; border-top:1px solid var(--line); } .cmz:first-child { border-top:none; }
    .cmz .ci { width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; } .cmz .ci svg { width:15px; height:15px; }
    .cmz .cb { flex:1; min-width:0; } .cmz .ch { display:flex; align-items:baseline; gap:8px; } .cmz .ch b { font-size:12.5px; font-weight:700; } .cmz .ch .t { margin-left:auto; font-size:11px; color:var(--faint); } .cmz .cp { font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .cmz .cs { font-size:10.5px; font-weight:700; color:#16a34a; margin-top:3px; }
    .cmz-in { display:flex; gap:8px; margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }

        b.innerHTML='<div class="card"><h3>Notes <span class="more" id="tabNoteAdd">Add note</span></h3>'+(nn.length?nn.map(function(n){ return '<div class="note-item"><div class="nh"><span class="na-av">JA</span>'+CUST.rep+' · '+relDay(n.ts)+' '+fmtTime(n.ts)+'</div><p>'+n.detail+'</p></div>'; }).join(""):'<div style="color:var(--muted);font-size:13px;padding:8px">No notes yet.</div>')+'</div>';
        var na=$("tabNoteAdd"); if(na) na.addEventListener("click", function(){ drawerNote(); });
      }
    }
    function renderDocsFull(q){ q=(q||"").toLowerCase(); var rows=DOCS.filter(function(d){ return !q||(d[2]+" "+d[5]).toLowerCase().indexOf(q)!==-1; });
      $("docGrid").innerHTML=rows.map(function(d){ return '<div class="doc" data-doc="'+d[2]+'"><span class="di '+d[0]+'">'+svg(d[1])+'</span><b>'+d[2]+'</b><span>'+d[3]+'</span><div><span class="dstat '+d[4]+'">'+d[5]+'</span></div></div>'; }).join("")||'<div style="color:var(--muted);font-size:13px;padding:10px">No documents match.</div>';
      document.querySelectorAll("#docGrid [data-doc]").forEach(function(el){ el.addEventListener("click", function(){ tst('Opening "'+el.dataset.doc+'"'); }); }); }

    /* ================= boot ================= */
    function renderAll(){ renderHead(); renderGrid(); }
    function boot(){
      renderBar(); renderAll(); renderTabs(); renderTab();
      var cn=$("crumbName"); if(cn) cn.textContent=CUST.name;
      document.title = CUST.name + " — Customer 360";
    }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
    window.ADCustomer = { log:log, route:route };
  })();
  </script>
</body>
</html>
