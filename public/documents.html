<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Center — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eef1f6; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 12px 28px -18px rgba(16,32,60,0.28); --radius:16px; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    .shell { display:grid; grid-template-columns:244px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:108px; height:9px; margin-bottom:4px; } .brand .wm { font-size:22px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:18px; height:18px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { display:flex; align-items:center; gap:11px; padding:12px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:36px; height:36px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:12px 30px; }
    .hamb { border:none; background:none; color:var(--muted); width:36px; height:36px; border-radius:9px; } .hamb svg { width:20px; height:20px; }
    .role-badge { display:inline-flex; align-items:center; gap:7px; background:#eef0fe; color:#4f46e5; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700; margin-left:auto; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:8px; }
    .content { padding:26px 30px 60px; }
    .phead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .phead h1 { font-size:26px; font-weight:800; letter-spacing:-0.6px; } .phead .sub { color:var(--muted); font-size:14.5px; margin-top:6px; }
    .btn-primary { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border:none; border-radius:11px; padding:11px 17px; font-size:13.5px; font-weight:600; box-shadow:0 12px 26px -14px rgba(37,99,235,0.9); } .btn-primary svg { width:16px; height:16px; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:13px; margin:22px 0 18px; }
    .kp { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); } .kp .kl{color:var(--muted);font-size:12px;} .kp .kv{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-top:4px;} .kp .kv.warn{color:#ea8a0b;}
    .bigsearch { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 16px; box-shadow:var(--shadow); margin-bottom:16px; } .bigsearch svg { width:19px; height:19px; color:var(--muted); } .bigsearch input { border:none; outline:none; background:none; width:100%; font-size:14.5px; }
    .pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    .pill { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:8px 15px; font-size:13px; font-weight:600; } .pill.on { background:var(--accent); color:#fff; border-color:var(--accent); } .pill:hover{color:var(--text);border-color:#cfe0f7;} .pill.on:hover{color:#fff;}
    .doc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .doc { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s, box-shadow .12s; } .doc:hover { transform:translateY(-2px); box-shadow:0 16px 34px -20px rgba(16,32,60,.4); }
    .doc .di { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; } .doc .di svg { width:20px; height:20px; }
    .i-blue{background:#eaf1fe;color:#2563eb;} .i-teal{background:#e2f5fb;color:#0891b2;} .i-green{background:#e7f7ee;color:#16a34a;} .i-indigo{background:#eef0fe;color:#6366f1;} .i-purple{background:#f1eafe;color:#7c3aed;} .i-amber{background:#fdf0dc;color:#ea8a0b;} .i-gray{background:#eef1f6;color:#64748b;} .i-red{background:#fdeaea;color:#dc2626;}
    .doc b { font-size:13.5px; font-weight:700; display:block; } .doc .cust { font-size:12px; color:var(--accent); font-weight:600; margin-top:3px; } .doc .meta { font-size:11.5px; color:var(--muted); margin-top:6px; } .doc .stat { margin-top:10px; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:6px; display:inline-block; } .ds-signed{background:#e7f7ee;color:#16a34a;} .ds-file{background:#eaf1fe;color:#2563eb;} .ds-pending{background:#fdf0dc;color:#b45309;}
    .empty { text-align:center; padding:50px 20px; color:var(--muted); }
    .toast { position:fixed; bottom:24px; right:24px; background:#0f1b2d; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); opacity:0; transform:translateY(18px); transition:all .3s; z-index:60; } .toast.show{opacity:1;transform:none;} .toast .tk{width:22px;height:22px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;flex:none;} .toast .tk svg{width:13px;height:13px;}
    @media (max-width:1240px){ .kpis{grid-template-columns:repeat(2,1fr);} }
    @media (max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{display:none;} }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><svg class="sw" viewBox="0 0 108 9"><path d="M2 7 C26 1, 82 1, 106 5" fill="none" stroke="#2b8fff" stroke-width="2.4" stroke-linecap="round"/></svg><span class="wm">AUTO<b>DEALER</b></span></div>
      <nav class="nav"></nav>
      <div class="side-user"><span class="av">DM</span><span class="meta"><b>Dana Morales</b><span>Sales Manager</span></span><svg class="chev" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="hamb"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <span class="role-badge">Document Center</span>
        <span class="tb-avatar"><span class="av">DM</span></span>
      </header>
      <main class="content">
        <div class="phead">
          <div><h1>Document Center</h1><p class="sub">Every driver's license, insurance card, buyer's order, credit app, and contract — centralized and searchable.</p></div>
          <button class="btn-primary"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Upload</button>
        </div>
        <div class="kpis" id="kpis"></div>
        <div class="bigsearch"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="search" placeholder="Search all documents by name, customer, type, or VIN..." /></div>
        <div class="pills" id="pills"></div>
        <div class="doc-grid" id="grid"></div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="toastMsg">Done</span></div>

  <script src="/roles.js"></script>
  <script>
    var $ = function(id){ return document.getElementById(id); };
    var IC = {
      id:'<rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 10h4M13 13.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
      doc:'<path d="M6 3.5h8l4 4V20.5H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3.5v4h4M9 12h6M9 16h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      credit:'<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.7"/>',
      swap:'<path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
      sign:'<path d="M4 18c3 0 3-8 6-8s3 6 6 6 4-6 4-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'
    };
    var svg=function(k){ return '<svg viewBox="0 0 24 24">'+IC[k]+'</svg>'; };
    var TYPES = [["all","All"],["license","Licenses"],["insurance","Insurance"],["buyers","Buyer's Orders"],["credit","Credit Apps"],["finance","Finance Docs"],["trade","Trade Paperwork"],["contract","Contracts"]];
    // name, customer, type, date, statusClass, statusLabel, iconClass, icon
    var DOCS = [
      ["Driver's License","John Smith","license","Jun 2019","ds-file","On File","i-blue","id"],
      ["Insurance Card — State Farm","John Smith","insurance","2026","ds-file","Valid","i-teal","shield"],
      ["Buyer's Order — Silverado HC","John Smith","buyers","Jul 2025","ds-signed","Signed","i-green","doc"],
      ["Credit Application","John Smith","credit","Jul 2025","ds-signed","Approved","i-indigo","credit"],
      ["Finance Contract — Ally","John Smith","finance","Jul 2025","ds-signed","Signed","i-purple","doc"],
      ["Trade Paperwork — F-150 XLT","John Smith","trade","Jul 2025","ds-signed","Signed","i-amber","swap"],
      ["Extended Warranty Agreement","John Smith","contract","Jul 2025","ds-pending","Awaiting Sig","i-gray","sign"],
      ["Driver's License","Sarah Lewis","license","2024","ds-file","On File","i-blue","id"],
      ["Buyer's Order — Tahoe HC","Sarah Lewis","buyers","Today","ds-pending","Awaiting Sig","i-gray","doc"],
      ["Credit Application","Robert Brown","credit","Today","ds-signed","Approved","i-indigo","credit"],
      ["Insurance Card — GEICO","Robert Brown","insurance","2026","ds-file","Valid","i-teal","shield"],
      ["Finance Contract — Chase","Priya Nair","finance","Sep 2025","ds-signed","Signed","i-purple","doc"],
      ["Trade Paperwork — CR-V","Sarah Lewis","trade","Today","ds-pending","Awaiting Sig","i-amber","swap"],
      ["Retail Contract — XT5","Priya Nair","contract","Sep 2025","ds-signed","Signed","i-green","sign"]
    ];
    var filter="all", q="";
    function renderKPIs(){
      var pending=DOCS.filter(function(d){return d[4]==="ds-pending";}).length;
      var signed=DOCS.filter(function(d){return d[4]==="ds-signed";}).length;
      $("kpis").innerHTML=[["Total Documents",DOCS.length,""],["Signed",signed,""],["Awaiting Signature",pending,"warn"],["Customers on File","9",""]].map(function(k){ return '<div class="kp"><div class="kl">'+k[0]+'</div><div class="kv '+(k[2]||"")+'">'+k[1]+'</div></div>'; }).join("");
    }
    function renderPills(){ $("pills").innerHTML=TYPES.map(function(t){ var n=t[0]==="all"?DOCS.length:DOCS.filter(function(d){return d[2]===t[0];}).length; return '<button class="pill '+(filter===t[0]?"on":"")+'" data-f="'+t[0]+'">'+t[1]+(t[0]!=="all"?' · '+n:"")+'</button>'; }).join(""); document.querySelectorAll(".pill").forEach(function(b){ b.addEventListener("click",function(){ filter=b.dataset.f; renderPills(); renderGrid(); }); }); }
    function renderGrid(){
      var rows=DOCS.filter(function(d){ return (filter==="all"||d[2]===filter) && (!q || (d[0]+" "+d[1]+" "+d[2]).toLowerCase().indexOf(q.toLowerCase())!==-1); });
      $("grid").innerHTML = rows.length ? rows.map(function(d){ return '<div class="doc" data-n="'+d[0]+'"><span class="di '+d[6]+'">'+svg(d[7])+'</span><b>'+d[0]+'</b><div class="cust">'+d[1]+'</div><div class="meta">'+d[3]+'</div><div><span class="stat '+d[4]+'">'+d[5]+'</span></div></div>'; }).join("") : '<div class="empty" style="grid-column:1/-1">No documents match your search.</div>';
      document.querySelectorAll(".doc").forEach(function(el){ el.addEventListener("click",function(){ toast('Opening “'+el.dataset.n+'”'); }); });
    }
    $("search").addEventListener("input", function(e){ q=e.target.value; renderGrid(); });
    var toastT; function toast(msg){ $("toastMsg").textContent=msg; var el=$("toast"); el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},2200); }
    renderKPIs(); renderPills(); renderGrid();
  </script>
</body>
</html>
