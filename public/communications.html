<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Communications — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f6f8fb; --card: #ffffff; --sidebar: #0a1628; --sidebar-2: #071120;
      --text: #16202e; --muted: #6b7a90; --faint: #97a4b6; --line: #eef1f6;
      --accent: #2563eb; --accent-2: #3b82f6; --accent-soft: #eef4ff;
      --shadow: 0 1px 2px rgba(16,32,60,0.04), 0 12px 28px -18px rgba(16,32,60,0.28);
      --radius: 16px;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 14px; overflow: hidden; }
    a { color: inherit; text-decoration: none; } button { font: inherit; cursor: pointer; }
    .shell { display: grid; grid-template-columns: 244px 1fr; height: 100vh; }

    .sidebar { background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2)); color: #c7d4e6; padding: 22px 14px 18px; display: flex; flex-direction: column; height: 100vh; }
    .brand { display: flex; flex-direction: column; align-items: flex-start; padding: 4px 8px 26px; }
    .brand .sw { width: 108px; height: 9px; margin-bottom: 4px; } .brand .wm { font-size: 22px; font-weight: 900; letter-spacing: 0.5px; color: #fff; } .brand .wm b { color: #2b8fff; }
    .nav { display: flex; flex-direction: column; gap: 3px; }
    .nav a { display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 11px; color: #aebdd2; font-size: 14.5px; font-weight: 500; }
    .nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav a.on { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width: 19px; height: 19px; flex: none; }
    .nav a .nb { margin-left: auto; background: rgba(255,255,255,0.12); color: #dbe7f7; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
    .nav a.on .nb { background: rgba(255,255,255,0.25); color: #fff; }
    .side-user { margin-top: auto; display: flex; align-items: center; gap: 11px; padding: 14px 8px 4px; border-top: 1px solid rgba(255,255,255,0.08); }
    .side-user .av { width: 38px; height: 38px; border-radius: 50%; flex: none; background: linear-gradient(135deg,#3f9bff,#0b57b8); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
    .side-user .meta b { color: #fff; font-size: 13.5px; font-weight: 600; display: block; } .side-user .meta span { color: #8698b0; font-size: 11.5px; }
    .side-user .chev { margin-left: auto; color: #7e90a8; width: 14px; height: 14px; }

    .main { min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .topbar { flex: none; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 11px 24px; }
    .topbar h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; } .topbar h1 span { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 10px; }
    .live-chip { display: inline-flex; align-items: center; gap: 7px; background: #e7f7ee; color: #16a34a; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; } .live-chip .ld { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,163,74,0.5)} 70%{box-shadow:0 0 0 6px rgba(22,163,74,0)} 100%{box-shadow:0 0 0 0 rgba(22,163,74,0)} }
    .usearch { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; color: var(--muted); }
    .usearch svg { width: 17px; height: 17px; flex: none; } .usearch input { border: none; background: none; outline: none; width: 100%; font-size: 13.5px; color: var(--text); }
    .kbd { border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 11px; color: var(--faint); background: #fff; }
    .compose-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff; border: none; border-radius: 11px; padding: 10px 18px; font-size: 13.5px; font-weight: 600; box-shadow: 0 12px 26px -14px rgba(37,99,235,0.9); } .compose-btn:hover { filter: brightness(1.06); } .compose-btn svg { width: 15px; height: 15px; }

    .comms { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px 320px minmax(0,1fr) 310px; }

    /* filters */
    .filters { border-right: 1px solid var(--line); background: #fff; overflow-y: auto; padding: 14px 10px; }
    .fgroup-l { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: var(--faint); text-transform: uppercase; padding: 12px 10px 7px; }
    .fitem { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--text); width: 100%; border: none; background: none; text-align: left; } .fitem:hover { background: var(--bg); } .fitem.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .fitem svg { width: 17px; height: 17px; flex: none; color: var(--muted); } .fitem.on svg { color: var(--accent); }
    .fitem .fb { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 1px 8px; } .fitem.on .fb { background: #fff; color: var(--accent); } .fitem .fb.hot { background: #fdeaea; color: #dc2626; }

    /* conversation list */
    .convlist { border-right: 1px solid var(--line); background: #fff; display: flex; flex-direction: column; min-height: 0; }
    .cl-hd { flex: none; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .cl-hd .cl-title { font-weight: 700; font-size: 15px; } .cl-hd .cl-count { color: var(--faint); font-size: 12.5px; font-weight: 600; } .cl-hd .cl-sort { margin-left: auto; border: none; background: var(--bg); color: var(--muted); width: 32px; height: 32px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; } .cl-hd .cl-sort svg { width: 16px; height: 16px; }
    .cl-scroll { overflow-y: auto; flex: 1; }
    .conv { display: flex; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; } .conv:hover { background: #fafbff; } .conv.on { background: var(--accent-soft); } .conv.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
    .conv .av { width: 44px; height: 44px; border-radius: 50%; flex: none; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; position: relative; }
    .conv .av .ch { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; } .conv .av .ch svg { width: 11px; height: 11px; }
    .conv .cv { min-width: 0; flex: 1; }
    .conv .cv-top { display: flex; align-items: baseline; gap: 8px; } .conv .cv-top b { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .conv.unread .cv-top b { font-weight: 800; } .conv .cv-top .t { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; flex: none; }
    .conv .veh { font-size: 12px; color: var(--accent); font-weight: 600; margin: 1px 0 3px; }
    .conv .last { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; } .conv.unread .last { color: var(--text); font-weight: 600; } .conv .last svg { width: 13px; height: 13px; flex: none; color: var(--faint); }
    .conv .badge-un { position: absolute; right: 15px; bottom: 14px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
    .conv .pri { position: absolute; right: 15px; top: 14px; width: 8px; height: 8px; border-radius: 50%; }

    /* thread */
    .thread { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
    .th-hd { flex: none; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 13px; }
    .th-hd .av { width: 42px; height: 42px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
    .th-hd .thn b { font-weight: 700; font-size: 15px; } .th-hd .thn .ths { font-size: 12.5px; color: var(--muted); margin-top: 1px; } .th-hd .thn .ths .on-dot { color: #16a34a; font-weight: 600; }
    .th-actions { margin-left: auto; display: flex; gap: 3px; }
    .tab { width: 36px; height: 36px; border-radius: 10px; border: none; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; } .tab:hover { background: var(--bg); color: var(--accent); } .tab svg { width: 18px; height: 18px; }
    .th-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 8px; display: flex; flex-direction: column; gap: 4px; }
    .day-div { text-align: center; margin: 14px 0 10px; position: relative; } .day-div span { background: var(--bg); position: relative; z-index: 1; padding: 0 12px; font-size: 11.5px; font-weight: 700; color: var(--faint); } .day-div::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }

    .msg { display: flex; margin: 4px 0; max-width: 78%; }
    .msg.out { margin-left: auto; flex-direction: row-reverse; }
    .bub { padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; }
    .msg.in .bub { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(16,32,60,0.04); }
    .msg.out .bub { background: linear-gradient(180deg,#3b82f6,#2563eb); color: #fff; border-bottom-right-radius: 5px; }
    .mstatus { font-size: 10.5px; color: var(--faint); margin-top: 3px; display: flex; align-items: center; gap: 4px; } .msg.out .mstatus { justify-content: flex-end; } .mstatus svg { width: 12px; height: 12px; } .mstatus .read { color: var(--accent); }
    .msg-wrap { display: flex; flex-direction: column; }

    /* channel event cards (call/email/video/appt) */
    .evt { max-width: 82%; margin: 8px 0; }
    .evt.out { margin-left: auto; }
    .evt.center { max-width: 100%; display: flex; justify-content: center; }
    .evt-pill { display: inline-flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 15px; font-size: 12.5px; box-shadow: 0 1px 2px rgba(16,32,60,0.04); } .evt-pill .ei { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; } .evt-pill .ei svg { width: 14px; height: 14px; } .evt-pill b { font-weight: 700; } .evt-pill .em { color: var(--muted); } .evt-pill .et { color: var(--faint); margin-left: 4px; }
    .evt-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(16,32,60,0.04); width: 320px; max-width: 100%; }
    .evt-card .ec-hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); } .ec-hd .ei { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex: none; } .ec-hd .ei svg { width: 15px; height: 15px; } .ec-hd b { font-weight: 700; font-size: 13px; } .ec-hd span { color: var(--faint); font-size: 11.5px; margin-left: auto; }
    .evt-card .ec-body { padding: 12px 14px; font-size: 13px; color: #334155; line-height: 1.45; }
    .evt-card .ec-foot { padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; } .ec-foot .g { color: #16a34a; font-weight: 700; } .ec-foot svg { width: 13px; height: 13px; }
    .vid-thumb { height: 120px; background: linear-gradient(135deg,#5b21b6,#7c3aed); position: relative; display: flex; align-items: center; justify-content: center; } .vid-thumb .play { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; } .vid-thumb .play svg { width: 18px; height: 18px; color: #7c3aed; margin-left: 2px; } .vid-thumb .wp { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .note-evt { background: #fff9ec; border: 1px solid #f5e4bd; border-radius: 12px; padding: 11px 14px; margin: 8px 0; font-size: 13px; color: #7a5b16; } .note-evt .nl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; color: #b7861a; display: flex; align-items: center; gap: 6px; margin-bottom: 5px; } .note-evt .nl svg { width: 12px; height: 12px; }
    .typing { display: inline-flex; gap: 4px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 16px; border-bottom-left-radius: 5px; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: #c3ccd8; animation: td 1.2s infinite; } .typing i:nth-child(2){animation-delay:0.2s} .typing i:nth-child(3){animation-delay:0.4s} @keyframes td { 0%,60%,100%{opacity:0.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }

    /* composer */
    .composer { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 12px 18px 14px; }
    .comp-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .comp-tab { border: none; background: none; padding: 7px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; } .comp-tab svg { width: 14px; height: 14px; } .comp-tab.on { background: var(--accent-soft); color: var(--accent); }
    .ai-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .ai-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 11px; font-size: 11.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; } .ai-btn:hover { border-color: var(--accent); color: var(--accent); } .ai-btn.spark { color: #7c3aed; border-color: #e6dcfb; } .ai-btn.spark svg { width: 12px; height: 12px; }
    .comp-box { border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; } .comp-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .comp-subject { border: none; outline: none; font-size: 13.5px; font-weight: 600; padding: 3px 2px; border-bottom: 1px solid var(--line); }
    .comp-box textarea { border: none; outline: none; resize: none; font: inherit; font-size: 13.5px; min-height: 46px; max-height: 120px; color: var(--text); }
    .comp-foot { display: flex; align-items: center; gap: 6px; }
    .comp-foot .cf-ic { width: 32px; height: 32px; border-radius: 8px; border: none; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; } .comp-foot .cf-ic:hover { background: var(--bg); color: var(--accent); } .comp-foot .cf-ic svg { width: 17px; height: 17px; }
    .send-btn { margin-left: auto; border: none; background: linear-gradient(180deg,var(--accent-2),var(--accent)); color: #fff; border-radius: 10px; padding: 9px 18px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 10px 22px -14px rgba(37,99,235,0.9); } .send-btn:hover { filter: brightness(1.07); } .send-btn svg { width: 15px; height: 15px; }
    .call-cta { margin-left: auto; border: none; background: linear-gradient(180deg,#22c55e,#16a34a); color: #fff; border-radius: 10px; padding: 9px 20px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; } .call-cta svg { width: 16px; height: 16px; }

    /* AI rail */
    .airail { border-left: 1px solid var(--line); background: #fff; overflow-y: auto; padding: 16px 15px; display: flex; flex-direction: column; gap: 16px; }
    .rc { border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .rc h3 { font-size: 12.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; } .rc h3 .spark { color: #7c3aed; display: inline-flex; } .rc h3 .spark svg { width: 15px; height: 15px; }
    .sum-row { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; } .sum-row:first-of-type { border-top: none; } .sum-row .k { color: var(--muted); } .sum-row .v { font-weight: 600; }
    .senti { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; } .senti.pos { color: #16a34a; } .senti.neu { color: #ea8a0b; }
    .prob-wrap { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; } .prob-ring { width: 46px; height: 46px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; } .prob-ring span { background: #fff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #16a34a; }
    .rec-act { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); } .rec-act .rl { font-size: 11px; color: var(--muted); font-weight: 600; } .rec-act .rv { color: var(--accent); font-weight: 700; font-size: 13px; margin-top: 3px; }
    .sugg { border: 1px solid var(--line); border-radius: 11px; padding: 11px; margin-bottom: 9px; background: linear-gradient(180deg,#fbfcff,#fff); } .sugg:last-child { margin-bottom: 0; } .sugg p { font-size: 12px; line-height: 1.45; color: #334155; } .sugg p b { color: var(--text); } .sugg .rec { color: #7c3aed; font-weight: 700; font-size: 11.5px; margin-top: 4px; } .sugg .sbtn { margin-top: 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 11px; font-size: 11px; font-weight: 700; color: var(--accent); } .sugg .sbtn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .prof-top { display: flex; flex-direction: column; align-items: center; text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); } .prof-top .av { width: 58px; height: 58px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; } .prof-top b { font-weight: 700; margin-top: 9px; } .prof-top span { font-size: 12px; color: var(--muted); }
    .prof-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; } .prof-row:first-of-type { border-top: none; } .prof-row .k { color: var(--muted); } .prof-row .v { font-weight: 600; } .stage-chip { background: #ede9fe; color: #6d28d9; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }

    /* dialer slide-over */
    .scrim { position: fixed; inset: 0; background: rgba(10,20,36,0.4); z-index: 45; opacity: 0; pointer-events: none; transition: opacity 0.2s; } .scrim.show { opacity: 1; pointer-events: auto; }
    .panel { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 94vw; background: var(--bg); z-index: 46; box-shadow: -20px 0 60px -30px rgba(0,0,0,0.5); transform: translateX(100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; } .panel.open { transform: none; }
    .dial-hero { background: linear-gradient(180deg,#0f2749,#0a1c38); color: #fff; padding: 30px 24px 24px; text-align: center; position: relative; }

    function statusIcon(s) {

    const AITONE = {

    function composerHTML(c) {
      const tabs = [["text","Text","text"],["email","Email","email"],["call","Call","call"],["video","Video","video"],["note","Internal Note","note"]];

    function wireComposer(c) {
      document.querySelectorAll(".comp-tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
      document.querySelectorAll("[data-tone]").forEach((b) => b.addEventListener("click", () => { $("compText").value = AITONE[b.dataset.tone](c); $("compText").focus(); }));
      document.querySelectorAll("[data-temp]").forEach((b) => b.addEventListener("click", () => { const key = b.dataset.temp==="Winback"?"Winback":b.dataset.temp; $("compText").value = (AITEMPLATE[key]||AITEMPLATE["Follow-up"])(c); $("compText").focus(); }));

      const ta = $("compText"); if (ta) ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey||e.ctrlKey)) { e.preventDefault(); sendMessage(c); } });
    }
    function setTab(t) { state.tab = t; const c = C.find((x)=>x.id===state.active); renderThread(c); if ($("compText")) $("compText").focus(); }

    function scrollThread() { const s = $("thScroll"); if (s) s.scrollTop = s.scrollHeight; }

    function sendMessage(c) {
      const text = ($("compText")?.value || "").trim(); if (!text && state.tab!=="video") return;
      if (state.tab === "note") { c.msgs.push({day:"Today", type:"note", body:text}); }
      else if (state.tab === "email") { c.msgs.push({day:"Today", type:"email", dir:"out", time:nowTime(), subject:$("compSubj")?.value||"Message", body:text, status:"Delivered"}); }
      else if (state.tab === "video") { c.msgs.push({day:"Today", type:"video", dir:"out", time:nowTime(), subject:"Personalized Video", body:"Recorded video message", status:"Delivered", watch:0}); }
      else { c.msgs.push({day:"Today", type:state.tab==="text"?"text":"text", dir:"out", time:nowTime(), body:text, status:"Delivered"}); }
      c.last = state.tab==="note" ? "Internal note added" : text || "Video sent"; c.time = "now"; c.needsReply = false;
      renderThread(c); renderList(); showToast(state.tab==="note"?"Note saved":state.tab==="email"?"Email sent":state.tab==="video"?"Video sent":"Message sent");
      if ((state.tab === "text" || state.tab === "email") && Math.random() > -1) simulateReply(c);
    }

    function simulateReply(c) {
      const replies = { 1:"Perfect, I'll be there at 3! And yes please send the tow package info.", 3:"Thanks for the follow-up — can we do a test drive Saturday?", 4:"Great, 6.9% works. Let's move forward!", 5:"That looks amazing, thank you!", default:"Sounds good, thank you!" };
      setTimeout(() => {
        if (state.active !== c.id) { c.unread = (c.unread||0)+1; c.last = "New reply"; renderList(); renderFilters(); return; }

        setTimeout(() => {
          document.getElementById("typingBubble")?.remove();
          c.msgs.push({day:"Today", type:"text", dir:"in", time:nowTime(), body: replies[c.id]||replies.default});
          c.last = replies[c.id]||replies.default; renderThread(c); renderList(); showToast(`${c.name} replied`);
        }, 1600);
      }, 900);
    }
    function nowTime() { const d = new Date(); let h = d.getHours(), m = d.getMinutes(); const ap = h>=12?"PM":"AM"; h=((h+11)%12)+1; return `${h}:${m.toString().padStart(2,"0")} ${ap}`; }

    /* ---- dialer ---- */

      const dur = `${Math.floor(callSecs/60)}m ${callSecs%60}s`;
      c.msgs.push({day:"Today", type:"call", dir:"out", time:nowTime(), body:"Outbound Call", status:`Connected · ${dur}`});
      c.msgs.push({day:"Today", type:"note", body:`Call summary: Discussed ${c.veh.replace(/^\d+ /,"")}. Customer engaged and positive. Next step — ${c.rec}`});
      c.last = "Call completed"; c.time = "now";
      dialer.classList.remove("open"); dialer.setAttribute("aria-hidden","true"); scrim.classList.remove("show");
      renderThread(c); renderList(); showToast(`Call logged · ${dur}`);
    }
    scrim.addEventListener("click", () => { if (dialer.classList.contains("open")) { clearInterval(callTimer); dialer.classList.remove("open"); scrim.classList.remove("show"); } });

    let toastT; function showToast(msg) { $("toastMsg").textContent = msg; const el = $("toast"); el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 2400); }

    $("search").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
    document.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") { if (e.key === "Escape") document.activeElement.blur(); return; }
      const c = C.find((x)=>x.id===state.active);
      if (e.key === "/") { e.preventDefault(); $("search").focus(); }
      else if (e.key.toLowerCase() === "r" || e.key.toLowerCase() === "t") { setTab("text"); }
      else if (e.key.toLowerCase() === "e") { setTab("email"); }
      else if (e.key.toLowerCase() === "v") { setTab("video"); }
      else if (e.key.toLowerCase() === "c") { openDialer(c); }
      else if (e.key === "Escape") { if (dialer.classList.contains("open")) endCall(c); }
    });

    renderFilters(); renderList(); openConv(1);

    /* live: periodic inbound activity */
    let liveN = 0;
    setInterval(() => {
      liveN++;
      const targets = [3,7,8,5]; const tid = targets[liveN % targets.length]; const c = C.find((x)=>x.id===tid);
      if (!c || state.active === tid) return;
      c.unread = (c.unread||0)+1; c.time = "now";
      const msgs = { 3:"Actually, is Saturday open for a test drive?", 7:"Great, what's your best price?", 8:"Do you offer financing on the Z06?", 5:"Still thinking about the Trail Boss!" };
      c.last = msgs[tid] || "New message"; c.msgs.push({day:"Today", type:c.lastType==="facebook"?"facebook":c.lastType==="chat"?"chat":"text", dir:"in", time:nowTime(), body:c.last});
      renderList(); renderFilters(); showToast(`New message from ${c.name}`);
    }, 9000);
  </script>
</body>
</html>
