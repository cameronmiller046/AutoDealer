<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Workspace — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eaeef4; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 10px 24px -18px rgba(16,32,60,0.26); --radius:15px; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:104px; height:9px; margin-bottom:4px; } .brand .wm { font-size:21px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:19px; height:19px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { margin-top:auto; display:flex; align-items:center; gap:11px; padding:14px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:38px; height:38px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13.5px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11.5px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:11px 26px; }
    .hamb { border:none; background:none; color:var(--muted); width:36px; height:36px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; } .hamb svg { width:20px; height:20px; }
    .tsearch { flex:1; max-width:420px; display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:10px 14px; color:var(--muted); }
    .tsearch svg { width:17px; height:17px; flex:none; } .tsearch input { border:none; background:none; outline:none; width:100%; font-size:13.5px; color:var(--text); }
    .live-chip { display:inline-flex; align-items:center; gap:7px; background:color-mix(in srgb,#16a34a 12%,var(--card)); color:#16a34a; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; } .live-chip .ld { width:8px; height:8px; border-radius:50%; background:#16a34a; animation:pulse 1.6s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,163,74,0.5)} 70%{box-shadow:0 0 0 6px rgba(22,163,74,0)} 100%{box-shadow:0 0 0 0 rgba(22,163,74,0)} }
    .tb-icons { display:flex; align-items:center; gap:4px; margin-left:auto; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:8px; }
    .content { padding:20px 26px 50px; }
    .phead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .phead h1 { font-size:24px; font-weight:800; letter-spacing:-0.6px; } .phead .sub { color:var(--muted); font-size:14px; margin-top:5px; }
    .head-actions { display:flex; gap:10px; }
    .btn { display:inline-flex; align-items:center; gap:8px; border-radius:11px; padding:10px 16px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); } .btn svg { width:16px; height:16px; }
    .btn-ghost { background:var(--card); border:1px solid var(--line); color:var(--text); } .btn-ghost:hover { border-color:#cfe0f7; color:var(--accent); }
    .btn-primary { background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border:none; box-shadow:0 12px 26px -14px rgba(37,99,235,0.9); }

    /* analytics strip */
    .astrip { display:grid; grid-template-columns:repeat(8,1fr); gap:11px; margin:18px 0 4px; }
    .am { background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 13px; box-shadow:var(--shadow); }
    .am .al { color:var(--muted); font-size:11px; font-weight:600; } .am .av { font-size:19px; font-weight:800; letter-spacing:-0.4px; margin-top:5px; } .am .ad { font-size:10.5px; font-weight:700; margin-top:2px; } .am .ad.up{color:#16a34a;} .am .ad.dn{color:#dc2626;} .am .ad.fl{color:var(--faint);}

    .toolbar { display:flex; align-items:center; gap:12px; margin:18px 0 14px; flex-wrap:wrap; }
    .segn { display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:11px; padding:4px; box-shadow:var(--shadow); } .segn button { border:none; background:none; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted); } .segn button.on { background:var(--accent); color:#fff; }
    .fpill { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; box-shadow:0 1px 2px rgba(16,32,60,.03); } .fpill:hover{color:var(--text);border-color:#cfe0f7;} .fpill.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    .spacer { flex:1; }
    .hint { font-size:12px; color:var(--muted); }

    /* ============ KANBAN ============ */
    .board { display:grid; grid-auto-flow:column; grid-auto-columns:300px; gap:13px; overflow-x:auto; padding-bottom:12px; }
    .col { background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:11px; min-height:200px; }
    .col-hd { display:flex; align-items:center; gap:8px; margin-bottom:11px; padding:0 3px; } .col-hd .dot { width:9px; height:9px; border-radius:50%; } .col-hd b { font-size:12.5px; font-weight:700; } .col-hd .cn { margin-left:auto; color:var(--faint); font-size:11.5px; font-weight:700; background:var(--card); border-radius:8px; padding:1px 8px; }
    .col-sum { font-size:10.5px; color:var(--muted); font-weight:600; margin-bottom:9px; padding:0 3px; }

    .deal { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; box-shadow:0 1px 2px rgba(16,32,60,0.04); transition:transform .12s, box-shadow .12s, opacity .3s; border-left:3px solid var(--dc); position:relative; } .deal:hover { transform:translateY(-2px); box-shadow:0 14px 28px -16px rgba(16,32,60,.4); } .deal.moving { opacity:0; transform:translateX(30px); }
    .deal-top { display:flex; align-items:center; gap:9px; } .deal .av { width:32px; height:32px; border-radius:50%; flex:none; color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; } .deal .dn b { font-weight:700; font-size:13px; } .deal .dn span { display:block; color:var(--muted); font-size:11px; }
    .deal .rtag { margin-left:auto; display:flex; align-items:center; gap:5px; }
    .risk { font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:6px; display:inline-flex; align-items:center; gap:3px; } .risk .rk-d{width:5px;height:5px;border-radius:50%;}
    .rk-lo{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;} .rk-lo .rk-d{background:#16a34a;} .rk-md{background:color-mix(in srgb,#d97706 15%,var(--card));color:#b45309;} .rk-md .rk-d{background:#d97706;} .rk-hi{background:color-mix(in srgb,#dc2626 13%,var(--card));color:#dc2626;} .rk-hi .rk-d{background:#dc2626;}
    .unread { background:#dc2626; color:#fff; font-size:9.5px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px; }
    .deal-veh { font-size:12px; color:var(--text); font-weight:700; margin:9px 0 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .deal-vin { font-size:10px; color:var(--faint); font-weight:600; font-family:ui-monospace,Menlo,monospace; margin-bottom:9px; }
    .deal-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px 10px; padding:9px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .dcell .k { color:var(--faint); font-size:9px; text-transform:uppercase; letter-spacing:.3px; font-weight:700; } .dcell .v { font-weight:700; font-size:12.5px; margin-top:1px; } .dcell .v.g{color:#16a34a;} .dcell .v.c{color:#7c3aed;}
    .deal-status { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
    .sp { font-size:9px; font-weight:800; padding:2px 6px; border-radius:5px; display:inline-flex; align-items:center; gap:3px; letter-spacing:.2px; }
    .sp svg{width:9px;height:9px;}
    .sp-ok{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;} .sp-pend{background:color-mix(in srgb,#d97706 15%,var(--card));color:#b45309;} .sp-off{background:color-mix(in srgb,var(--muted) 13%,var(--card));color:var(--muted);}
    .deal-foot { display:flex; align-items:center; gap:8px; margin-top:9px; font-size:10.5px; color:var(--muted); } .deal-foot .age { margin-left:auto; display:inline-flex; align-items:center; gap:4px; } .deal-foot svg{width:11px;height:11px;}
    .qa-row { display:flex; gap:5px; margin-top:9px; opacity:0; max-height:0; overflow:hidden; transition:all .16s; } .deal:hover .qa-row { opacity:1; max-height:40px; }
    .qa-row button { flex:1; border:1px solid var(--line); background:var(--card); border-radius:7px; padding:6px 0; color:var(--accent); display:inline-flex; align-items:center; justify-content:center; } .qa-row button:hover{background:var(--accent);color:#fff;border-color:transparent;} .qa-row button svg{width:14px;height:14px;}
    body[data-role="salesperson"] .mgr-only, body[data-role="bdc"] .mgr-only, body[data-role="receptionist"] .mgr-only { display:none !important; }

    /* analytics view */
    .an-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
    .an-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; }
    .an-card h3 { font-size:14px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; } .an-card h3 svg{width:16px;height:16px;color:var(--accent);} .an-card h3 .spark svg{color:#7c3aed;}
    .funnel .fn-row { display:flex; align-items:center; gap:12px; margin-bottom:9px; } .funnel .fn-row .fl { width:130px; font-size:12.5px; color:var(--muted); flex:none; } .funnel .fn-bar { flex:1; height:26px; border-radius:7px; background:var(--line); overflow:hidden; position:relative; } .funnel .fn-bar i { display:block; height:100%; border-radius:7px; } .funnel .fn-bar span { position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:11.5px; font-weight:800; color:var(--text); }
    .pen { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .pen-ring { text-align:center; } .pen-ring .pr { width:96px; height:96px; margin:0 auto; position:relative; } .pen-ring .pr b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:900; } .pen-ring .pl { font-size:12px; color:var(--muted); font-weight:600; margin-top:6px; }
    .feed { max-height:520px; overflow-y:auto; }
    .fe { display:flex; gap:11px; padding:10px 0; border-top:1px solid var(--line); } .fe:first-child{border-top:none;} .fe .fi{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;} .fe .fi svg{width:15px;height:15px;} .fe .fb b{font-size:12.5px;font-weight:700;} .fe .fb span{display:block;font-size:11.5px;color:var(--muted);} .fe .ft{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:600;white-space:nowrap;}

    /* ============ DEAL WORKSPACE MODAL ============ */
    .scrim { position:fixed; inset:0; background:rgba(10,20,36,0.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; backdrop-filter:blur(2px); } .scrim.show { opacity:1; pointer-events:auto; }
    .ws { position:fixed; inset:2.2vh 2.2vw; background:var(--bg); z-index:61; border-radius:18px; box-shadow:0 40px 100px -30px rgba(0,0,0,.6); transform:scale(.98); opacity:0; pointer-events:none; transition:.24s cubic-bezier(.2,.8,.2,1); display:grid; grid-template-columns:224px 1fr; overflow:hidden; } .ws.show { transform:none; opacity:1; pointer-events:auto; }
    .ws-side { background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; overflow-y:auto; }
    .ws-cust { display:flex; align-items:center; gap:11px; padding-bottom:15px; border-bottom:1px solid var(--line); margin-bottom:14px; } .ws-cust .av { width:44px; height:44px; border-radius:12px; flex:none; color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; } .ws-cust b { font-size:14px; font-weight:800; display:block; } .ws-cust span { font-size:11.5px; color:var(--muted); }
    .ws-nav { display:flex; flex-direction:column; gap:2px; flex:1; }
    .ws-nav button { display:flex; align-items:center; gap:11px; border:none; background:none; text-align:left; padding:9px 12px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted); } .ws-nav button:hover{background:var(--bg);color:var(--text);} .ws-nav button.on{background:var(--accent-soft);color:var(--accent);} .ws-nav button svg{width:16px;height:16px;flex:none;} .ws-nav button .wc{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--bg);color:var(--muted);border-radius:7px;padding:1px 6px;} .ws-nav button.on .wc{background:var(--card);color:var(--accent);}
    .ws-complete { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
    .ws-complete .ct { display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:6px; } .ws-complete .ct .k{color:var(--muted);font-weight:600;} .ws-complete .ct .v{font-weight:800;} .ws-complete .bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;} .ws-complete .bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:999px;}
    .ws-main { display:flex; flex-direction:column; min-width:0; }
    .ws-hd { display:flex; align-items:center; gap:14px; padding:16px 22px; background:var(--card); border-bottom:1px solid var(--line); flex:none; }
    .ws-hd h2 { font-size:17px; font-weight:800; letter-spacing:-.3px; } .ws-hd .hm { font-size:12.5px; color:var(--muted); margin-top:2px; }
    .ws-hd .stage-badge { font-size:11px; font-weight:800; padding:4px 11px; border-radius:8px; }
    .ws-x { margin-left:auto; border:none; background:var(--bg); color:var(--muted); width:36px; height:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; } .ws-x:hover{color:var(--text);} .ws-x svg{width:18px;height:18px;}
    .ws-body { flex:1; overflow-y:auto; padding:20px 22px; }
    .ws-cols { display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start; } @media(max-width:1100px){ .ws-cols{grid-template-columns:1fr;} }
    .card { background:var(--card); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); padding:16px; margin-bottom:16px; }
    .card h3 { font-size:13px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; } .card h3 svg{width:15px;height:15px;color:var(--accent);} .card h3 .spark svg{color:#7c3aed;} .card h3 .rt{margin-left:auto;font-size:12px;font-weight:800;}

    .nums .nr { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:13px; } .nums .nr:first-child{border-top:none;} .nums .nr .k{color:var(--muted);} .nums .nr .v{font-weight:600;} .nums .nr.tot{border-top:2px solid var(--line);margin-top:4px;padding-top:10px;} .nums .nr.tot .k{font-weight:700;} .nums .nr.tot .v{font-size:16px;font-weight:800;} .neg{color:#dc2626;} .pos{color:#16a34a;}

    /* commission card */
    .comm { background:linear-gradient(135deg,#0d1b34,#123a6b); color:#eaf2ff; border-radius:13px; padding:16px; margin-bottom:16px; position:relative; overflow:hidden; }
    .comm::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:radial-gradient(circle,rgba(59,130,246,.4),transparent 70%);}
    .comm h3 { font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#9dc0ff; display:flex; align-items:center; gap:7px; position:relative; } .comm h3 svg{width:14px;height:14px;}
    .comm .cbig { display:flex; align-items:flex-end; gap:12px; margin:8px 0 12px; position:relative; } .comm .cbig .cv{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1;} .comm .cbig .cc{font-size:11.5px;color:#9dc0ff;font-weight:700;padding-bottom:4px;} .comm .cbig .cc b{color:#4ade80;}
    .comm .cbrk { position:relative; } .comm .cbrk .br { display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid rgba(255,255,255,.12); font-size:12px; } .comm .cbrk .br:first-child{border-top:none;} .comm .cbrk .br .k{color:#a9c4f0;} .comm .cbrk .br .v{font-weight:700;} .comm .cbrk .br .v.plus{color:#4ade80;}
    .comm .cnote{ position:relative; font-size:11px; color:#8fb4ff; margin-top:9px; }

    /* AI assistant */
    .ai { background:linear-gradient(180deg,color-mix(in srgb,#7c3aed 6%,var(--card)),var(--card)); border-color:color-mix(in srgb,#7c3aed 18%,var(--card)); }
    .ai-item { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); } .ai-item:first-of-type{border-top:none;} .ai-item .aii{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;} .ai-item .aii svg{width:15px;height:15px;} .ai-item .aib b{font-size:12.5px;font-weight:700;display:block;} .ai-item .aib span{font-size:11.5px;color:var(--muted);} .ai-item .aig{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;align-self:center;white-space:nowrap;}
    .imp-hi{background:color-mix(in srgb,#dc2626 13%,var(--card));color:#dc2626;} .imp-md{background:color-mix(in srgb,#d97706 15%,var(--card));color:#b45309;} .imp-lo{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;}

    /* stepper */
    .stepper { display:flex; align-items:center; }
    .step { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
    .step .sc { width:26px; height:26px; border-radius:50%; background:var(--line); color:var(--faint); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; z-index:1; } .step.done .sc{background:#16a34a;color:#fff;} .step.cur .sc{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft);} .step .sc svg{width:13px;height:13px;}
    .step .sl { font-size:9px; font-weight:700; color:var(--muted); margin-top:6px; text-align:center; line-height:1.2; } .step.cur .sl{color:var(--accent);}
    .step:not(:last-child)::after { content:""; position:absolute; top:13px; left:60%; right:-40%; height:2px; background:var(--line); } .step.done:not(:last-child)::after{background:#16a34a;}

    /* quick actions */

    /* ---------- deal math ---------- */
    function calc(d){
      var netTrade = d.tradeAllow - d.payoff;
      var taxable = Math.max(0, d.price - d.tradeAllow);
      var tax = taxable * d.taxRate;
      var financed = d.price + tax + d.fees - d.rebate - d.down - netTrade;
      var r = d.apr/1200, n = d.term;
      var monthly = d.type==="cash" ? 0 : (r>0 ? financed*r/(1-Math.pow(1+r,-n)) : (n?financed/n:0));
      if (d.type==="lease"){ var residual=d.price*0.58, mf=d.apr/2400, capCost=d.price+tax+d.fees-d.rebate-d.down-netTrade; monthly=(capCost-residual)/n+(capCost+residual)*mf; financed=capCost; }
      var cashDue = d.price + tax + d.fees - d.rebate - netTrade;
      return {netTrade:netTrade, tax:tax, financed:financed, monthly:monthly, cashDue:cashDue, taxable:taxable};
    }
    function monthlyFor(fin,apr,term){ var r=apr/1200; return r>0?fin*r/(1-Math.pow(1+r,-term)):fin/term; }

    /* ---------- gross + commission ---------- */
    function gross(d){
      var c = calc(d);
      var front = Math.max(0, d.price - (d.cost || d.price*0.9));
      var reserve = d.type==="cash" ? 0 : Math.min(1500, Math.max(0, c.financed)*0.02);
      var products = d.type==="cash" ? 500 : 1500;      // warranty + gap + maintenance
      var back = Math.round(reserve + products);
      return { front:Math.round(front), back:back, total:Math.round(front+back) };
    }
    /* Configurable commission plan (dealer settings). Default: 20% front + 5% back,
       $200 mini-deal floor, priority/volume bonuses. */
    var PLAN = { frontPct:0.20, backPct:0.05, mini:200, hotBonus:250, volumeBonus:100 };
    function commission(d){
      var g = gross(d);
      var base = Math.round(g.front*PLAN.frontPct + g.back*PLAN.backPct);
      var mini = base < PLAN.mini;
      var payout = Math.max(base, PLAN.mini);
      var bonus = (d.priority==="hot"?PLAN.hotBonus:0) + (STAGE_I[d.stage]>=4?PLAN.volumeBonus:0);
      var total = payout + bonus;
      var conf = [82,86,90,94,97,99][STAGE_I[d.stage]] || 88;
      return { base:base, mini:mini, payout:payout, bonus:bonus, total:total, conf:conf, g:g };
    }
    function riskScore(d){
      var s=20; if(d.tier && /C|D/.test(d.tier.charAt(0))) s+=35; if(calc(d).netTrade<0) s+=20; if(d.down < d.price*0.08) s+=15; if(d.apr>=8) s+=10; if(d.docs<40) s+=8;
      return Math.min(96, s);
    }
    function riskClass(v){ return v>=55?"rk-hi":v>=32?"rk-md":"rk-lo"; }
    function completion(d){ // deal completion %
      var parts=[d.mApp==="approved"?1:0, d.fApp==="approved"?1:0, d.docs/100, d.signed/100, STAGE_I[d.stage]>=4?1:0.4];
      return Math.round(parts.reduce(function(a,b){return a+b;},0)/parts.length*100);
    }

      if(d.apr>=7.5) items.push(["#16a34a","trend","Customer likely qualifies for a lower APR","Tier "+(d.tier||"A")+" — re-shop to Ally/GM Financial, save ~1.2%.","lo","Rate"]);
      if(c.netTrade>0) items.push(["#7c3aed","swap","Trade equity of "+money(c.netTrade),"Use it as down to strengthen the deal.","md","Trade"]);
      if(d.type!=="cash") items.push(["#2563eb","shield","Finance reserve + F&I opportunity","GAP + warranty add ~$1,500 back-end gross.","md","F&I"]);
      if(d.docs<60) items.push(["#dc2626","alert","Missing paperwork blocks funding","Deal is "+d.docs+"% complete — collect the remaining docs.","hi","Docs"]);
      items.push(["#16a34a","spark","Likelihood to close: high","Recommended next action: lock the appointment & desk the numbers.","lo","Close"]);
      return '<div class="card ai"><h3><span class="spark">'+svg("spark")+'</span>AI Deal Assistant</h3>'+items.slice(0,4).map(function(x){ return '<div class="ai-item"><span class="aii" style="background:'+x[0]+'1e;color:'+x[0]+'">'+svg(x[1])+'</span><div class="aib"><b>'+x[2]+'</b><span>'+x[3]+'</span></div><span class="aig imp-'+x[4]+'">'+x[5]+'</span></div>'; }).join("")+'</div>';
    }
    function structureCard(d){
      var c=calc(d), g=gross(d);
      return '<div class="card nums"><h3>'+svg("dollar")+'Deal Structure <span class="rt mgr-only" style="color:#16a34a">Gross '+money(g.total)+'</span></h3>'+
        nr("Sale Price",money(d.price))+
        (d.tradeAllow?nr("Trade Allowance",money(d.tradeAllow)):"")+
        (d.payoff?nr("Trade Payoff","-"+money(d.payoff)):"")+
        (d.tradeAllow?nr("Net Trade "+(c.netTrade<0?"(neg. equity)":"(equity)"), c.netTrade<0?'<span class="neg">-'+money(-c.netTrade)+'</span>':'<span class="pos">+'+money(c.netTrade)+'</span>'):"")+
        nr("Sales Tax ("+(d.taxRate*100).toFixed(1)+"%)",money(c.tax))+
        nr("Doc &amp; Fees",money(d.fees))+
        (d.rebate?nr("Rebates","-"+money(d.rebate)):"")+
        nr("Cash Down","-"+money(d.down))+
        '<div class="nr tot"><span class="k">'+(d.type==="cash"?"Total Cash Due":"Amount Financed")+'</span><span class="v">'+money(d.type==="cash"?c.cashDue:c.financed)+'</span></div>'+
        (d.type!=="cash"?'<div class="nr" style="border-top:none;padding-top:6px"><span class="k">'+d.term+' mo @ '+d.apr+'% '+(d.type==="lease"?"lease":"APR")+'</span><span class="v" style="color:var(--accent);font-size:15px">'+money(c.monthly)+'/mo</span></div>':"")+'</div>';
    }
    function nr(k,v){ return '<div class="nr"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

    function wsSummary(d){
      var si=STAGE_I[d.stage];
      return '<div class="card"><h3>'+svg("list")+'Deal Progress</h3><div class="stepper">'+STAGES.map(function(s,i){ var cls=i<si?"done":i===si?"cur":""; return '<div class="step '+cls+'"><span class="sc">'+(i<si?svg("check"):(i+1))+'</span><span class="sl">'+s[1]+'</span></div>'; }).join("")+'</div></div>'+
        '<div class="ws-cols"><div>'+structureCard(d)+
          '<div class="card"><h3>'+svg("list")+'Quick Actions</h3><div class="ws-qa">'+
            [["call","Call","call"],["text","Text","text"],["email","Email","email"],["docs","Generate","doc"],["payment","Payment","dollar"],["trade","Trade","swap"],["reserve","Reserve","key"],["print","Print Packet","print"],["approval","Request Approval","gavel"],["chat","Mgr Chat","chat"],["ai","AI Review","spark"],["workspace","Reserve Veh","key"]].slice(0,12).map(function(a){ return '<button data-q="'+a[0]+'">'+svg(a[2])+a[1]+'</button>'; }).join("")+'</div></div>'+
        '</div><div>'+commCard(d)+aiCard(d)+'</div></div>';
    }
    function wsFinance(d){
      var c=calc(d);
      return '<div class="ws-cols"><div><div class="card"><h3>'+svg("bank")+'Financing</h3><div class="fld-grid">'+
          fld("Lender",d.lender)+fld("Type",d.type.charAt(0).toUpperCase()+d.type.slice(1))+
          fld("APR",d.apr+"%")+fld("Term",d.term+" months")+
          fld("Amount Financed",money(c.financed))+fld("Monthly Payment",money(c.monthly))+
          (canCredit()?fld("Credit Tier",d.tier)+fld("Decision","Approved"):'<div class="fld" style="grid-column:span 2"><label>Credit Tier</label><input value="Restricted — F&I access only" disabled></div>')+
        '</div></div>'+
        '<div class="card"><h3>'+svg("shield")+'F&amp;I Products</h3>'+
          [["Extended Warranty (7yr/100k)","$2,400","Recommended"],["GAP Insurance","$695","Recommended"],["Prepaid Maintenance","$1,150","Optional"],["Tire & Wheel","$895","Optional"]].map(function(p){ return '<div class="dl"><span class="di" style="background:'+(p[2]==="Recommended"?"#16a34a":"#64748b")+'1e;color:'+(p[2]==="Recommended"?"#16a34a":"#64748b")+'">'+svg("shield")+'</span><div class="db"><b>'+p[0]+'</b><span>'+p[2]+'</span></div><span class="dstat '+(p[2]==="Recommended"?"ds-completed":"ds-notstarted")+'">'+p[1]+'</span></div>'; }).join("")+'</div>'+
        '</div><div>'+commCard(d)+'</div></div>';
    }
    function wsTrade(d){
      var c=calc(d);
      if(!d.tradeAllow) return '<div class="card"><h3>'+svg("swap")+'Trade-In</h3><div style="color:var(--muted);font-size:13px;padding:14px 2px">No trade on this deal. <button class="btn btn-ghost" style="margin-left:8px" id="addTrade">Add a trade</button></div></div>';
      return '<div class="ws-cols"><div><div class="card"><h3>'+svg("swap")+'Trade-In Appraisal</h3><div class="fld-grid">'+
          fld("Allowance",money(d.tradeAllow))+fld("Payoff",money(d.payoff))+
          fld("Net "+(c.netTrade<0?"(negative equity)":"(equity)"),(c.netTrade<0?"-":"+")+money(Math.abs(c.netTrade)))+fld("ACV (actual cash value)",money(d.tradeAllow-1800))+
        '</div></div></div><div><div class="card ai"><h3><span class="spark">'+svg("spark")+'</span>Trade Insight</h3><div class="ai-item"><span class="aii" style="background:#7c3aed1e;color:#7c3aed">'+svg("trend")+'</span><div class="aib"><b>Market value up 3.1% this week</b><span>Wholesale demand strong — allowance is competitive.</span></div></div></div></div></div>';
    }
    function fld(l,v){ return '<div class="fld"><label>'+l+'</label><input value="'+v+'"></div>'; }

    /* ---------- documents ---------- */
    var DOC_CATS = [
      ["Purchase Agreement","signed","Jordan Avery","v3","2h ago"],
      ["Retail Installment Contract","completed","F&I · Tom Fielder","v2","1h ago"],
      ["Credit Application","signed","Customer","v1","Yesterday"],
      ["Driver License","completed","Front desk","v1","Yesterday"],
      ["Insurance Card","notstarted","—","—","—"],
      ["Odometer Statement","draft","Jordan Avery","v1","3h ago"],
      ["Buyer's Order","draft","Jordan Avery","v2","30m ago"],
      ["Privacy Notice","completed","System","v1","Yesterday"],
      ["Trade Documents","draft","Jordan Avery","v1","3h ago"],
      ["We Owe","notstarted","—","—","—"],
      ["Warranty Forms","notstarted","—","—","—"],
      ["Temporary Tag","notstarted","—","—","—"]
    ];
    function docsFor(d){ return DOC_CATS; }
    var DOC_IC={signed:"check",completed:"doc",draft:"doc",notstarted:"doc",printed:"print"};
    function wsDocuments(d){
      var docs=docsFor(d);
      var missing=[]; if(d.signed<100) missing.push("Customer signature on Buyer's Order");
      docs.forEach(function(x){ if(x[1]==="notstarted") missing.push(x[0]); });
      var comp=Math.round(docs.filter(function(x){return x[1]==="signed"||x[1]==="completed"||x[1]==="printed";}).length/docs.length*100);
      var esPct=d.signed;
      return '<div class="ws-cols"><div>'+
        '<div class="card"><h3>'+svg("pkt")+'Smart Packet Builder</h3><div class="pkt">'+["Cash Deal","Finance Packet","Lease Packet","Trade Packet","Out-of-State","Commercial","Custom"].map(function(p){ return '<button data-pkt="'+p+'">'+p+'</button>'; }).join("")+'</div>'+
          '<div class="missing"><div class="mt">'+svg("alert")+'Missing Document Detection · Deal '+comp+'% complete</div><ul>'+(missing.length?missing.slice(0,5).map(function(m){return '<li>'+m+'</li>';}).join(""):'<li>All required documents present ✓</li>')+'</ul></div>'+
          docs.map(function(x){ var st=x[1]; var lbl={signed:"Signed",completed:"Completed",draft:"Draft",notstarted:"Not Started",printed:"Printed"}[st]; var col={signed:"#16a34a",completed:"#2563eb",draft:"#d97706",notstarted:"#64748b",printed:"#7c3aed"}[st]; return '<div class="dl"><span class="di" style="background:'+col+'1e;color:'+col+'">'+svg(DOC_IC[st])+'</span><div class="db"><b>'+x[0]+'</b><span>'+(x[2]!=="—"?x[2]+" · "+x[3]+" · "+x[4]:"Awaiting start")+'</span></div><span class="dstat ds-'+st+'">'+lbl+'</span><button class="dgo" data-doc="'+x[0]+'" title="Open editor">'+svg("doc")+'</button></div>'; }).join("")+'</div>'+
        '</div><div>'+
          '<div class="card"><h3>'+svg("doc")+'E-Signature</h3><div class="esign"><div class="es-hd"><span class="k">Signature progress</span><span class="v">'+esPct+'%</span></div><div class="bar"><i style="width:'+esPct+'%"></i></div>'+
            '<div class="es-steps">'+[["Sent","check"],["Viewed","check"],["Opened",esPct>0?"check":""],["Signed",esPct>=100?"check":""],["Certified",esPct>=100?"check":""]].map(function(s,i){ var on=(i<2)||(i===2&&esPct>0)||(i>=3&&esPct>=100); return '<div class="est '+(on?"on":"")+'"><span class="ed">'+(on?svg("check"):(i+1))+'</span>'+s[0]+'</div>'; }).join("")+'</div>'+
            '<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5">'+(esPct>=100?"Signed "+"· IP 73.12.44.9 · certificate on file":esPct>0?"Viewed on customer portal · awaiting signature":"Not yet sent for signature")+'</div></div>'+
            '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost" style="flex:1" id="esSend">'+svg("email")+'Send to sign</button><button class="btn btn-ghost" style="flex:1" id="esRemind">Remind</button></div></div>'+
          '<div class="card"><h3>'+svg("print")+'Printing Center</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
            '<button class="btn btn-ghost" data-print="all">'+svg("print")+'Print All</button>'+
            '<button class="btn btn-ghost" data-print="packet">'+svg("pkt")+'Print Packet</button>'+
            '<button class="btn btn-ghost" data-print="pdf">'+svg("doc")+'Download PDF</button>'+
            '<button class="btn btn-ghost" data-print="preview">'+svg("doc")+'Preview</button>'+
          '</div><div style="font-size:11px;color:var(--muted);margin-top:10px">Printer: Front Office HP · Letter · 2 copies · duplex</div></div>'+
        '</div></div>';
    }

    function wsComm(d){
      var msgs=[["#2563eb","text","in",d.cust,"Today 9:12 AM","Can I come in tomorrow? Is the tow package included?"],["#7c3aed","doc","out","You","Yesterday","Sent Buyer's Order for e-signature"],["#6366f1","email","out","You","Yesterday","Payment estimate — opened, PDF downloaded"],["#16a34a","call","out","You","Mon","Call — discussed trade · 4m 12s"]];
      return '<div class="card"><h3>'+svg("chat")+'Deal Communication</h3>'+msgs.map(function(m){ return '<div class="cmz"><span class="ci" style="background:'+m[0]+'1e;color:'+m[0]+'">'+svg(m[1])+'</span><div class="cb"><div class="ch"><b>'+m[3]+'</b><span class="t">'+m[4]+'</span></div><div class="cp">'+m[5]+'</div></div></div>'; }).join("")+
        '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-ghost" data-q="call">'+svg("call")+'Call</button><button class="btn btn-ghost" data-q="text">'+svg("text")+'Text</button><button class="btn btn-ghost" data-q="email">'+svg("email")+'Email</button></div></div>';
    }
    function wsTimeline(d){
      var si=STAGE_I[d.stage];
      var ev=[["#2563eb","Deal submitted","by "+d.rep+" · 2h ago"],["#ea8a0b","Manager review","Desking numbers"],["#2563eb","Desk numbers set","Payment "+money(calc(d).monthly)+"/mo"],["#7c3aed","Trade approved","Appraisal signed off"],["#0891b2","Sent to finance","F&I products offered"],["#16a34a","Ready for delivery","Paperwork complete"]];
      return '<div class="card"><h3>'+svg("clock")+'Deal Timeline</h3>'+ev.slice(0,Math.max(1,si+1)).map(function(e,i){ return '<div class="tl2"><span class="tl2-dot" style="background:'+(i<=si?e[0]:"#dfe4ec")+';box-shadow:0 0 0 4px '+(i<=si?e[0]+"22":"transparent")+'"></span><div><b>'+e[1]+'</b><span>'+e[2]+'</span></div></div>'; }).join("")+'</div>';
    }
    function wsApprovals(d){
      var si=STAGE_I[d.stage];
      var mgrView=isMgr();
      var reqs=[["Approve","check"],["Request More Down","dollar"],["Increase Gross","trend"],["Reduce Discount","dollar"],["Change Lender","bank"],["Request Changes","doc"]];
      return '<div class="card"><h3>'+svg("gavel")+'Approval Workflow</h3>'+
        '<div class="nums"><div class="nr"><span class="k">Manager Approval</span><span class="v" style="color:'+(d.mApp==="approved"?"#16a34a":"#d97706")+'">'+(d.mApp==="approved"?"Approved":"Pending")+'</span></div>'+
          '<div class="nr"><span class="k">Finance Approval</span><span class="v" style="color:'+(d.fApp==="approved"?"#16a34a":d.fApp==="pending"?"#d97706":"#64748b")+'">'+(d.fApp==="approved"?"Approved":d.fApp==="pending"?"Pending":"Not started")+'</span></div>'+
          '<div class="nr"><span class="k">Lender</span><span class="v">'+d.lender+'</span></div></div>'+
        (mgrView?'<div style="margin-top:14px"><div class="apv-grid">'+reqs.map(function(r){ return '<button data-apv="'+r[0]+'">'+svg(r[1])+r[0]+'</button>'; }).join("")+'</div>'+
          '<div class="apv-main"><button class="apv-rej" data-apv="Reject">Reject Deal</button><button class="apv-ok" data-apv="approve-advance">'+(si>=STAGES.length-1?"Complete Delivery":"Approve → "+STAGES[si+1][1])+'</button></div></div>'
          :'<div style="margin-top:14px;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:14px">Approvals are handled by a manager. <button class="btn btn-primary" style="margin-top:10px" data-apv="request">Request Manager Approval</button></div>')+
        '</div>';
    }
    function wsAudit(d){
      var rows=[["2h ago",d.rep,"Submitted deal to desk"],["1h 40m ago","Dana Morales","Opened deal · reviewed structure"],["1h 30m ago","Dana Morales","Adjusted APR 7.4% → 6.9%"],["1h ago","System","Recalculated payment "+money(calc(d).monthly)+"/mo"],["55m ago","Tom Fielder","Pulled credit · tier "+(d.tier||"A")],["40m ago",d.rep,"Sent Buyer's Order for e-sign"],["12m ago","Customer","Viewed documents · IP 73.12.44.9"]];
      return '<div class="card"><h3>'+svg("shield")+'Audit History</h3>'+rows.map(function(r){ return '<div class="audit-row"><span class="at">'+r[0]+'</span><span class="au">'+r[1]+'</span><span class="ax">'+r[2]+'</span></div>'; }).join("")+'</div>';
    }

    function wireWSBody(d){
      var b=$("wsBody");
      b.querySelectorAll("[data-q]").forEach(function(x){ x.addEventListener("click", function(){ var k=x.dataset.q;
        if(k==="call"||k==="text") qa(k,d);
        else if(k==="email") toast("Email composer for "+d.cust);
        else if(k==="docs"){ wsTab="documents"; renderWS(); }
        else if(k==="payment"||k==="trade") { wsTab=k==="payment"?"finance":"trade"; renderWS(); }
        else if(k==="print") printPacket(d);
        else if(k==="approval"||k==="chat"){ wsTab="approvals"; renderWS(); }
        else if(k==="ai") toast("AI review complete — see AI Deal Assistant");
        else if(k==="reserve"||k==="workspace") toast(d.veh+" reserved for "+d.cust);
      }); });
      b.querySelectorAll("[data-doc]").forEach(function(x){ x.addEventListener("click", function(){ openEditor(d, x.dataset.doc); }); });
      b.querySelectorAll("[data-pkt]").forEach(function(x){ x.addEventListener("click", function(){ toast("Built "+x.dataset.pkt+" packet — required forms attached"); }); });
      b.querySelectorAll("[data-print]").forEach(function(x){ x.addEventListener("click", function(){ if(x.dataset.print==="preview"){ openEditor(d,"Buyer's Order"); } else printPacket(d); }); });
      b.querySelectorAll("[data-apv]").forEach(function(x){ x.addEventListener("click", function(){ approval(d, x.dataset.apv); }); });
      var es=b.querySelector("#esSend"); if(es) es.addEventListener("click", function(){ d.signed=Math.max(40,d.signed); toast("Sent to "+d.cust+" for e-signature"); renderWS(); });
      var er=b.querySelector("#esRemind"); if(er) er.addEventListener("click", function(){ toast("Signature reminder sent"); });
      var at=b.querySelector("#addTrade"); if(at) at.addEventListener("click", function(){ toast("Trade appraisal started"); });
    }
    function approval(d, act){
      var si=STAGE_I[d.stage];
      if(act==="approve-advance"){ if(si>=STAGES.length-1){ toast(d.cust+"'s vehicle marked delivered 🎉"); D=D.filter(function(x){return x.id!==d.id;}); closeWS(); renderStrip(); return; } d.mApp="approved"; d.stage=STAGES[si+1][0]; d.priority="normal"; toast(d.cust+"'s deal approved → "+STAGES[si+1][1]); renderStrip(); renderWS(); }
      else if(act==="Reject"){ toast(d.cust+"'s deal rejected — sent back to "+d.rep); closeWS(); }
      else if(act==="request"){ toast("Approval requested from desk manager"); }
      else { toast('"'+act+'" sent to '+d.rep+" · deal updated in real time"); if(act==="Approve"){ d.mApp="approved"; renderWS(); } }
      renderView();
    }

    /* ---------- full-screen document editor ---------- */
    var edScrim=$("edScrim"), editor=$("editor");
    function openEditor(d, docName){
      var c=calc(d);
      var fields=[
        ["Buyer / Customer",d.cust],["Co-Buyer",""],["Address","2140 Peachtree Rd, Atlanta, GA 30309"],["Phone","(678) 555-0142"],
        ["Year / Make / Model",d.veh],["VIN",d.vin],["Stock Number",d.stock],["Mileage","12"],
        ["Sale Price",money(d.price)],["Trade Allowance",d.tradeAllow?money(d.tradeAllow):"—"],["Trade Payoff",d.payoff?money(d.payoff):"—"],["Cash Down",money(d.down)],
        ["Sales Tax",money(c.tax)],["Doc Fee",money(d.fees)],["Rebate",d.rebate?money(d.rebate):"—"],[d.type==="cash"?"Total Cash Due":"Amount Financed",money(d.type==="cash"?c.cashDue:c.financed)],
        ["Lender",d.lender],["APR / Term",d.type==="cash"?"Cash":d.apr+"% / "+d.term+" mo"],["Salesperson",d.rep+" Avery"],["Deal Date","Today"]
      ];
      editor.innerHTML=''+
        '<div class="ed-hd"><div><h2>'+docName+'</h2><div class="em">'+d.cust+' · Stock '+d.stock+'</div></div><span class="autopop">'+svg("check")+'Auto-populated from deal</span><button class="ex" id="edX">'+svg("x")+'</button></div>'+
        '<div class="ed-body"><div class="paper"><div class="ph"><div class="co">AUTO<b>DEALER</b></div><div class="ct">'+docName+'<br>North Valley Chevrolet<br>DMS #4471-A</div></div>'+
          '<h4>Purchaser &amp; Vehicle</h4><div class="prow">'+fields.slice(0,8).map(pfEditable).join("")+'</div>'+
          '<h4>Financial Terms</h4><div class="prow">'+fields.slice(8,16).map(pfEditable).join("")+'</div>'+
          '<h4>Financing &amp; Signatures</h4><div class="prow">'+fields.slice(16).map(pfEditable).join("")+'</div>'+
          '<div class="sig-box" id="sigBox" data-signed="0">Click to capture customer signature</div>'+
        '</div></div>'+
        '<div class="ed-ft"><button id="edPrev">'+svg("doc")+'Preview</button><button id="edPrint">'+svg("print")+'Print</button><button id="edPdf">'+svg("doc")+'Download PDF</button><div class="sp"></div><button class="save" id="edSave">'+svg("check")+'Save Draft</button><button class="esn" id="edSign">'+svg("doc")+'Send for e-Sign</button></div>';
      edScrim.classList.add("show"); editor.classList.add("show");
      $("edX").addEventListener("click", closeEditor);
      $("sigBox").addEventListener("click", function(){ var s=$("sigBox"); if(s.dataset.signed==="1"){ s.dataset.signed="0"; s.classList.remove("signed"); s.textContent="Click to capture customer signature"; } else { s.dataset.signed="1"; s.classList.add("signed"); s.textContent=d.cust; } });
      $("edPrint").addEventListener("click", function(){ window.print(); });
      $("edPdf").addEventListener("click", function(){ toast("Generating PDF of "+docName+"…"); });
      $("edPrev").addEventListener("click", function(){ toast("Preview mode"); });
      $("edSave").addEventListener("click", function(){ toast(docName+" saved as draft"); closeEditor(); });
      $("edSign").addEventListener("click", function(){ d.signed=Math.max(d.signed,40); toast(docName+" sent to "+d.cust+" for e-signature"); closeEditor(); renderWS(); });
    }
    function pfEditable(f){ var editableVal = f[1]||""; return '<div class="pf"><div class="pl">'+f[0]+'</div><input value="'+String(editableVal).replace(/"/g,"&quot;")+'" '+(f[1]?"":"placeholder=\"—\"")+'></div>'; }
    function closeEditor(){ editor.classList.remove("show"); edScrim.classList.remove("show"); }
    edScrim.addEventListener("click", closeEditor);

    function printPacket(d){ toast("Sending "+d.cust+"'s deal packet to Front Office HP…"); }

    /* ---------- toolbar wiring ---------- */
    document.querySelectorAll("#viewSeg button").forEach(function(b){ b.addEventListener("click", function(){ document.querySelectorAll("#viewSeg button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); view=b.dataset.v; renderView(); }); });
    $("search").addEventListener("input", function(e){ q=e.target.value; if(view!=="analytics") renderView(); });
    $("analyticsBtn").addEventListener("click", function(){ view="analytics"; document.querySelectorAll("#viewSeg button").forEach(function(x){x.classList.toggle("on",x.dataset.v==="analytics");}); renderView(); });
    $("newDealBtn").addEventListener("click", function(){ if(window.ADWire&&ADWire.openAction) ADWire.openAction("New Deal"); else toast("Start a new deal"); });

    var toastT; function toast(msg){ $("toastMsg").textContent=msg; var el=$("toast"); el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},2400); }

    function boot(){ document.body.setAttribute("data-role", role()); renderStrip(); renderFilters(); renderView(); }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  </script>
</body>
</html>
