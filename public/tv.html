<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showroom Live — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --gold:#f5b638; --green:#22c55e; --blue:#3b82f6; --blue2:#60a5fa; --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.045); --muted:#8ea3c4; --faint:#61738f; }
    * { margin:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:radial-gradient(1200px 700px at 80% -10%, #12224a, #060d1a 55%), #060d1a; color:#eaf1fb; -webkit-font-smoothing:antialiased; overflow:hidden; }
    .muted { color:#8ea3c4; } .faint { color:#61738f; }
    .tv { height:100vh; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:16px; padding:20px 26px; }

    /* topbar */
    .top { display:flex; align-items:center; gap:20px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .brand .sw { width:118px; height:10px; } .brand .wm { font-size:26px; font-weight:900; letter-spacing:0.5px; } .brand .wm b { color:#3b8fff; }
    .live { display:inline-flex; align-items:center; gap:9px; background:rgba(34,197,94,.14); color:#4ade80; border:1px solid rgba(34,197,94,.3); border-radius:999px; padding:8px 15px; font-size:14px; font-weight:800; letter-spacing:.5px; } .live .d { width:10px; height:10px; border-radius:50%; background:#22c55e; animation:pulse 1.6s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)} 70%{box-shadow:0 0 0 10px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)} }
    .clock { margin-left:auto; text-align:right; } .clock .t { font-size:34px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums; line-height:1; } .clock .dt { color:#8ea3c4; font-size:14px; font-weight:600; margin-top:4px; }
    .ctrl { border:1px solid var(--line); background:rgba(255,255,255,.05); color:#cdd9ec; border-radius:11px; padding:9px 11px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; gap:7px; align-items:center; } .ctrl:hover{background:rgba(255,255,255,.1);} .ctrl svg{width:15px;height:15px;}

    /* KPI hero row */
    .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
    .kpi { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 20px; position:relative; overflow:hidden; }
    .kpi .kl { color:#8ea3c4; font-size:14px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
    .kpi .kv { font-size:52px; font-weight:900; letter-spacing:-2px; line-height:1; margin-top:8px; }
    .kpi .kd { font-size:13.5px; font-weight:700; margin-top:8px; } .kpi .kd.up{color:#4ade80;}
    .kpi.accent { background:linear-gradient(150deg, rgba(59,130,246,.22), rgba(59,130,246,.05)); border-color:rgba(59,130,246,.35); } .kpi.accent .kv{color:#7db5ff;}
    .kpi.gold { background:linear-gradient(150deg, rgba(245,182,56,.18), rgba(245,182,56,.04)); border-color:rgba(245,182,56,.3); } .kpi.gold .kv{color:#f6c76a;}

    /* main grid */
    .main { display:grid; grid-template-columns:1.15fr 1.1fr 1fr; gap:16px; min-height:0; }
    .col { display:flex; flex-direction:column; gap:16px; min-height:0; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-height:0; display:flex; flex-direction:column; }
    .panel h2 { font-size:15px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:#a9bcda; margin-bottom:14px; display:flex; align-items:center; gap:10px; } .panel h2 svg{width:17px;height:17px;color:#6b81a3;} .panel h2 .cnt{margin-left:auto;color:#61738f;font-size:13px;font-weight:800;}
    .grow { flex:1; min-height:0; overflow:hidden; }

    /* leaderboard */
    .lb { display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--line); } .lb:first-child{border-top:none;}
    .lb .rk { width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; background:rgba(255,255,255,.07); color:#8ea3c4; }
    .lb.t1 .rk{background:linear-gradient(180deg,#fde68a,#f59e0b);color:#5a3906;} .lb.t2 .rk{background:linear-gradient(180deg,#e5e9f0,#aab6c8);color:#2c3648;} .lb.t3 .rk{background:linear-gradient(180deg,#fbcfa0,#e08b4d);color:#5a2c0e;}
    .lb .av { width:44px; height:44px; border-radius:50%; flex:none; color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; }
    .lb .who { flex:1; min-width:0; } .lb .who b { font-size:19px; font-weight:800; } .lb .who .bar { height:8px; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden; margin-top:7px; } .lb .who .bar > i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#3b82f6,#60a5fa); width:0; transition:width .8s cubic-bezier(.2,.7,.3,1); }
    .lb .sold { text-align:right; flex:none; } .lb .sold .n { font-size:30px; font-weight:900; letter-spacing:-1px; line-height:1; } .lb .sold .l { font-size:11px; color:#61738f; font-weight:700; text-transform:uppercase; }

    /* goal ring */
    .goal { display:flex; align-items:center; gap:22px; }
    .ring { width:150px; height:150px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; } .ring::after{content:"";position:absolute;} .ring .inner { width:118px; height:118px; border-radius:50%; background:#0a1428; display:flex; flex-direction:column; align-items:center; justify-content:center; } .ring .inner .p { font-size:40px; font-weight:900; letter-spacing:-2px; color:#7db5ff; } .ring .inner .s { font-size:12px; color:#8ea3c4; font-weight:700; }
    .goal .gd .gv { font-size:40px; font-weight:900; letter-spacing:-1.5px; } .goal .gd .gv small { font-size:20px; color:#61738f; } .goal .gd .gl { color:#8ea3c4; font-size:14px; font-weight:700; margin-top:2px; } .goal .gd .gsub { display:flex; gap:24px; margin-top:14px; } .goal .gd .gsub b{font-size:22px;font-weight:900;display:block;} .goal .gd .gsub span{font-size:12px;color:#61738f;font-weight:700;}

    /* hot prospects */
    .hp { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .hp:first-child{border-top:none;} .hp .av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;} .hp b{font-size:16px;font-weight:700;} .hp span{display:block;color:#8ea3c4;font-size:12.5px;} .hp .flame{margin-left:auto;color:#fb7185;font-weight:900;font-size:15px;}

    /* activity feed */
    .feed { display:flex; flex-direction:column; gap:2px; }
    .fi { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .fi:first-child{border-top:none;} .fi.new{animation:flashIn .7s ease;} @keyframes flashIn{from{background:rgba(59,130,246,.12)}to{background:transparent}}
    .fi .ic { width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; } .fi .ic svg{width:16px;height:16px;} .fi b{font-size:15px;font-weight:700;} .fi span{display:block;color:#61738f;font-size:12px;} .fi .tm{margin-left:auto;color:#4d5f7a;font-size:12px;font-weight:600;white-space:nowrap;}
    .ac-sale{background:rgba(34,197,94,.15);color:#4ade80;} .ac-appt{background:rgba(59,130,246,.15);color:#7db5ff;} .ac-lead{background:rgba(124,58,237,.15);color:#b794f6;} .ac-deliv{background:rgba(245,182,56,.15);color:#f6c76a;} .ac-trade{background:rgba(236,72,153,.15);color:#f0a1c8;}

    /* small rows (deliveries, birthdays) */
    .srow { display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--line); } .srow:first-child{border-top:none;} .srow .av{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;} .srow b{font-size:15px;font-weight:700;} .srow span{display:block;color:#8ea3c4;font-size:12px;} .srow .r{margin-left:auto;color:#8ea3c4;font-size:13px;font-weight:700;}
    .cake{color:#f0a1c8;}

    /* announcements marquee */
    .ann { background:linear-gradient(90deg, rgba(59,130,246,.16), rgba(124,58,237,.12)); border:1px solid var(--line); border-radius:16px; padding:0; overflow:hidden; height:56px; display:flex; align-items:center; }
    .ann .tag { flex:none; background:#3b82f6; color:#fff; font-weight:900; font-size:13px; letter-spacing:.5px; padding:0 20px; height:100%; display:flex; align-items:center; gap:9px; } .ann .tag svg{width:16px;height:16px;}
    .ann .track { flex:1; overflow:hidden; white-space:nowrap; } .ann .track .run { display:inline-block; padding-left:100%; animation:marq 26s linear infinite; font-size:17px; font-weight:700; } .ann .track .run b{color:#f6c76a;} .ann .track .run .sep{color:#4d5f7a;margin:0 26px;}
    @keyframes marq { from{transform:translateX(0)} to{transform:translateX(-100%)} }

    /* sale celebration overlay */
    .celebrate { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; background:rgba(6,13,26,.6); opacity:0; pointer-events:none; transition:opacity .3s; } .celebrate.show{opacity:1;}
    .celebrate .cbox { background:linear-gradient(150deg,#153a22,#0a1c38); border:2px solid rgba(34,197,94,.5); border-radius:24px; padding:36px 52px; text-align:center; transform:scale(.9); transition:transform .3s; box-shadow:0 30px 80px -20px rgba(34,197,94,.5); } .celebrate.show .cbox{transform:scale(1);}
    .celebrate .trophy { width:70px; height:70px; border-radius:50%; background:linear-gradient(180deg,#fde68a,#f59e0b); color:#5a3906; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; } .celebrate .trophy svg{width:38px;height:38px;}
    .celebrate .ct { font-size:38px; font-weight:900; letter-spacing:-1px; } .celebrate .cs { font-size:19px; color:#a9e6c0; margin-top:6px; font-weight:600; }

    @media (max-width:1200px){ .kpis{grid-template-columns:repeat(3,1fr);} .main{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>
  <div class="tv">
    <div class="top">
      <div class="brand"><svg class="sw" viewBox="0 0 118 10"><path d="M2 8 C28 1, 90 1, 116 5" fill="none" stroke="#3b8fff" stroke-width="2.6" stroke-linecap="round"/></svg><span class="wm">AUTO<b>DEALER</b></span></div>
      <span class="live"><span class="d"></span>SHOWROOM · LIVE</span>
      <div class="clock"><div class="t" id="clock">--:--:--</div><div class="dt" id="date">—</div></div>
      <button class="ctrl" id="fsBtn"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Fullscreen</button>
      <a class="ctrl" href="/manager"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Exit</a>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="main">
      <div class="col">
        <div class="panel grow"><h2><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.5 7.1 18.2l.9-5.5-4-3.9L9.5 8z" fill="currentColor"/></svg>Sales Leaderboard <span class="cnt">Today</span></h2><div class="grow" id="leaderboard"></div></div>
      </div>
      <div class="col">
        <div class="panel"><h2><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Dealership Goal</h2><div class="goal" id="goal"></div></div>
        <div class="panel grow"><h2><svg viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-10h-6z" fill="currentColor"/></svg>Hot Prospects <span class="cnt" id="hpCnt">8</span></h2><div class="grow" id="hot"></div></div>
      </div>
      <div class="col">
        <div class="panel grow"><h2><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Live Activity</h2><div class="grow feed" id="feed"></div></div>
        <div class="panel"><h2><svg viewBox="0 0 24 24"><path d="M2 8h11v9H2zM13 11h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Deliveries &amp; Birthdays</h2><div id="misc"></div></div>
      </div>
    </div>

    <div class="ann"><span class="tag"><svg viewBox="0 0 24 24"><path d="M3 11l14-7v16L3 13v5H1v-7zM17 8a3 3 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>ANNOUNCEMENTS</span><div class="track"><span class="run" id="annRun"></span></div></div>
  </div>

  <div class="celebrate" id="celebrate"><div class="cbox"><div class="trophy"><svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-10 0zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M9 13h6v3H9zM8 20h8M10 16v4M14 16v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></div><div class="ct" id="celTitle">SALE!</div><div class="cs" id="celSub"></div></div></div>

  <script>
    var $ = function(id){ return document.getElementById(id); };
    var money=function(n){ return "$"+Math.round(n).toLocaleString(); };

    var KPI = { today:9, mtd:142, goal:180, appts:23, deliv:4, gross:612000 };
    function renderKPIs(){
      $("kpis").innerHTML =
        card("accent","Sold Today", KPI.today, "+3 vs yesterday", true)+
        card("","Month to Date", KPI.mtd, KPI.mtd+" / "+KPI.goal+" goal", false)+
        card("gold","Gross MTD", money(KPI.gross), "+11% vs last month", true)+
        card("","Appointments", KPI.appts, "8 confirmed today", false)+
        card("","Deliveries", KPI.deliv, "today", false);
    }
    function card(cls,l,v,d,up){ return '<div class="kpi '+cls+'"><div class="kl">'+l+'</div><div class="kv">'+(typeof v==="number"?v.toLocaleString():v)+'</div><div class="kd '+(up?"up":"")+'">'+d+'</div></div>'; }

    var LEADER = [["Jordan Avery","JA","#3b82f6",5],["Sarah Johnson","SJ","#8b5cf6",4],["Michael Davis","MD","#14b8a6",4],["Priya Nair","PN","#f43f5e",3],["Marcus Webb","MB","#10b981",2]];
    function renderLeader(){
      LEADER.sort(function(a,b){return b[3]-a[3];});
      var mx = LEADER[0][3]||1;
      $("leaderboard").innerHTML = LEADER.map(function(p,i){ return '<div class="lb t'+(i+1)+'"><span class="rk">'+(i+1)+'</span><span class="av" style="background:'+p[2]+'">'+p[1]+'</span><div class="who"><b>'+p[0].split(" ")[0]+' '+p[0].split(" ")[1].charAt(0)+'.</b><div class="bar"><i data-w="'+(p[3]/mx*100)+'"></i></div></div><div class="sold"><div class="n">'+p[3]+'</div><div class="l">sold</div></div></div>'; }).join("");
      setTimeout(function(){ document.querySelectorAll("#leaderboard .bar>i").forEach(function(el){ el.style.width=el.dataset.w+"%"; }); },60);
    }

    function renderGoal(){
      var pct = Math.round(KPI.mtd/KPI.goal*100);
      $("goal").innerHTML = '<div class="ring" style="background:conic-gradient(#3b82f6 '+(pct*3.6)+'deg, rgba(255,255,255,.08) 0)"><div class="inner"><div class="p">'+pct+'%</div><div class="s">TO GOAL</div></div></div>'+
        '<div class="gd"><div class="gv">'+KPI.mtd+' <small>/ '+KPI.goal+'</small></div><div class="gl">Vehicles this month</div><div class="gsub"><div><b>'+(KPI.goal-KPI.mtd)+'</b><span>REMAINING</span></div><div><b>9</b><span>DAYS LEFT</span></div><div><b style="color:#4ade80">On Track</b><span>PACE</span></div></div></div>';
    }

    var HOT = [["John Smith","JS","#3b82f6","Silverado LT · appt tomorrow","92"],["Priya Nair","PN","#f43f5e","Cadillac XT5 · viewed 8×","88"],["Kevin Anderson","KA","#0ea5e9","Sierra Denali · trade up","81"],["Robert Brown","RB","#14b8a6","Tahoe · finance approved","78"]];
    function renderHot(){ $("hot").innerHTML = HOT.map(function(h){ return '<div class="hp"><span class="av" style="background:'+h[2]+'">'+h[1]+'</span><div><b>'+h[0]+'</b><span>'+h[3]+'</span></div><span class="flame">'+h[4]+'</span></div>'; }).join(""); }

    function renderMisc(){
      var deliv=[["Sarah Lewis","SL","#8b5cf6","Tahoe","2:00 PM"],["Marcus Webb","MB","#10b981","Corvette","4:00 PM"]];
      var bday=[["Amanda Harris","AH","#ec4899","Turns 34 today"],["David Johnson","DJ","#f59e0b","Birthday tomorrow"]];
      $("misc").innerHTML = deliv.map(function(d){ return '<div class="srow"><span class="av" style="background:'+d[2]+'">'+d[1]+'</span><div><b>'+d[0]+'</b><span>'+d[3]+' delivery</span></div><span class="r">'+d[4]+'</span></div>'; }).join("")+
        bday.map(function(b){ return '<div class="srow"><span class="av" style="background:'+b[2]+'">'+b[1]+'</span><div><b>'+b[0]+'</b><span>'+b[3]+'</span></div><span class="r cake"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M5 20h14v-6H5zM7 14v-3a5 5 0 0 1 10 0v3M12 3v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span></div>'; }).join("");
    }

    var FEED = [
      ["ac-sale","check","Jordan sold a Silverado LT","just now"],
      ["ac-appt","cal","Amanda Harris checked in","2 min ago"],
      ["ac-lead","user","New internet lead — Tahoe","5 min ago"],
      ["ac-trade","swap","Trade appraised · +$4,800 equity","8 min ago"],
      ["ac-deliv","truck","Priya's XT5 marked delivered","12 min ago"],
      ["ac-appt","cal","Robert Brown confirmed 1 PM","16 min ago"]
    ];
    var FIC = { check:'<path d="M5 12.5l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>', cal:'<rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.7"/>', user:'<circle cx="12" cy="9" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 19c0-2.8 2.7-4.5 6-4.5s6 1.7 6 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>', swap:'<path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>', truck:'<path d="M2 8h11v9H2zM13 11h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>' };
    function renderFeed(flash){ $("feed").innerHTML = FEED.slice(0,7).map(function(f,i){ return '<div class="fi '+(flash&&i===0?"new":"")+'"><span class="ic '+f[0]+'"><svg viewBox="0 0 24 24">'+FIC[f[1]]+'</svg></span><div><b>'+f[2]+'</b></div><span class="tm">'+f[3]+'</span></div>'; }).join(""); }

    var ANN = ["<b>New arrivals:</b> 8 vehicles landed on the lot this morning","<b>Weekend Sales Event</b> — 0.9% APR on all in-stock Silverados","Congrats to <b>Jordan</b> — top salesperson 3 weeks running","<b>Service special:</b> free multi-point inspection through Friday","Team goal: <b>38 more vehicles</b> to hit the monthly target"];
    function renderAnn(){ $("annRun").innerHTML = ANN.map(function(a){ return a; }).join('<span class="sep">•</span>'); }

    /* clock */
    var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
    function tickClock(){ var d=new Date(); var h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(); var ap=h>=12?"PM":"AM"; var hh=((h+11)%12)+1; $("clock").textContent=hh+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+" "+ap; $("date").textContent=DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate(); }
    setInterval(tickClock,1000); tickClock();

    /* fullscreen */
    $("fsBtn").addEventListener("click", function(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){} });

    /* live activity stream */
    var STREAM = [
      ["ac-lead","user","New phone lead — Colorado","just now"],
      ["ac-appt","cal","Kevin Anderson checked in","just now"],
      ["ac-trade","swap","F-150 appraised · +$5,100","just now"],
      ["ac-deliv","truck","Transport arrived · 6 vehicles","just now"],
      ["ac-appt","cal","Grace Kim booked a test drive","just now"]
    ];
    var sIdx=0;
    setInterval(function(){ var e=STREAM[sIdx%STREAM.length].slice(); sIdx++; FEED.unshift(e); FEED=FEED.slice(0,10); renderFeed(true); }, 5200);

    /* sale celebration */
    var SALES = [["Jordan","Silverado High Country","JA","#3b82f6"],["Sarah","Tahoe RST","SJ","#8b5cf6"],["Michael","Sierra Denali","MD","#14b8a6"],["Priya","Cadillac XT5","PN","#f43f5e"]];
    var celIdx=0;
    setInterval(function(){
      var s=SALES[celIdx%SALES.length]; celIdx++;
      KPI.today++; KPI.mtd++; renderKPIs(); renderGoal();
      var who=LEADER.find(function(p){return p[1]===s[2];}); if(who){ who[3]++; renderLeader(); }
      FEED.unshift(["ac-sale","check",s[0]+" sold a "+s[1],"just now"]); FEED=FEED.slice(0,10); renderFeed(true);
      $("celTitle").textContent="SALE!"; $("celSub").innerHTML=s[0]+" just sold a <b>"+s[1]+"</b>";
      var c=$("celebrate"); c.classList.add("show"); setTimeout(function(){ c.classList.remove("show"); }, 3400);
    }, 17000);

    renderKPIs(); renderLeader(); renderGoal(); renderHot(); renderMisc(); renderFeed(false); renderAnn();
  </script>
