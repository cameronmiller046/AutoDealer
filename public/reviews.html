<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reputation — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eef1f6; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --gold:#f5b638; --green:#16a34a; --red:#dc2626; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 12px 28px -18px rgba(16,32,60,0.28); --radius:16px; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    svg{display:block;}
    .shell { display:grid; grid-template-columns:244px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:108px; height:9px; margin-bottom:4px; } .brand .wm { font-size:22px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:18px; height:18px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { display:flex; align-items:center; gap:11px; padding:12px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:36px; height:36px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:12px 30px; }
    .hamb { border:none; background:none; color:var(--muted); width:36px; height:36px; border-radius:9px; } .hamb svg { width:20px; height:20px; }
    .tsearch { flex:1; max-width:420px; display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:11px 14px; color:var(--muted); }
    .tsearch svg { width:17px; height:17px; } .tsearch input { border:none; background:none; outline:none; width:100%; font-size:13.5px; }
    .role-badge { display:inline-flex; align-items:center; gap:7px; background:#fdf4e0; color:#b7791f; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:auto; }
    .content { padding:26px 30px 60px; }
    .phead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .phead h1 { font-size:26px; font-weight:800; letter-spacing:-0.6px; } .phead .sub { color:var(--muted); font-size:14.5px; margin-top:6px; }
    .btn-primary { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border:none; border-radius:11px; padding:11px 18px; font-size:13.5px; font-weight:600; box-shadow:0 12px 26px -14px rgba(37,99,235,0.9); } .btn-primary svg { width:16px; height:16px; }
    .btn-ghost { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); color:var(--text); border-radius:11px; padding:11px 16px; font-size:13.5px; font-weight:600; } .btn-ghost:hover{border-color:#cfe0f7;color:var(--accent);} .btn-ghost svg{width:16px;height:16px;}

    .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:13px; margin:22px 0 20px; }
    .kp { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow); } .kp .kl{color:var(--muted);font-size:12px;} .kp .kv{font-size:24px;font-weight:800;letter-spacing:-0.6px;margin-top:4px;display:flex;align-items:center;gap:6px;} .kp .kv .st{color:var(--gold);font-size:16px;} .kp .kd{font-size:11.5px;font-weight:700;margin-top:5px;color:var(--green);} .kp .kd.down{color:var(--red);}

    .sec-label { font-size:12px; font-weight:700; letter-spacing:0.5px; color:var(--faint); text-transform:uppercase; margin:24px 0 14px; }
    .grid2 { display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start; }
    @media(max-width:1100px){ .grid2{grid-template-columns:1fr;} }

    /* platform cards */
    .plats { display:grid; grid-template-columns:repeat(4,1fr); gap:13px; }
    @media(max-width:1100px){ .plats{grid-template-columns:repeat(2,1fr);} }
    .plat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
    .plat .ph { display:flex; align-items:center; gap:10px; margin-bottom:12px; } .plat .pl-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;flex:none;} .plat .ph b{font-size:14px;font-weight:700;} .plat .ph span{display:block;font-size:11.5px;color:var(--muted);}
    .plat .rate{font-size:30px;font-weight:900;letter-spacing:-1px;} .plat .rate small{font-size:14px;color:var(--faint);font-weight:700;}
    .stars{color:var(--gold);letter-spacing:1px;} .stars .e{color:#dfe4ec;}
    .plat .ptr{font-size:11.5px;font-weight:700;color:var(--green);margin-top:7px;}

    /* distribution */
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
    .card-h { display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); } .card-h h2{font-size:15px;font-weight:800;} .card-h svg{width:18px;height:18px;color:var(--accent);} .card-h .r{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;}
    .card-b { padding:18px 20px; }
    .dist .dr{display:flex;align-items:center;gap:12px;margin-bottom:10px;} .dist .dr .dl{width:34px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:3px;} .dist .dr .dl svg{width:11px;height:11px;color:var(--gold);}
    .dist .bar{flex:1;height:9px;background:var(--bg);border-radius:6px;overflow:hidden;} .dist .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#f5b638,#f6c76a);width:0;transition:width .9s cubic-bezier(.2,.7,.3,1);} .dist .dr.low .bar>i{background:linear-gradient(90deg,#f97316,#fb923c);}
    .dist .dr .dn{width:44px;text-align:right;font-size:12.5px;font-weight:700;}

    /* auto-request */
    .req { display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line); } .req:first-child{border-top:none;}
    .req .ri{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);} .req .ri svg{width:20px;height:20px;}
    .req .rm{flex:1;min-width:0;} .req .rm b{font-size:14px;font-weight:700;} .req .rm span{display:block;font-size:12px;color:var(--muted);}
    .req .rstat{text-align:right;flex:none;} .req .rstat b{font-size:16px;font-weight:800;} .req .rstat span{display:block;font-size:11px;color:var(--muted);}
    .tog{width:40px;height:23px;border-radius:999px;background:var(--green);position:relative;flex:none;border:none;} .tog::after{content:"";position:absolute;top:2.5px;right:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);} .tog.off{background:#cbd5e1;} .tog.off::after{right:auto;left:2.5px;}

    /* review feed */
    .rv { padding:16px 20px; border-top:1px solid var(--line); cursor:pointer; } .rv:first-child{border-top:none;} .rv:hover{background:#fafbff;}
    .rv .rt{display:flex;align-items:center;gap:12px;}
    .rv .av{width:40px;height:40px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
    .rv .who b{font-size:14px;font-weight:700;} .rv .who .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:2px;}
    .pbadge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;color:#fff;}
    .rv .rr{margin-left:auto;text-align:right;flex:none;} .rv .rr .stars{font-size:13px;} .rv .rr .tm{font-size:11px;color:var(--faint);margin-top:2px;}
    .rv .rtext{font-size:13.5px;color:#33445c;line-height:1.55;margin-top:10px;}
    .rv .rf{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap;}
    .chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px;}
    .chip.rep{background:var(--accent-soft);color:var(--accent);} .chip.pos{background:#e7f7ee;color:var(--green);} .chip.neg{background:#fdeaea;color:var(--red);} .chip.neu{background:#eef1f6;color:var(--muted);}
    .chip.need{background:#fff4e5;color:#d97706;} .chip.replied{background:#e7f7ee;color:var(--green);}
    .rv .ra{margin-left:auto;} .mini{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;} .mini:hover{background:var(--accent-soft);}

    /* leaderboard */
    .lbrow{display:flex;align-items:center;gap:13px;padding:13px 20px;border-top:1px solid var(--line);} .lbrow:first-child{border-top:none;}
    .lbrow .rk{width:26px;font-size:14px;font-weight:900;color:var(--faint);text-align:center;flex:none;} .lbrow.top .rk{color:var(--gold);}
    .lbrow .av{width:38px;height:38px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
    .lbrow .li{flex:1;min-width:0;} .lbrow .li b{font-size:13.5px;font-weight:700;} .lbrow .li .stars{font-size:11px;}
    .lbrow .lv{text-align:right;flex:none;} .lbrow .lv b{font-size:16px;font-weight:800;} .lbrow .lv span{font-size:11px;color:var(--muted);display:block;}

    /* personal hero */
    .phero{background:radial-gradient(900px 400px at 90% -40%,#1e3a8a,#0f1b2d 60%),#0f1b2d;border-radius:20px;color:#eaf1fb;padding:26px 30px;display:flex;align-items:center;gap:34px;box-shadow:var(--shadow);flex-wrap:wrap;}
    .phero .big{text-align:center;} .phero .big .n{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1;} .phero .big .stars{font-size:20px;margin-top:6px;} .phero .big .c{font-size:12.5px;color:#a9bcda;margin-top:6px;}
    .phero .pd{flex:1;min-width:200px;} .phero .pd h2{font-size:20px;font-weight:800;} .phero .pd p{color:#a9bcda;font-size:13.5px;margin-top:6px;line-height:1.5;max-width:420px;}
    .phero .pstat{display:flex;gap:26px;margin-top:16px;} .phero .pstat b{font-size:22px;font-weight:900;display:block;} .phero .pstat span{font-size:11.5px;color:#8fa6c6;font-weight:600;}

    /* slide-over */
    .scrim { position:fixed; inset:0; background:rgba(10,20,36,0.4); z-index:45; opacity:0; pointer-events:none; transition:opacity .2s; } .scrim.show{opacity:1;pointer-events:auto;}
    .panel { position:fixed; top:0; right:0; bottom:0; width:500px; max-width:96vw; background:var(--bg); z-index:46; box-shadow:-20px 0 60px -30px rgba(0,0,0,0.5); transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; } .panel.open{transform:none;}
    .panel-hd { display:flex; align-items:flex-start; gap:14px; padding:20px 22px; background:var(--card); border-bottom:1px solid var(--line); } .panel-hd .av{width:46px;height:46px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;} .panel-hd h2{font-size:17px;font-weight:800;} .panel-hd .pm{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:7px;} .panel-close{margin-left:auto;border:none;background:none;color:var(--muted);width:34px;height:34px;border-radius:9px;} .panel-close svg{width:18px;height:18px;}
    .panel-body { overflow-y:auto; padding:18px 22px 20px; display:flex; flex-direction:column; gap:16px; }
    .sect { background:var(--card); border:1px solid var(--line); border-radius:13px; padding:16px; } .sect h3{font-size:12.5px;font-weight:800;margin-bottom:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;} .sect h3 svg{width:15px;height:15px;color:var(--accent);}
    .qtext{font-size:14px;color:#33445c;line-height:1.6;}
    .ai-reply{background:var(--accent-soft);border:1px solid #d7e6fc;border-radius:11px;padding:14px;font-size:13.5px;line-height:1.6;color:#1e3a5f;}
    .tone{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;} .tone button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;} .tone button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font:inherit;font-size:13.5px;resize:vertical;min-height:96px;outline:none;} textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    .p-actions{display:flex;gap:10px;} .p-actions button{flex:1;border-radius:11px;padding:12px;font-size:13.5px;font-weight:700;} .pa-ghost{background:#fff;border:1px solid var(--line);color:var(--text);} .pa-ghost:hover{border-color:#cfe0f7;color:var(--accent);} .pa-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border:none;color:#fff;}

    .toast { position:fixed; bottom:24px; right:24px; background:#0f1b2d; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); opacity:0; transform:translateY(18px); transition:all .3s; z-index:60; } .toast.show{opacity:1;transform:none;} .toast .tk{width:22px;height:22px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;flex:none;} .toast .tk svg{width:13px;height:13px;}
    @media (max-width:1240px){ .kpis{grid-template-columns:repeat(3,1fr);} }
    @media (max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{display:none;} }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><svg class="sw" viewBox="0 0 108 9"><path d="M2 7 C26 1, 82 1, 106 5" fill="none" stroke="#2b8fff" stroke-width="2.4" stroke-linecap="round"/></svg><span class="wm">AUTO<b>DEALER</b></span></div>
      <nav class="nav"></nav>
      <div class="side-user"><span class="av">DM</span><span class="meta"><b>Dana Morales</b><span>Sales Manager</span></span><svg class="chev" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="hamb"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div class="tsearch"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="search" placeholder="Search reviews..." /></div>
        <span class="role-badge" id="roleBadge">Reputation</span>
        <span class="tb-avatar"><span class="av">DM</span></span>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="toastMsg">Done</span></div>

  <script src="/roles.js"></script>
  <script>
    var $ = function(id){ return document.getElementById(id); };
    function stars(n){ var f=Math.round(n), s=''; for(var i=0;i<5;i++){ s+= i<f?'★':'<span class="e">★</span>'; } return '<span class="stars">'+s+'</span>'; }
    var PLAT = {
      google:['#4285F4','G','Google'], facebook:['#1877F2','f','Facebook'],
      dealerrater:['#16a34a','D','DealerRater'], cars:['#dc2626','C','Cars.com'], yelp:['#d32323','Y','Yelp']
    };
    function avColor(s){ var c=['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#06b6d4','#6366f1']; var h=0; for(var i=0;i<s.length;i++) h=(h+s.charCodeAt(i))%c.length; return c[h]; }
    function initials(n){ return n.split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase(); }

    var REVIEWS = [
      {id:1,name:'Jennifer Adams',plat:'google',stars:5,rep:'Marcus Bell',sent:'pos',time:'2 days ago',status:'need',text:'Marcus made buying our Highlander completely stress-free. No pressure, answered every question, and the whole thing took under two hours. Best car-buying experience we\'ve ever had.'},
      {id:2,name:'Robert Chen',plat:'dealerrater',stars:5,rep:'Cameron Miller',sent:'pos',time:'3 days ago',status:'need',text:'Cameron went above and beyond finding the exact trim I wanted. Even had it detailed and ready when I arrived. Highly recommend asking for him.'},
      {id:3,name:'Maria Gonzalez',plat:'google',stars:2,rep:'Front Desk',sent:'neg',time:'4 days ago',status:'need',text:'Waited 45 minutes past my appointment time and no one updated me. The car was great but the process felt disorganized.'},
      {id:4,name:'David Okafor',plat:'facebook',stars:5,rep:'Marcus Bell',sent:'pos',time:'5 days ago',status:'replied',text:'Second vehicle we\'ve bought here. Fair on our trade and the financing was quick. Marcus remembered us from three years ago!'},
      {id:5,name:'Ashley Patel',plat:'cars',stars:4,rep:'Cameron Miller',sent:'pos',time:'1 week ago',status:'replied',text:'Smooth experience overall. Only knocked a star because the app for scheduling delivery was a little confusing, but the team helped me through it.'},
      {id:6,name:'Thomas Reed',plat:'google',stars:3,rep:'Sarah Lin',sent:'neu',time:'1 week ago',status:'need',text:'Decent selection and friendly staff. The back-and-forth on price took longer than I expected. Ended up happy with the deal though.'}
    ];
    var REPS = [
      {name:'Marcus Bell',rate:4.9,count:142},
      {name:'Cameron Miller',rate:4.8,count:96},
      {name:'Sarah Lin',rate:4.6,count:78},
      {name:'Devon Wright',rate:4.5,count:64},
      {name:'Priya Nair',rate:4.3,count:51}
    ];

    function platBadge(p){ var d=PLAT[p]; return '<span class="pbadge" style="background:'+d[0]+'">'+d[2]+'</span>'; }
    function sentChip(s){ return s==='pos'?'<span class="chip pos">Positive</span>':s==='neg'?'<span class="chip neg">Negative</span>':'<span class="chip neu">Neutral</span>'; }
    function reviewRow(r){
      return '<div class="rv" data-id="'+r.id+'">'+
        '<div class="rt">'+
          '<span class="av" style="background:'+avColor(r.name)+'">'+initials(r.name)+'</span>'+
          '<div class="who"><b>'+r.name+'</b><div class="sub">'+platBadge(r.plat)+' · sold by '+r.rep+'</div></div>'+
          '<div class="rr">'+stars(r.stars)+'<div class="tm">'+r.time+'</div></div>'+
        '</div>'+
        '<div class="rtext">"'+r.text+'"</div>'+
        '<div class="rf">'+sentChip(r.sent)+'<span class="chip rep">@ '+r.rep+'</span>'+
          (r.status==='need'?'<span class="chip need">Needs reply</span>':'<span class="chip replied">Replied</span>')+
          '<span class="ra"><button class="mini" onclick="openReview('+r.id+');event.stopPropagation();">'+(r.status==='need'?'Draft reply':'View')+'</button></span>'+
        '</div>'+
      '</div>';
    }

    /* ---------- MANAGER VIEW ---------- */
    function managerView(){
      var need = REVIEWS.filter(function(r){return r.status==='need';}).length;
      return ''+
      '<div class="phead"><div><h1>Reputation Management</h1><p class="sub">Every review across Google, Facebook, DealerRater and Cars.com — with AI-drafted replies and automated review requests.</p></div>'+
        '<button class="btn-primary" onclick="toast(\'Review request sent to 34 recent buyers\')"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6-7-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Request Reviews</button></div>'+
      '<div class="kpis">'+
        '<div class="kp"><div class="kl">Overall Rating</div><div class="kv">4.7 <span class="st">★</span></div><div class="kd">▲ 0.2 vs last quarter</div></div>'+
        '<div class="kp"><div class="kl">Total Reviews</div><div class="kv">1,284</div><div class="kd">▲ 48 this month</div></div>'+
        '<div class="kp"><div class="kl">Response Rate</div><div class="kv">94%</div><div class="kd">Avg reply in 3.2h</div></div>'+
        '<div class="kp"><div class="kl">Needs Reply</div><div class="kv">'+need+'</div><div class="kd down">Action needed</div></div>'+
        '<div class="kp"><div class="kl">Requests Sent</div><div class="kv">312</div><div class="kd">41% conversion</div></div>'+
      '</div>'+
      '<div class="sec-label">Ratings by Platform</div>'+
      '<div class="plats">'+
        platCard('google',4.8,842,'▲ 62 this month')+
        platCard('facebook',4.6,218,'▲ 14 this month')+
        platCard('dealerrater',4.7,156,'▲ 9 this month')+
        platCard('cars',4.5,68,'▲ 3 this month')+
      '</div>'+
      '<div class="sec-label">Overview</div>'+
      '<div class="grid2">'+
        '<div class="card"><div class="card-h"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-4 3.5v-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><h2>Recent Reviews</h2><span class="r">'+need+' need a reply</span></div><div id="feed">'+REVIEWS.map(reviewRow).join('')+'</div></div>'+
        '<div style="display:flex;flex-direction:column;gap:18px;">'+
          '<div class="card"><div class="card-h"><svg viewBox="0 0 24 24"><path d="M4 20V4M20 20H4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><h2>Rating Distribution</h2></div><div class="card-b"><div class="dist">'+
            distRow(5,78)+distRow(4,14)+distRow(3,4,true)+distRow(2,2,true)+distRow(1,2,true)+
          '</div></div></div>'+
          '<div class="card"><div class="card-h"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8.4 6H14a2 2 0 0 1 2 2v1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><h2>Automated Requests</h2></div><div class="card-b">'+
            reqRow('After every sale','Text + email 1 day post-delivery','128','sent',true)+
            reqRow('After service visit','Email 2 hours after checkout','96','sent',true)+
            reqRow('Win-back follow-up','30 days after purchase','88','sent',false)+
          '</div></div>'+
          '<div class="card"><div class="card-h"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><h2>Top Rated Reps</h2></div><div>'+
            REPS.map(function(r,i){ return '<div class="lbrow'+(i===0?' top':'')+'"><span class="rk">'+(i+1)+'</span><span class="av" style="background:'+avColor(r.name)+'">'+initials(r.name)+'</span><div class="li"><b>'+r.name+'</b><div>'+stars(r.rate)+'</div></div><div class="lv"><b>'+r.rate.toFixed(1)+'</b><span>'+r.count+' reviews</span></div></div>'; }).join('')+
          '</div></div>'+
        '</div>'+
      '</div>';
    }
    function platCard(p,rate,count,tr){ var d=PLAT[p]; return '<div class="plat"><div class="ph"><span class="pl-ic" style="background:'+d[0]+'">'+d[1]+'</span><div><b>'+d[2]+'</b><span>'+count+' reviews</span></div></div><div class="rate">'+rate.toFixed(1)+'<small>/5</small></div>'+stars(rate)+'<div class="ptr">'+tr+'</div></div>'; }
    function distRow(n,pct,low){ return '<div class="dr'+(low?' low':'')+'"><span class="dl">'+n+'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z" fill="currentColor"/></svg></span><div class="bar"><i data-w="'+pct+'"></i></div><span class="dn">'+pct+'%</span></div>'; }
    function reqRow(t,s,n,l,on){ return '<div class="req"><span class="ri"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6-7-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span><div class="rm"><b>'+t+'</b><span>'+s+'</span></div><div class="rstat"><b>'+n+'</b><span>this month</span></div><button class="tog'+(on?'':' off')+'" onclick="this.classList.toggle(\'off\');toast(\''+t+' '+(on?'updated':'enabled')+'\')"></button></div>'; }

    /* ---------- PERSONAL (salesperson) VIEW ---------- */
    function personalView(){
      var mine = REVIEWS.filter(function(r){return r.rep==='Cameron Miller';});
      if(mine.length===0) mine=REVIEWS.slice(0,3);
      return ''+
      '<div class="phead"><div><h1>My Reviews</h1><p class="sub">What customers are saying about their experience with you — and how to earn more five-star reviews.</p></div>'+
        '<button class="btn-ghost" onclick="toast(\'Review request link copied\')"><svg viewBox="0 0 24 24"><path d="M9 15l6-6M8 9a3 3 0 1 0 0-.01M16 15a3 3 0 1 0 0 .01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Copy my review link</button></div>'+
      '<div class="phero" style="margin-top:22px;">'+
        '<div class="big"><div class="n">4.8</div><div class="stars">'+('★★★★★')+'</div><div class="c">from 96 reviews</div></div>'+
        '<div class="pd"><h2>You\'re a top-rated advisor 🏆</h2><p>You rank #2 on the team for customer satisfaction. Customers consistently praise how prepared and low-pressure you are. Two new reviews came in this week.</p>'+
          '<div class="pstat"><div><b>#2</b><span>Team rank</span></div><div><b>92%</b><span>5-star rate</span></div><div><b>+6</b><span>This month</span></div><div><b>41%</b><span>Request conversion</span></div></div>'+
        '</div>'+
      '</div>'+
      '<div class="sec-label">Your Recent Reviews</div>'+
      '<div class="card"><div id="feed">'+mine.map(reviewRow).join('')+'</div></div>'+
      '<div class="sec-label">How to earn more 5-star reviews</div>'+
      '<div class="plats" style="grid-template-columns:repeat(3,1fr);">'+
        tip('Ask at delivery','The best time to request a review is right after handoff, while the excitement is highest. Your conversion is 41% — top reps hit 55%.')+
        tip('Send the link by text','Text requests convert 3× better than email. Tap "Copy my review link" and send it personally within an hour of delivery.')+
        tip('Reply to every review','Thanking customers publicly encourages others. You have 1 review awaiting your thanks.')+
      '</div>';
    }
    function tip(t,s){ return '<div class="plat"><div class="ph"><span class="pl-ic" style="background:linear-gradient(150deg,#3b82f6,#2563eb)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1 1 1.9h5c.1-.9.4-1.4 1-1.9A6 6 0 0 0 12 3z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></span><div><b>'+t+'</b></div></div><div style="font-size:13px;color:var(--muted);line-height:1.55;margin-top:2px;">'+s+'</div></div>'; }

    /* ---------- slide-over (reply) ---------- */
    var curReview=null, tone='Warm';
    function replyDraft(r,t){
      var name=r.name.split(' ')[0];
      if(r.sent==='neg'){
        return 'Hi '+name+', thank you for the honest feedback and I\'m sorry your visit didn\'t reflect the experience we aim for. That wait is on us. I\'d like to make it right — please reach out to me directly at (555) 200-1180 and I\'ll personally take care of you. — '+r.rep+', Premier Auto';
      }
      var warm='Thank you so much, '+name+'! It genuinely made our day to read this. '+r.rep.split(' ')[0]+' will be thrilled. Enjoy every mile in your new vehicle, and we\'re always here if you need anything. Welcome to the Premier Auto family! 🚗';
      var pro='Thank you for the kind words, '+name+'. We\'re glad '+r.rep+' delivered the experience you deserve. We appreciate you choosing Premier Auto and look forward to serving you again.';
      var brief='Thanks so much, '+name+' — we really appreciate the review and are thrilled you had a great experience with '+r.rep.split(' ')[0]+'!';
      return t==='Professional'?pro:t==='Brief'?brief:warm;
    }
    function openReview(id){
      var r=REVIEWS.find(function(x){return x.id===id;}); if(!r) return; curReview=r; tone='Warm';
      var p=$('panel');
      p.innerHTML=''+
      '<div class="panel-hd"><span class="av" style="background:'+avColor(r.name)+'">'+initials(r.name)+'</span>'+
        '<div><h2>'+r.name+'</h2><div class="pm">'+platBadge(r.plat)+' '+stars(r.stars)+' · '+r.time+'</div></div>'+
        '<button class="panel-close" onclick="closePanel()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>'+
      '<div class="panel-body">'+
        '<div class="sect"><h3><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-4 3.5v-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Review</h3><div class="qtext">"'+r.text+'"</div><div class="rf" style="margin-top:12px;">'+sentChip(r.sent)+'<span class="chip rep">Sold by '+r.rep+'</span></div></div>'+
        '<div class="sect"><h3><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1 1 1.9h5c.1-.9.4-1.4 1-1.9A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>AI-Drafted Reply</h3>'+
          '<div class="tone" id="tone"><button class="on" data-t="Warm">Warm</button><button data-t="Professional">Professional</button><button data-t="Brief">Brief</button></div>'+
          '<textarea id="replyText">'+replyDraft(r,'Warm')+'</textarea>'+
          '<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">AI matched the reply to the review\'s tone and mentioned '+r.rep.split(' ')[0]+' by name. Edit freely before posting.</div>'+
        '</div>'+
        '<div class="p-actions"><button class="pa-ghost" onclick="closePanel()">Cancel</button><button class="pa-primary" onclick="postReply()">Post reply to '+PLAT[r.plat][2]+'</button></div>'+
      '</div>';
      $('tone').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ $('tone').querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); tone=b.getAttribute('data-t'); $('replyText').value=replyDraft(curReview,tone); }); });
      $('scrim').classList.add('show'); p.classList.add('open');
    }
    function postReply(){
      if(curReview){ curReview.status='replied'; }
      closePanel(); rerenderFeed(); toast('Reply posted to '+(curReview?PLAT[curReview.plat][2]:'platform'));
    }
    function closePanel(){ $('scrim').classList.remove('show'); $('panel').classList.remove('open'); }
    function rerenderFeed(){ var f=$('feed'); if(!f) return; var isMgr=window.ADRoles&&window.ADRoles.getRole()==='manager'; var list=isMgr?REVIEWS:REVIEWS.filter(function(r){return r.rep==='Cameron Miller';}); if(list.length===0) list=REVIEWS.slice(0,3); f.innerHTML=list.map(reviewRow).join(''); }

    function animateBars(){ setTimeout(function(){ document.querySelectorAll('.dist .bar>i').forEach(function(el){ el.style.width=el.getAttribute('data-w')+'%'; }); },250); }
    var tTimer;
    function toast(m){ $('toastMsg').textContent=m; $('toast').classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(function(){ $('toast').classList.remove('show'); },2400); }

    document.addEventListener('DOMContentLoaded', function(){
      var role = (window.ADRoles && window.ADRoles.getRole()) || 'manager';
      if(role==='manager'){ $('content').innerHTML=managerView(); $('roleBadge').textContent='Reputation'; }
      else { $('content').innerHTML=personalView(); $('roleBadge').textContent='My Reviews'; }
      $('scrim').addEventListener('click', closePanel);
      animateBars();
    });
  </script>
</body>
</html>
