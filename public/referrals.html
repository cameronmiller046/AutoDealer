<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Referral Center — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eef1f6; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --green:#16a34a; --amber:#d97706; --red:#dc2626; --purple:#7c3aed; --gold:#f5b638; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 12px 28px -18px rgba(16,32,60,0.28); --radius:16px;
      --t-first:#2563eb; --t-bronze:#c07a3e; --t-silver:#7c8aa0; --t-gold:#e0a010; --t-plat:#7c3aed; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    svg{display:block;}
    .shell { display:grid; grid-template-columns:244px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:108px; height:9px; margin-bottom:4px; } .brand .wm { font-size:22px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; overflow-y:auto; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:18px; height:18px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { margin-top:auto; display:flex; align-items:center; gap:11px; padding:12px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:36px; height:36px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:12px 30px; }
    .hamb { border:none; background:none; color:var(--muted); width:36px; height:36px; border-radius:9px; } .hamb svg { width:20px; height:20px; }
    .tsearch { flex:1; max-width:420px; display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:11px 14px; color:var(--muted); }
    .tsearch svg { width:17px; height:17px; } .tsearch input { border:none; background:none; outline:none; width:100%; font-size:13.5px; }
    .role-badge { display:inline-flex; align-items:center; gap:7px; background:#e7f7ee; color:#16a34a; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:auto; }
    .content { padding:26px 30px 60px; }
    .phead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .phead h1 { font-size:26px; font-weight:800; letter-spacing:-0.6px; } .phead .sub { color:var(--muted); font-size:14.5px; margin-top:6px; max-width:600px; }
    .phead .pactions{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-primary { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border:none; border-radius:11px; padding:11px 18px; font-size:13.5px; font-weight:600; box-shadow:0 12px 26px -14px rgba(37,99,235,0.9); } .btn-primary svg { width:16px; height:16px; }
    .btn-ghost { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); color:var(--text); border-radius:11px; padding:11px 16px; font-size:13.5px; font-weight:700; } .btn-ghost:hover{border-color:#cfe0f7;color:var(--accent);} .btn-ghost svg{width:16px;height:16px;}

    /* tabs */
    .tabbar { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:22px 0 22px; overflow-x:auto; }
    .tab { border:none; background:none; padding:11px 16px; font-size:13.5px; font-weight:700; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap; display:inline-flex; align-items:center; gap:8px; }
    .tab:hover{color:var(--text);} .tab.on{color:var(--accent);border-bottom-color:var(--accent);} .tab .tc{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;padding:1px 7px;border-radius:8px;}

    .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin:0 0 22px; }
    .kp { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
    .kp .kico{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;} .kp .kico svg{width:16px;height:16px;}
    .kp .kl{color:var(--muted);font-size:11.5px;font-weight:600;} .kp .kv{font-size:23px;font-weight:800;letter-spacing:-0.6px;margin-top:4px;} .kp .kd{font-size:11px;font-weight:700;margin-top:4px;color:var(--green);}
    @media (max-width:1240px){ .kpis{grid-template-columns:repeat(3,1fr);} }
    @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr);} }

    .grid2 { display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start; }
    @media(max-width:1080px){ .grid2{grid-template-columns:1fr;} }
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .card-h { display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line); } .card-h h2{font-size:14.5px;font-weight:800;} .card-h svg{width:18px;height:18px;color:var(--accent);} .card-h .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;} .card-h .rlink{margin-left:auto;font-size:12px;color:var(--accent);font-weight:700;cursor:pointer;}
    .sec-label { font-size:12px; font-weight:800; letter-spacing:0.5px; color:var(--faint); text-transform:uppercase; margin:0 0 14px; }
    .col { display:flex; flex-direction:column; gap:18px; }

    /* tier ladder / progress */
    .tier-ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;} @media(max-width:1100px){.tier-ladder{grid-template-columns:repeat(2,1fr);}} @media(max-width:560px){.tier-ladder{grid-template-columns:1fr;}}
    .tcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s;}
    .tcard.reached{border-color:transparent;} .tcard:hover{transform:translateY(-3px);box-shadow:0 20px 40px -22px rgba(16,32,60,.4);}
    .tcard .medal{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.4);} .tcard .medal svg{width:24px;height:24px;}
    .tcard .tname{font-size:14.5px;font-weight:800;margin-top:13px;} .tcard .treq{font-size:12px;color:var(--muted);margin-top:2px;}
    .tcard .treward{margin-top:12px;font-size:13px;font-weight:800;} .tcard .treward small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px;}
    .tcard .lock{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:8px;background:#eef1f6;color:#94a3b8;} .tcard.reached .lock{background:#e7f7ee;color:var(--green);}
    .pbar{height:8px;border-radius:6px;background:#eef1f6;overflow:hidden;margin-top:14px;} .pbar>i{display:block;height:100%;border-radius:6px;transition:width .7s cubic-bezier(.2,1,.3,1);}
    .pmeta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:7px;color:var(--muted);}

    /* spotlight advocate progress */
    .spot{display:flex;gap:18px;align-items:center;padding:18px;flex-wrap:wrap;}
    .spot .bigav{width:66px;height:66px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);}
    .spot .si{flex:1;min-width:220px;} .spot .si b{font-size:17px;font-weight:800;} .spot .si .sm{color:var(--muted);font-size:12.5px;margin-top:2px;}

    /* tier chip / badge */
    .tchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;} .tchip svg{width:12px;height:12px;}

    /* pipeline table */
    .pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; } .pill { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:700; } .pill.on{background:var(--accent);color:#fff;border-color:var(--accent);} .pill:hover{color:var(--text);border-color:#cfe0f7;} .pill.on:hover{color:#fff;} .pill .c{opacity:.7;margin-left:4px;}
    .ref{display:grid;grid-template-columns:1.7fr 1.4fr 1.3fr 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;} .ref:first-of-type{border-top:none;} .ref:hover{background:#fafbff;}
    .who{display:flex;align-items:center;gap:11px;} .who .av{width:38px;height:38px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;} .who b{font-weight:700;font-size:13.5px;} .who span{display:block;color:var(--muted);font-size:11.5px;}
    .fromby{font-size:12.5px;color:var(--muted);} .fromby b{color:var(--text);font-weight:700;}
    .stg{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;} .stg .dt{width:6px;height:6px;border-radius:50%;background:currentColor;}
    .rew{font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;}
    .refbtn{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;} .refbtn:hover{background:var(--accent-soft);}

    /* leaderboard cards */
    .lb-period{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;}
    .lb-period button{border:none;background:none;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);} .lb-period button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow);}
    .lbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;} @media(max-width:1000px){.lbgrid{grid-template-columns:1fr 1fr;}} @media(max-width:640px){.lbgrid{grid-template-columns:1fr;}}
    .lbc{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);text-align:center;position:relative;cursor:pointer;transition:transform .16s;} .lbc:hover{transform:translateY(-3px);}
    .lbc .rank{position:absolute;top:14px;left:14px;font-size:13px;font-weight:900;color:var(--faint);} .lbc.gold .rank{color:var(--gold);}
    .lbc .crown{position:absolute;top:12px;right:14px;} .lbc .crown svg{width:20px;height:20px;color:var(--gold);}
    .lbc .lav{width:60px;height:60px;border-radius:50%;margin:6px auto 10px;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;}
    .lbc .lname{font-size:15px;font-weight:800;} .lbc .lsince{font-size:11.5px;color:var(--muted);margin-top:1px;}
    .lbc .lstats{display:flex;justify-content:center;gap:22px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
    .lbc .lstats .n{font-size:18px;font-weight:800;} .lbc .lstats .l{font-size:10.5px;color:var(--muted);font-weight:600;}
    .lbc .lbadges{display:flex;justify-content:center;gap:5px;margin-top:12px;}
    .minibadge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;} .minibadge svg{width:14px;height:14px;}

    /* reward approval queue */
    .rq{display:grid;grid-template-columns:1.6fr 1.3fr 1fr auto;gap:14px;align-items:center;padding:15px 18px;border-top:1px solid var(--line);} .rq:first-of-type{border-top:none;}
    .rq .amt{font-weight:800;font-size:15px;} .rq .amt small{display:block;font-size:11px;color:var(--muted);font-weight:600;}
    .rq-actions{display:flex;gap:8px;} .rq-actions button{border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;} .rq-actions .app{background:var(--green);color:#fff;border-color:transparent;} .rq-actions .rej{color:var(--red);} .rq-actions .pay{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;border-color:transparent;}
    .rq-status{font-size:11px;font-weight:800;padding:5px 11px;border-radius:8px;}

    /* campaigns */
    .campgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;} @media(max-width:820px){.campgrid{grid-template-columns:1fr;}}
    .camp{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
    .camp .cbanner{position:absolute;top:0;left:0;right:0;height:5px;}
    .camp .cico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;} .camp .cico svg{width:22px;height:22px;}
    .camp h3{font-size:16px;font-weight:800;margin-top:14px;} .camp p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;}
    .camp .crow{display:flex;align-items:center;gap:12px;margin-top:16px;}
    .camp .cmult{font-size:13px;font-weight:800;color:var(--accent);}
    .switch{margin-left:auto;width:44px;height:25px;border-radius:20px;background:#d5dce6;position:relative;transition:.2s;flex:none;} .switch.on{background:var(--green);} .switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2);} .switch.on::after{left:22px;}
    .cstat{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:8px;}

    /* analytics */
    .an-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;} @media(max-width:960px){.an-grid{grid-template-columns:1fr;}}
    .funnel{padding:18px;} .fn{display:flex;align-items:center;gap:14px;margin-bottom:11px;} .fn .fl{width:150px;font-size:12.5px;font-weight:700;flex:none;color:var(--muted);} .fn .fbar{flex:1;height:30px;border-radius:8px;background:#eef1f6;overflow:hidden;position:relative;} .fn .fbar>i{display:block;height:100%;border-radius:8px;} .fn .fv{width:52px;text-align:right;font-weight:800;font-size:14px;flex:none;}
    .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:18px 18px 0;} .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end;height:100%;} .bars .b i{width:100%;max-width:34px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#4f8dff,#2563eb);} .bars .b span{font-size:10.5px;color:var(--muted);font-weight:700;}
    .anstat{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px;} .anstat .as{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;} .anstat .as .n{font-size:22px;font-weight:800;letter-spacing:-.5px;} .anstat .as .l{font-size:11.5px;color:var(--muted);margin-top:3px;}

    /* settings / program config */
    .cfg-tier{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--card);}
    .cfg-tier .cth{display:flex;align-items:center;gap:12px;margin-bottom:14px;} .cfg-tier .cth .medal{width:36px;height:36px;border-radius:10px;} .cfg-tier .cth .medal svg{width:19px;height:19px;}
    .cfg-grid{display:grid;grid-template-columns:1.4fr .8fr 1.2fr 1.2fr auto;gap:12px;align-items:end;} @media(max-width:900px){.cfg-grid{grid-template-columns:1fr 1fr;}}
    .fld{display:flex;flex-direction:column;gap:6px;} .fld label{font-size:11px;font-weight:700;color:var(--muted);} .fld input,.fld select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;background:#fff;color:var(--text);outline:none;} .fld input:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    .cfg-remove{border:1px solid var(--line);background:#fff;color:var(--red);border-radius:9px;padding:9px 12px;font-weight:700;font-size:12px;height:38px;}
    .cfg-global{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;} @media(max-width:820px){.cfg-global{grid-template-columns:1fr 1fr;}} @media(max-width:520px){.cfg-global{grid-template-columns:1fr;}}

    /* ai insights */
    .ai-rec{padding:15px 18px;border-top:1px solid var(--line);} .ai-rec:first-child{border-top:none;} .ai-rec .airow{display:flex;gap:12px;} .ai-rec .aii{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;} .ai-rec .aii svg{width:18px;height:18px;} .ai-rec p{font-size:13px;line-height:1.5;} .ai-rec p b{font-weight:800;} .ai-rec .act{color:var(--purple);font-weight:700;font-size:12.5px;margin-top:6px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;}

    /* badges showcase */
    .badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:4px;} @media(max-width:900px){.badge-grid{grid-template-columns:repeat(2,1fr);}}
    .badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow);} .badge.locked{opacity:.5;filter:grayscale(.6);}
    .badge .bmedal{width:52px;height:52px;border-radius:15px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.4);} .badge .bmedal svg{width:26px;height:26px;}
    .badge b{font-size:12.5px;font-weight:800;display:block;} .badge span{font-size:10.5px;color:var(--muted);}

    /* employees */
    .emp{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);} .emp:first-of-type{border-top:none;}
    .emp .erk{width:26px;font-size:15px;font-weight:900;color:var(--faint);text-align:center;flex:none;} .emp.top .erk{color:var(--gold);}
    .emp .eav{width:40px;height:40px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
    .emp .ei{flex:1;} .emp .ei b{font-size:13.5px;font-weight:700;} .emp .ei span{display:block;font-size:11.5px;color:var(--muted);}
    .emp .ebadges{display:flex;gap:5px;} .emp .ev{text-align:right;} .emp .ev b{font-size:16px;font-weight:800;} .emp .ev span{font-size:10.5px;color:var(--muted);display:block;}

    /* share */

        '<div class="treward" style="color:'+t.cvar+'">'+t.label+'<small>'+t.type+' · expires in '+t.exp+'</small></div>'+
        '<div class="pbar"><i style="width:'+pct+'%;background:linear-gradient(90deg,'+t.cvar+'99,'+t.cvar+')"></i></div>'+
        '<div class="pmeta"><span>'+Math.min(adv.sold,t.req)+' / '+t.req+'</span><span>'+(reached?'Complete':remaining+' more')+'</span></div>'+

      '</div></div>'+
      '<div style="height:16px"></div>'+
      '<div class="card"><div style="padding:16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><b style="font-size:13.5px">Optional employee bonus program</b><span style="font-size:12.5px;color:var(--muted)">Reward reps $25 per sourced referral that sells.</span><div class="switch" style="margin-left:auto" data-empbonus="1"></div></div></div>';
    }

    /* ========== SETTINGS / PROGRAM CONFIG ========== */
    function viewSettings(){
      if(!CAN_MANAGE) return accessDenied();
      return '<div class="sec-label">Reward Program Configuration</div>'+
      '<div class="card" style="margin-bottom:18px"><div style="padding:16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)"><b style="font-size:13.5px">Program status</b><span style="font-size:12.5px;color:var(--muted)">Turn the entire referral program on or off for this rooftop.</span><div class="switch'+(PROGRAM.global.active?' on':'')+'" style="margin-left:auto" data-prog="active"></div></div>'+
        '<div class="cfg-global" style="padding:18px">'+
          cfgField('Max annual reward / advocate','prog-maxAnnual',PROGRAM.global.maxAnnual,'number','$')+
          cfgField('Referrals per customer / yr','prog-perCustomer',PROGRAM.global.perCustomer,'number','')+
          cfgField('Tax reporting threshold','prog-taxThreshold',PROGRAM.global.taxThreshold,'number','$')+
        '</div></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="sec-label" style="margin:0">Reward Tiers</div><button class="btn-ghost" onclick="addTier()">+ Add Tier</button></div>'+
      '<div id="tierEditor">'+ PROGRAM.tiers.map(cfgTier).join('') +'</div>'+
      '<div style="display:flex;gap:10px;margin-top:8px"><button class="btn-primary" onclick="saveProgram()">'+svg('check')+'Save Program</button><button class="btn-ghost" onclick="setTab(\'overview\')">Preview changes</button></div>'+
      '<p style="font-size:12px;color:var(--muted);margin-top:14px;line-height:1.55;max-width:640px">Every dealership can tailor its own program — tier names, required referrals, reward types &amp; values, expiration, approval workflow, and eligibility — with no code changes. Changes apply instantly across progress bars, the pipeline, and the customer portal.</p>';
    }
    function cfgField(label,id,val,type,prefix){
      return '<div class="fld"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+val+'" '+(prefix?'data-prefix="'+prefix+'"':'')+'></div>';
    }
    function cfgTier(t,i){
      var opts=REWARD_TYPES.map(function(o){return '<option'+(o===t.type?' selected':'')+'>'+o+'</option>';}).join('');
      return '<div class="cfg-tier" data-i="'+i+'"><div class="cth"><span class="medal" style="background:linear-gradient(150deg,'+t.cvar+','+t.cvar+'bb);display:flex;align-items:center;justify-content:center;color:#fff">'+svg(t.icon)+'</span><b style="font-size:14px">Tier '+(i+1)+'</b><span style="font-size:12px;color:var(--muted);margin-left:auto">Approval required <input type="checkbox" '+(t.approval?'checked':'')+' data-appr="'+i+'" style="vertical-align:middle;margin-left:6px"></span></div>'+
        '<div class="cfg-grid">'+
          '<div class="fld"><label>Tier name</label><input data-f="name" data-i="'+i+'" value="'+t.name+'"></div>'+
          '<div class="fld"><label>Referrals</label><input data-f="req" data-i="'+i+'" type="number" value="'+t.req+'"></div>'+
          '<div class="fld"><label>Reward type</label><select data-f="type" data-i="'+i+'">'+opts+'</select></div>'+
          '<div class="fld"><label>Reward value / label</label><input data-f="label" data-i="'+i+'" value="'+t.label+'"></div>'+
          '<button class="cfg-remove" onclick="removeTier('+i+')" title="Remove tier">✕</button>'+
        '</div></div>';
    }
    function addTier(){ PROGRAM.tiers.push({key:'t'+Date.now(),name:'New Tier',req:(PROGRAM.tiers.length?PROGRAM.tiers[PROGRAM.tiers.length-1].req+5:1),type:'Cash Bonus',value:0,label:'+$0 Bonus',color:'var(--accent)',cvar:'#2563eb',icon:'medal',exp:'12 months',approval:true}); renderView(); }
    function removeTier(i){ PROGRAM.tiers.splice(i,1); renderView(); toast('Tier removed'); }
    function saveProgram(){
      // read tier edits
      document.querySelectorAll('#tierEditor [data-f]').forEach(function(el){
        var i=+el.getAttribute('data-i'), f=el.getAttribute('data-f'); if(!PROGRAM.tiers[i]) return;
        if(f==='req') PROGRAM.tiers[i].req=+el.value||0; else PROGRAM.tiers[i][f]=el.value;
      });
      document.querySelectorAll('#tierEditor [data-appr]').forEach(function(el){ var i=+el.getAttribute('data-appr'); if(PROGRAM.tiers[i]) PROGRAM.tiers[i].approval=el.checked; });
      var ma=$('prog-maxAnnual'), pc=$('prog-perCustomer'), tt=$('prog-taxThreshold');
      if(ma)PROGRAM.global.maxAnnual=+ma.value; if(pc)PROGRAM.global.perCustomer=+pc.value; if(tt)PROGRAM.global.taxThreshold=+tt.value;
      PROGRAM.tiers.sort(function(a,b){return a.req-b.req;});
      ADVOCATES.forEach(function(a){ a.tier=currentTier(a.sold); a.next=nextTier(a.sold); a.earned=tierValueSum(a.sold); });
      toast('Referral program saved — changes are live'); setTab('overview');
    }
    function accessDenied(){ return '<div class="card" style="padding:50px;text-align:center"><div style="width:60px;height:60px;border-radius:16px;background:#fdeceb;color:#dc2626;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">'+svg('shield')+'</div><h2 style="font-size:19px">You don\'t have permission to configure the program</h2><p style="color:var(--muted);margin-top:8px">Ask a manager or administrator for access.</p></div>'; }

    /* ---------- wire interactions after each view render ---------- */
    function wireView(){
      var rp=$('refpills'); if(rp) rp.querySelectorAll('.pill').forEach(function(b){ b.addEventListener('click',function(){ refFilter=b.getAttribute('data-f'); renderView(); }); });
      var lp=$('lbperiod'); if(lp) lp.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ LB_PERIOD=b.getAttribute('data-p'); renderView(); }); });
      document.querySelectorAll('.switch[data-camp]').forEach(function(sw){ sw.addEventListener('click',function(){ var id=+sw.getAttribute('data-camp'); var c=CAMPAIGNS.find(function(x){return x.id===id;}); if(c){ c.on=!c.on; c.status=c.on?'active':'scheduled'; } sw.classList.toggle('on'); toast((c&&c.on?'Campaign activated: ':'Campaign paused: ')+(c?c.name:'')); }); });
      document.querySelectorAll('.switch[data-prog],.switch[data-empbonus]').forEach(function(sw){ sw.addEventListener('click',function(){ sw.classList.toggle('on'); toast('Setting updated'); }); });
    }

    /* ---------- slide-overs ---------- */
    function openRef(id){
      var r=REFERRALS.find(function(x){return x.id===id;}); if(!r) return; var adv=advBy(r.adv);
      var idx=stageIdx(r.stage);
      $('panel').innerHTML=''+
      '<div class="panel-hd"><span class="av" style="background:'+avColor(r.person)+'">'+initials(r.person)+'</span><div><h2>'+r.person+'</h2><div class="pm">Interested in '+r.veh+'</div></div><button class="panel-close" onclick="closePanel()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>'+
      '<div class="panel-body">'+
        '<div class="sect"><h3>Referral Details</h3>'+
          '<div class="kv"><span class="k">Referred by</span><span class="v">'+r.adv+' '+(adv&&adv.tier?tierChipHTML(adv.tier):'')+'</span></div>'+
          '<div class="kv"><span class="k">Assigned rep</span><span class="v">'+r.rep+'</span></div>'+
          '<div class="kv"><span class="k">Submitted</span><span class="v">'+r.date+'</span></div>'+
          '<div class="kv"><span class="k">Current stage</span><span class="v">'+stageBadge(r.stage)+'</span></div>'+
        '</div>'+
        '<div class="sect"><h3>Referral Progress</h3><div class="flow">'+
          STAGES.map(function(s,i){ var cls=i<idx?'done':i===idx?'cur':'pend'; return '<div class="fstep '+cls+'"><span class="fc">'+(i<idx?svg('check'):i===idx?'<i></i>':'')+'</span><div class="ft"><b>'+s.label+'</b>'+(i<=idx?'<span>'+(i===idx?'In progress · '+r.date:'Completed')+'</span>':'')+'</div></div>'; }).join('')+
        '</div></div>'+
        '<div class="p-actions">'+advanceButtons(r)+'</div>'+
      '</div>';
      openPanel();
    }
    function advanceButtons(r){
      var idx=stageIdx(r.stage);
      if(idx>=STAGES.length-1) return '<button class="pa-primary" onclick="closePanel()">Close</button>';
      var next=STAGES[idx+1];
      return '<button class="pa-ghost" onclick="closePanel()">Close</button><button class="pa-primary" onclick="advanceRef('+r.id+')">Advance to '+next.label+'</button>';
    }
    function advanceRef(id){ var r=REFERRALS.find(function(x){return x.id===id;}); var idx=stageIdx(r.stage); if(idx<STAGES.length-1){ r.stage=STAGES[idx+1].key; } closePanel(); render(); toast(r.person+' → '+stageMeta(r.stage).label); }

    function openAdvocate(name){
      var a=advBy(name); if(!a) return;
      var hist=REFERRALS.filter(function(r){return r.adv===name;});
      var nt=a.next, prevReq=0; if(nt){ for(var i=0;i<PROGRAM.tiers.length;i++){ if(PROGRAM.tiers[i].key===nt.key) break; prevReq=PROGRAM.tiers[i].req; } }
      var pct=nt?Math.round(((a.sold-prevReq)/(nt.req-prevReq))*100):100;
      $('panel').innerHTML=''+
      '<div class="panel-hd"><span class="av" style="background:'+avColor(a.name)+'">'+initials(a.name)+'</span><div><h2>'+a.name+'</h2><div class="pm">'+tierChipHTML(a.tier)+' · Customer since '+a.since+'</div></div><button class="panel-close" onclick="closePanel()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>'+
      '<div class="panel-body">'+
        '<div class="sect"><h3>Advocate Overview</h3><div class="pstats">'+
          '<div class="ps"><div class="n">'+a.sold+'</div><div class="l">Sold referrals</div></div>'+
          '<div class="ps"><div class="n">'+a.total+'</div><div class="l">Lifetime referrals</div></div>'+
          '<div class="ps"><div class="n">'+a.purchased+'</div><div class="l">Vehicles purchased</div></div>'+
          '<div class="ps"><div class="n">'+money(a.earned)+'</div><div class="l">Rewards earned</div></div>'+
        '</div>'+
        '<div class="pbar" style="margin-top:14px"><i style="width:'+pct+'%;background:linear-gradient(90deg,#8b5cf6,#7c3aed)"></i></div>'+
        '<div class="pmeta"><span>'+(nt?a.sold+' / '+nt.req+' toward '+nt.name:'Top tier reached 🎉')+'</span><span>'+(nt?(nt.req-a.sold)+' more':'')+'</span></div></div>'+
        '<div class="sect"><h3>Badges Earned</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'+badgeMiniSet(a)+'</div></div>'+
        '<div class="sect"><h3>Details</h3><div class="kv"><span class="k">Favorite salesperson</span><span class="v">'+a.rep+'</span></div><div class="kv"><span class="k">Customer since</span><span class="v">'+a.since+'</span></div><div class="kv"><span class="k">Current tier</span><span class="v">'+(a.tier?a.tier.name:'—')+'</span></div></div>'+
        '<div class="sect"><h3>Referral History</h3>'+(hist.length?hist.map(function(r){ var m=stageMeta(r.stage); return '<div class="hist"><span class="hd" style="background:'+m.color+'"></span><div class="hn"><b>'+r.person+'</b><span>'+r.veh+' · '+r.date+'</span></div>'+stageBadge(r.stage)+'</div>'; }).join(''):'<div style="color:var(--muted);font-size:12.5px">No referrals logged yet.</div>')+'</div>'+
        '<div class="p-actions"><button class="pa-ghost" onclick="closePanel();toast(\'Thank-you message sent\')">Send thank-you</button><button class="pa-primary" onclick="closePanel();toast(\'Promo sent to '+a.name.split(' ')[0]+'\')">Send promotion</button></div>'+
      '</div>';
      openPanel();
    }

    function openPanel(){ $('scrim').classList.add('show'); $('panel').classList.add('open'); }
    function closePanel(){ $('scrim').classList.remove('show'); $('panel').classList.remove('open'); }
    function copyLink(){ var i=$('reflink'); if(i){ i.select&&i.select(); try{document.execCommand('copy');}catch(e){} } toast('Referral link copied'); }
    var tTimer; function toast(m){ $('toastMsg').innerHTML=m; $('toast').classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(function(){ $('toast').classList.remove('show'); },2200); }

    document.addEventListener('DOMContentLoaded', function(){ render(); $('scrim').addEventListener('click', closePanel); });
  </script>
</body>
</html>
