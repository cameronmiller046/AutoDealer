<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Packets &amp; Forms — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eaeef4; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 10px 24px -18px rgba(16,32,60,0.26); --radius:15px; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:104px; height:9px; margin-bottom:4px; } .brand .wm { font-size:21px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:19px; height:19px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { margin-top:auto; display:flex; align-items:center; gap:11px; padding:14px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:38px; height:38px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13.5px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11.5px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:11px 26px; }
    .hamb { border:none; background:none; color:var(--muted); width:36px; height:36px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; } .hamb svg { width:20px; height:20px; }
    .tsearch { flex:1; max-width:420px; display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:10px 14px; color:var(--muted); }
    .tsearch svg { width:17px; height:17px; flex:none; } .tsearch input { border:none; background:none; outline:none; width:100%; font-size:13.5px; color:var(--text); }
    .tb-icons { display:flex; align-items:center; gap:4px; margin-left:auto; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:8px; }
    .content { padding:20px 26px 50px; }
    .phead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .phead h1 { font-size:24px; font-weight:800; letter-spacing:-0.6px; } .phead .sub { color:var(--muted); font-size:14px; margin-top:5px; max-width:640px; }
    .head-actions { display:flex; gap:10px; }
    .btn { display:inline-flex; align-items:center; gap:8px; border-radius:11px; padding:10px 16px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); } .btn svg { width:16px; height:16px; }
    .btn-ghost { background:var(--card); border:1px solid var(--line); color:var(--text); } .btn-ghost:hover { border-color:#cfe0f7; color:var(--accent); }
    .btn-primary { background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border:none; box-shadow:0 12px 26px -14px rgba(37,99,235,0.9); }

    .astrip { display:grid; grid-template-columns:repeat(5,1fr); gap:11px; margin:18px 0 4px; }
    .am { background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 15px; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; }
    .am .ai { width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; } .am .ai svg{width:19px;height:19px;}
    .am .av { font-size:20px; font-weight:800; letter-spacing:-0.4px; } .am .al { color:var(--muted); font-size:11.5px; margin-top:2px; }
    .i-blue{background:color-mix(in srgb,#2563eb 13%,var(--card));color:#2563eb;} .i-green{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;} .i-amber{background:color-mix(in srgb,#ea8a0b 15%,var(--card));color:#ea8a0b;} .i-purple{background:color-mix(in srgb,#7c3aed 14%,var(--card));color:#7c3aed;} .i-teal{background:color-mix(in srgb,#0891b2 14%,var(--card));color:#0891b2;} .i-gray{background:color-mix(in srgb,#64748b 13%,var(--card));color:#64748b;} .i-red{background:color-mix(in srgb,#dc2626 13%,var(--card));color:#dc2626;}

    .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:20px 0 18px; overflow-x:auto; }
    .tab { border:none; background:none; padding:11px 16px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap; display:inline-flex; align-items:center; gap:8px; } .tab svg{width:16px;height:16px;} .tab:hover{color:var(--text);} .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
    .tab .tc{font-size:11px;font-weight:700;background:var(--bg);color:var(--muted);border-radius:8px;padding:1px 7px;} .tab.on .tc{background:var(--accent-soft);color:var(--accent);}

    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
    .card h3 { font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:14px; } .card h3 svg{width:16px;height:16px;color:var(--accent);} .card h3 .spark svg{color:#7c3aed;} .card h3 .more{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;}

    /* packet cards */
    .pk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
    .pk { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; border-top:3px solid var(--pc); }
    .pk .pk-h { display:flex; align-items:flex-start; gap:11px; }
    .pk .pk-ic { width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; } .pk .pk-ic svg{width:20px;height:20px;}
    .pk .pk-t { font-size:15px; font-weight:800; letter-spacing:-.2px; } .pk .pk-def { font-size:9.5px; font-weight:800; color:#16a34a; background:color-mix(in srgb,#16a34a 13%,var(--card)); padding:2px 7px; border-radius:6px; margin-left:6px; vertical-align:2px; }
    .pk .pk-sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .pk .pk-badges { display:flex; flex-wrap:wrap; gap:5px; margin:12px 0; } .pk .pk-badges span{ font-size:10px; font-weight:700; background:var(--bg); border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:3px 8px; }
    .pk .pk-meta { display:flex; gap:16px; padding:11px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); } .pk .pk-meta .k{font-size:9.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.3px;} .pk .pk-meta .v{font-size:15px;font-weight:800;margin-top:1px;}
    .pk .pk-foot { display:flex; align-items:center; gap:7px; margin-top:12px; }
    .pk .pk-status { font-size:10px; font-weight:800; padding:3px 9px; border-radius:7px; } .ps-published{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;} .ps-draft{background:color-mix(in srgb,#d97706 15%,var(--card));color:#b45309;} .ps-archived{background:color-mix(in srgb,#64748b 13%,var(--card));color:#64748b;}
    .pk .pk-acts { margin-left:auto; display:flex; gap:5px; } .pk .pk-acts button{ border:1px solid var(--line); background:var(--card); border-radius:8px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); } .pk .pk-acts button:hover{border-color:var(--accent);color:var(--accent);} .pk .pk-acts button svg{width:15px;height:15px;}
    .pk .pk-edit { margin-top:12px; width:100%; border:none; background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:10px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; } .pk .pk-edit:hover{background:var(--accent);color:#fff;} .pk .pk-edit svg{width:15px;height:15px;}

    /* forms library */
    .lib-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .catpill { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; } .catpill:hover{color:var(--text);border-color:#cfe0f7;} .catpill.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    .fl-search { flex:1; min-width:200px; display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 13px; } .fl-search svg{width:16px;height:16px;color:var(--muted);} .fl-search input{border:none;outline:none;width:100%;font-size:13.5px;background:none;color:var(--text);}
    .ftable { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .ftr { display:grid; grid-template-columns:2.4fr 1.2fr 0.8fr 1fr 1fr 90px; gap:12px; padding:12px 16px; align-items:center; border-top:1px solid var(--line); font-size:13px; } .ftr:first-child{border-top:none;} .ftr.head{background:var(--bg);font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;border-top:none;}
    .ftr.row:hover{background:color-mix(in srgb,var(--accent) 3%,var(--card));cursor:pointer;}
    .ftr .fname{display:flex;align-items:center;gap:11px;min-width:0;} .ftr .fname .fi{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;} .ftr .fname .fi svg{width:15px;height:15px;} .ftr .fname b{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .ftr .fname span{font-size:11px;color:var(--muted);}
    .ftype { font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; } .ft-pdf{background:color-mix(in srgb,#dc2626 12%,var(--card));color:#dc2626;} .ft-docx{background:color-mix(in srgb,#2563eb 12%,var(--card));color:#2563eb;} .ft-built{background:color-mix(in srgb,#7c3aed 12%,var(--card));color:#7c3aed;}
    .fstat { font-size:10px; font-weight:800; padding:3px 9px; border-radius:7px; display:inline-block; } .fs-published{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;} .fs-approved{background:color-mix(in srgb,#0891b2 13%,var(--card));color:#0891b2;} .fs-review{background:color-mix(in srgb,#d97706 15%,var(--card));color:#b45309;} .fs-draft{background:color-mix(in srgb,#64748b 13%,var(--card));color:#64748b;} .fs-archived{background:color-mix(in srgb,#64748b 10%,var(--card));color:var(--faint);}
    .fver { font-size:12px; font-weight:700; color:var(--muted); }
    .frow-acts { display:flex; gap:4px; justify-content:flex-end; } .frow-acts button{border:1px solid var(--line);background:var(--card);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);} .frow-acts button:hover{border-color:var(--accent);color:var(--accent);} .frow-acts button svg{width:13px;height:13px;}

    /* compliance */
    .comp-grid { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
    .rule { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); } .rule:first-of-type{border-top:none;} .rule .cond{ flex:1; font-size:13px; } .rule .cond b{color:var(--accent);} .rule .arrow{color:var(--faint);} .rule .then{ font-size:12.5px; font-weight:700; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 11px; } .rule .rt{ font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; }
    .matrix { width:100%; border-collapse:collapse; font-size:12.5px; } .matrix th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--faint); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--line); } .matrix td{ padding:9px 10px; border-bottom:1px solid var(--line); } .matrix .chk{ color:#16a34a; } .matrix .dash{ color:var(--faint); }
    .ai-scan { background:linear-gradient(180deg,color-mix(in srgb,#7c3aed 6%,var(--card)),var(--card)); border-color:color-mix(in srgb,#7c3aed 18%,var(--card)); }
    .scan-item { display:flex; gap:11px; padding:11px 0; border-top:1px solid var(--line); } .scan-item:first-of-type{border-top:none;} .scan-item .si{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;} .scan-item .si svg{width:15px;height:15px;} .scan-item .sb b{font-size:12.5px;font-weight:700;display:block;} .scan-item .sb span{font-size:11.5px;color:var(--muted);} .scan-item .sg{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;align-self:center;}
    .sev-hi{background:color-mix(in srgb,#dc2626 13%,var(--card));color:#dc2626;} .sev-md{background:color-mix(in srgb,#d97706 15%,var(--card));color:#b45309;} .sev-ok{background:color-mix(in srgb,#16a34a 13%,var(--card));color:#16a34a;}

    /* merge fields */
    .mf-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
    .mf-cat h4 { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--faint); margin-bottom:9px; }
    .mf { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; } .mf:first-of-type{border-top:none;} .mf code{ font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:6px; } .mf .mv{color:var(--muted);font-weight:600;}

    /* ===== packet builder overlay ===== */
    .scrim { position:fixed; inset:0; background:rgba(10,20,36,0.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; } .scrim.show { opacity:1; pointer-events:auto; }
    .builder { position:fixed; inset:2.2vh 2.2vw; background:var(--bg); z-index:61; border-radius:18px; box-shadow:0 40px 100px -30px rgba(0,0,0,.6); transform:scale(.98); opacity:0; pointer-events:none; transition:.24s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; overflow:hidden; } .builder.show{ transform:none; opacity:1; pointer-events:auto; }
    .bd-hd { display:flex; align-items:center; gap:14px; padding:16px 22px; background:var(--card); border-bottom:1px solid var(--line); flex:none; }
    .bd-hd h2 { font-size:17px; font-weight:800; } .bd-hd input.name { font-size:17px; font-weight:800; border:1px solid transparent; border-radius:8px; padding:3px 8px; background:none; color:var(--text); } .bd-hd input.name:focus{outline:none;border-color:var(--accent);background:var(--card);} .bd-hd .hm{font-size:12px;color:var(--muted);}
    .bd-hd .sp{flex:1;} .bd-x { border:none; background:var(--bg); color:var(--muted); width:36px; height:36px; border-radius:10px; } .bd-x svg{width:18px;height:18px;}
    .bd-body { flex:1; overflow:hidden; display:grid; grid-template-columns:300px 1fr 300px; }
    .bd-col { overflow-y:auto; padding:16px; } .bd-col.lib{ border-right:1px solid var(--line); background:var(--card); } .bd-col.rules{ border-left:1px solid var(--line); background:var(--card); }
    .bd-col h4 { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--faint); margin:4px 0 10px; }
    .lib-item { display:flex; align-items:center; gap:9px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:7px; cursor:grab; background:var(--bg); } .lib-item:hover{border-color:var(--accent);} .lib-item .li-ic{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);} .lib-item .li-ic svg{width:13px;height:13px;} .lib-item b{font-size:12px;font-weight:600;flex:1;min-width:0;} .lib-item .add{border:none;background:var(--accent);color:#fff;border-radius:7px;width:24px;height:24px;font-size:15px;line-height:1;flex:none;}
    .bd-canvas { padding:18px; overflow-y:auto; }
    .sec { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
    .sec-h { display:flex; align-items:center; gap:9px; padding:11px 14px; background:var(--bg); border-bottom:1px solid var(--line); } .sec-h input{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); border:none; background:none; outline:none; } .sec-h .sn{ margin-left:auto; font-size:11px; color:var(--faint); font-weight:700; }
    .doc-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); } .doc-item:first-child{border-top:none;} .doc-item.drag{opacity:.4;} .doc-item.over{box-shadow:inset 0 2px 0 var(--accent);}
    .doc-item .grip { color:var(--faint); cursor:grab; flex:none; } .doc-item .grip svg{width:16px;height:16px;}
    .doc-item .dnm { flex:1; min-width:0; } .doc-item .dnm b{font-size:13px;font-weight:600;display:block;} .doc-item .dnm span{font-size:11px;color:var(--muted);}
    .req-toggle { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 10px; font-size:10.5px; font-weight:800; } .rq-required{color:#dc2626;border-color:color-mix(in srgb,#dc2626 30%,var(--card));} .rq-optional{color:#64748b;} .rq-conditional{color:#7c3aed;border-color:color-mix(in srgb,#7c3aed 30%,var(--card));}
    .role-sel { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 8px; font-size:11px; font-weight:600; color:var(--muted); }
    .doc-rm { border:none; background:none; color:var(--faint); font-size:17px; flex:none; } .doc-rm:hover{color:#dc2626;}
    .add-sec { border:1px dashed var(--line); background:none; border-radius:10px; padding:10px; width:100%; font-size:12.5px; font-weight:700; color:var(--muted); } .add-sec:hover{border-color:var(--accent);color:var(--accent);}
    .rule-mini { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:12px; background:var(--bg); } .rule-mini b{color:var(--accent);} .rule-mini .rm-then{color:#16a34a;font-weight:700;}
    .bd-ft { display:flex; align-items:center; gap:10px; padding:12px 22px; background:var(--card); border-top:1px solid var(--line); flex:none; } .bd-ft .sp{flex:1;}

    /* version history / form editor share */
    .modal-scrim { position:fixed; inset:0; background:rgba(6,12,22,.6); z-index:70; opacity:0; pointer-events:none; transition:.2s; } .modal-scrim.show{opacity:1;pointer-events:auto;}

    .toast { position:fixed; bottom:24px; right:24px; background:#0f1b2d; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); opacity:0; transform:translateY(18px); transition:all .3s; z-index:90; } .toast.show{opacity:1;transform:none;} .toast .tk{width:22px;height:22px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;flex:none;} .toast .tk svg{width:13px;height:13px;color:#fff;}

    };

      ["f1","Buyer's Order","Sales","built","published","v3","GA","2h ago"],

      pkt("np","New Vehicle Deal Packet","car","#2563eb",["New","Finance","Lease","Cash"],true,"published",[

        ["Finance & Contracts",[["Retail Installment Contract","conditional"],["Lease Agreement","conditional"],["GAP Disclosure","optional"],["Service Contract","optional"],["Manufacturer Incentive Form","conditional"]]],

    /* ================= PACKETS ================= */
    function pktStats(p){ var docs=0,req=0; p.sections.forEach(function(s){ s[1].forEach(function(d){ docs++; if(d[1]==="required") req++; }); }); return {docs:docs,req:req,sec:p.sections.length}; }
    function renderPackets(){
      $("tabHost").innerHTML='<div class="pk-grid">'+PACKETS.map(function(p){ var st=pktStats(p);
        return '<div class="pk" style="--pc:'+p.color+'"><div class="pk-h"><span class="pk-ic" style="background:'+p.color+'1e;color:'+p.color+'">'+svg(p.icon)+'</span><div style="flex:1"><div class="pk-t">'+p.name+(p.def?'<span class="pk-def">DEFAULT</span>':"")+'</div><div class="pk-sub">'+st.sec+' sections · '+st.docs+' documents</div></div></div>'+
          '<div class="pk-badges">'+p.types.map(function(t){ return '<span>'+t+'</span>'; }).join("")+'</div>'+
          '<div class="pk-meta"><div><div class="k">Documents</div><div class="v">'+st.docs+'</div></div><div><div class="k">Required</div><div class="v">'+st.req+'</div></div><div><div class="k">Optional/Cond.</div><div class="v">'+(st.docs-st.req)+'</div></div></div>'+
          '<div class="pk-foot"><span class="pk-status ps-'+p.status+'">'+p.status.charAt(0).toUpperCase()+p.status.slice(1)+'</span><div class="pk-acts"><button data-clone="'+p.id+'" title="Duplicate">'+svg("clone")+'</button><button data-prev="'+p.id+'" title="Preview">'+svg("eye")+'</button><button data-arch="'+p.id+'" title="Archive">'+svg("archive")+'</button></div></div>'+
          '<button class="pk-edit" data-edit="'+p.id+'">'+svg("edit")+'Open Packet Builder</button></div>';
      }).join("")+'</div>';
      $("tabHost").querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(){ openBuilder(b.dataset.edit); }); });

      $("tabHost").querySelectorAll("[data-prev]").forEach(function(b){ b.addEventListener("click", function(){ previewPacket(b.dataset.prev); }); });
      $("tabHost").querySelectorAll("[data-arch]").forEach(function(b){ b.addEventListener("click", function(){ var p=PACKETS.find(function(x){return x.id===b.dataset.arch;}); p.status=p.status==="archived"?"published":"archived"; toast(p.name+" "+(p.status==="archived"?"archived":"restored")); renderPackets(); renderStrip(); }); });
    }
    function clonePacket(id){ var p=PACKETS.find(function(x){return x.id===id;}); var copy=JSON.parse(JSON.stringify(p)); copy.id=id+"_"+Date.now().toString(36); copy.name=p.name+" (Copy)"; copy.def=false; copy.status="draft"; PACKETS.push(copy); toast("Cloned "+p.name); renderPackets(); renderTabs(); renderStrip(); }
    function previewPacket(id){ var p=PACKETS.find(function(x){return x.id===id;}); var docs=[]; p.sections.forEach(function(s){ s[1].forEach(function(d){ docs.push(d[0]); }); }); toast("Preview: "+p.name+" — "+docs.length+" forms"); }

      var p= id==="__new" ? pkt("new_"+Date.now().toString(36),"Untitled Packet","packet","#2563eb",["New"],false,"draft",[["Section 1",[]]]) : PACKETS.find(function(x){return x.id===id;});
      bState=JSON.parse(JSON.stringify(p)); bState._new=(id==="__new");
      renderBuilder(); builder.classList.add("show"); scrim.classList.add("show");
    }
    function closeBuilder(){ builder.classList.remove("show"); scrim.classList.remove("show"); }
    scrim.addEventListener("click", closeBuilder);
    function renderBuilder(){
      var used={}; bState.sections.forEach(function(s){ s[1].forEach(function(d){ used[d[0]]=1; }); });
      var libByCat={}; FORMS.forEach(function(f){ (libByCat[f[2]]=libByCat[f[2]]||[]).push(f); });
      var lib=Object.keys(libByCat).map(function(cat){ return '<h4>'+cat+'</h4>'+libByCat[cat].map(function(f){ return '<div class="lib-item" draggable="true" data-lib="'+f[1]+'"><span class="li-ic">'+svg("doc")+'</span><b>'+f[1]+'</b><button class="add" data-add="'+f[1]+'">+</button></div>'; }).join(""); }).join("");
      builder.innerHTML=''+
        '<div class="bd-hd"><span class="pk-ic" style="width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:'+bState.color+'1e;color:'+bState.color+'">'+svg(bState.icon)+'</span>'+
          '<div><input class="name" id="bdName" value="'+bState.name.replace(/"/g,"&quot;")+'"><div class="hm">Drag forms in · set required / optional / conditional · group into sections</div></div>'+
          '<div class="sp"></div><button class="btn btn-ghost" id="bdRule">+ Add Rule</button><button class="bd-x" id="bdX">'+svg("x")+'</button></div>'+
        '<div class="bd-body">'+
          '<div class="bd-col lib"><h4>Forms Library</h4><div class="hm" style="font-size:11px;color:var(--muted);margin-bottom:10px">Drag onto the packet or tap +</div>'+lib+'</div>'+
          '<div class="bd-canvas" id="bdCanvas"></div>'+
          '<div class="bd-col rules"><h4>Conditional Logic</h4><div id="bdRules"></div><h4 style="margin-top:16px">Deal Types</h4><div class="pk-badges">'+["New","Used","Finance","Lease","Cash","Commercial","Out-of-State"].map(function(t){ return '<span class="catpill '+(bState.types.indexOf(t)>=0?"on":"")+'" data-type="'+t+'" style="font-size:11px;padding:5px 10px">'+t+'</span>'; }).join("")+'</div></div>'+
        '</div>'+
        '<div class="bd-ft"><span style="font-size:12px;color:var(--muted)">'+bState.sections.length+' sections · changes auto-versioned</span><div class="sp"></div><button class="btn btn-ghost" id="bdPrev">'+svg("eye")+' Preview</button><button class="btn btn-primary" id="bdSave">Save &amp; Publish</button></div>';
      renderCanvas();
      renderBuilderRules();
      $("bdX").addEventListener("click", closeBuilder);
      $("bdName").addEventListener("input", function(){ bState.name=this.value; });
      $("bdRule").addEventListener("click", addRule);
      $("bdPrev").addEventListener("click", function(){ toast("Preview: "+bState.name); });
      $("bdSave").addEventListener("click", saveBuilder);
      builder.querySelectorAll("[data-add]").forEach(function(b){ b.addEventListener("click", function(){ addDoc(b.dataset.add); }); });
      builder.querySelectorAll("[data-type]").forEach(function(b){ b.addEventListener("click", function(){ var t=b.dataset.type, i=bState.types.indexOf(t); if(i>=0) bState.types.splice(i,1); else bState.types.push(t); b.classList.toggle("on"); }); });
      // drag from library
      builder.querySelectorAll("[data-lib]").forEach(function(el){ el.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/lib", el.dataset.lib); }); });
    }
    function renderCanvas(){
      var used={}; bState.sections.forEach(function(s){ s[1].forEach(function(d){ used[d[0]]=1; }); });
      $("bdCanvas").innerHTML=bState.sections.map(function(s,si){
        return '<div class="sec" data-sec="'+si+'"><div class="sec-h"><input value="'+s[0].replace(/"/g,"&quot;")+'" data-secname="'+si+'"><span class="sn">'+s[1].length+' forms</span></div>'+
          s[1].map(function(d,di){ var f=FORM_BY[d[0]]; return '<div class="doc-item" draggable="true" data-si="'+si+'" data-di="'+di+'"><span class="grip">'+svg("grip")+'</span><div class="dnm"><b>'+d[0]+'</b><span>'+(f?f[2].toUpperCase()+" · "+f[5]+" · "+f[4]:"custom")+'</span></div>'+
            '<button class="req-toggle rq-'+d[1]+'" data-req="'+si+'-'+di+'">'+d[1].toUpperCase()+'</button>'+
            '<select class="role-sel" data-visi="'+si+'-'+di+'">'+["Customer Facing","Internal Only","Finance Only","Delivery Only","Manager Approval"].map(function(o){ return '<option>'+o+'</option>'; }).join("")+'</select>'+
            '<button class="doc-rm" data-rm="'+si+'-'+di+'">&times;</button></div>'; }).join("")+
          '</div>';
      }).join("")+'<button class="add-sec" id="addSec">+ Add Section</button>';
      // wire
      $("addSec").addEventListener("click", function(){ bState.sections.push(["New Section",[]]); renderCanvas(); });
      $("bdCanvas").querySelectorAll("[data-secname]").forEach(function(inp){ inp.addEventListener("input", function(){ bState.sections[+inp.dataset.secname][0]=inp.value; }); });
      $("bdCanvas").querySelectorAll("[data-req]").forEach(function(b){ b.addEventListener("click", function(){ var p=b.dataset.req.split("-"); var d=bState.sections[+p[0]][1][+p[1]]; var order=["required","optional","conditional"]; d[1]=order[(order.indexOf(d[1])+1)%3]; renderCanvas(); }); });
      $("bdCanvas").querySelectorAll("[data-rm]").forEach(function(b){ b.addEventListener("click", function(){ var p=b.dataset.rm.split("-"); bState.sections[+p[0]][1].splice(+p[1],1); renderCanvas(); }); });
      wireDnd();
    }
    function wireDnd(){
      var dragEl=null, dragPos=null;
      $("bdCanvas").querySelectorAll(".doc-item").forEach(function(el){
        el.addEventListener("dragstart", function(e){ dragEl=el; dragPos=[+el.dataset.si,+el.dataset.di]; el.classList.add("drag"); e.dataTransfer.effectAllowed="move"; });
        el.addEventListener("dragend", function(){ el.classList.remove("drag"); $("bdCanvas").querySelectorAll(".over").forEach(function(x){x.classList.remove("over");}); });
        el.addEventListener("dragover", function(e){ e.preventDefault(); el.classList.add("over"); });
        el.addEventListener("dragleave", function(){ el.classList.remove("over"); });
        el.addEventListener("drop", function(e){ e.preventDefault(); el.classList.remove("over");
          var libName=e.dataTransfer.getData("text/lib");
          var tsi=+el.dataset.si, tdi=+el.dataset.di;
          if(libName){ bState.sections[tsi][1].splice(tdi,0,[libName,"optional"]); renderCanvas(); return; }
          if(!dragPos) return; var moved=bState.sections[dragPos[0]][1].splice(dragPos[1],1)[0];
          bState.sections[tsi][1].splice(tdi,0,moved); renderCanvas(); dragPos=null;
        });
      });
      // drop onto section body (append)
      $("bdCanvas").querySelectorAll(".sec").forEach(function(sec){
        sec.addEventListener("dragover", function(e){ e.preventDefault(); });
        sec.addEventListener("drop", function(e){ var libName=e.dataTransfer.getData("text/lib"); if(libName && !e.target.closest(".doc-item")){ bState.sections[+sec.dataset.sec][1].push([libName,"optional"]); renderCanvas(); } });
      });
    }
    function addDoc(name){ bState.sections[bState.sections.length-1][1].push([name,"optional"]); renderCanvas(); toast("Added "+name); }
    var bRules=[];
    function renderBuilderRules(){ if(!bState._rules) bState._rules=RULES.slice(0,4).map(function(r){return r.slice();}); $("bdRules").innerHTML=bState._rules.map(function(r,i){ return '<div class="rule-mini">If <b>'+r[0]+'</b> → <span class="rm-then">'+r[1]+'</span></div>'; }).join(""); }
    function addRule(){ if(!bState._rules) bState._rules=[]; bState._rules.push(["custom condition","Include selected form","conditional"]); renderBuilderRules(); toast("Rule added"); }
    function saveBuilder(){ if(bState._new){ bState.status="published"; PACKETS.push(bState); } else { var idx=PACKETS.findIndex(function(x){return x.id===bState.id;}); if(idx>=0){ bState.status="published"; PACKETS[idx]=bState; } } closeBuilder(); renderPackets(); renderTabs(); renderStrip(); toast(bState.name+" saved & published"); }

    /* ================= FORMS LIBRARY ================= */
    var fCat="All", fQ="";
    function renderForms(){
      $("tabHost").innerHTML=''+
        '<div class="lib-toolbar">'+CATS.map(function(c){ return '<button class="catpill '+(fCat===c?"on":"")+'" data-cat="'+c+'">'+c+'</button>'; }).join("")+
          '<div class="fl-search">'+svg("eye").replace("eye","")+'<svg viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--muted)"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="fSearch" placeholder="Search forms..." value="'+fQ+'"></div>'+
          '<button class="btn btn-ghost" id="createForm">'+svg("edit")+'Create Form</button></div>'+
        '<div class="ftable"><div class="ftr head"><div>Form</div><div class="ftype-col">Category</div><div>Type</div><div class="fstate">State</div><div>Status</div><div style="text-align:right">Actions</div></div>'+
        FORMS.filter(function(f){ return (fCat==="All"||f[3-1]===fCat) && (!fQ||f[1].toLowerCase().indexOf(fQ.toLowerCase())>=0); }).map(function(f){
          return '<div class="ftr row" data-form="'+f[1]+'"><div class="fname"><span class="fi i-blue">'+svg("doc")+'</span><div><b>'+f[1]+'</b><span>Updated '+f[7]+'</span></div></div>'+
            '<div class="ftype-col" style="color:var(--muted);font-size:12.5px">'+f[2]+'</div>'+
            '<div><span class="ftype ft-'+f[3]+'">'+f[3].toUpperCase()+'</span></div>'+
            '<div class="fstate" style="color:var(--muted);font-size:12.5px">'+f[6]+'</div>'+
            '<div><span class="fstat fs-'+f[4]+'">'+f[4].charAt(0).toUpperCase()+f[4].slice(1)+'</span></div>'+
            '<div class="frow-acts"><button data-edit="'+f[1]+'" title="Edit">'+svg("edit")+'</button><button data-ver="'+f[1]+'" title="Versions">'+svg("history")+'</button><button data-dup="'+f[1]+'" title="Duplicate">'+svg("clone")+'</button></div></div>';
        }).join("")+'</div>';
      $("tabHost").querySelectorAll("[data-cat]").forEach(function(b){ b.addEventListener("click", function(){ fCat=b.dataset.cat; renderForms(); }); });
      var s=$("fSearch"); if(s) s.addEventListener("input", function(){ fQ=this.value; var pos=this.selectionStart; renderForms(); var ns=$("fSearch"); if(ns){ ns.focus(); ns.selectionStart=ns.selectionEnd=pos; } });
      $("createForm").addEventListener("click", function(){ openFormEditor("Untitled Form"); });
      $("tabHost").querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(e){ e.stopPropagation(); openFormEditor(b.dataset.edit); }); });
      $("tabHost").querySelectorAll("[data-ver]").forEach(function(b){ b.addEventListener("click", function(e){ e.stopPropagation(); openVersions(b.dataset.ver); }); });
      $("tabHost").querySelectorAll("[data-dup]").forEach(function(b){ b.addEventListener("click", function(e){ e.stopPropagation(); toast("Duplicated "+b.dataset.dup); }); });
      $("tabHost").querySelectorAll("[data-form]").forEach(function(r){ r.addEventListener("click", function(){ openFormEditor(r.dataset.form); }); });
    }

    /* ================= COMPLIANCE ================= */
    function renderCompliance(){
      var scan=[
        ["#dc2626","alert","Missing required form","Georgia Buyer's Guide not attached to Used Vehicle packet","hi","Fix"],
        ["#d97706","alert","Merge field incomplete","{{customer.dob}} blank on 2 active deals","md","Review"],
        ["#d97706","alert","Form version outdated","Retail Installment Contract v1 in use — v2 available","md","Update"],
        ["#16a34a","check","Signatures present","All published packets include required signature blocks","ok","OK"],
        ["#16a34a","check","State disclosures current","GA disclosures match 2026 statute","ok","OK"]
      ];
      var matrix=[
        ["New Vehicle Finance","GA · Chevrolet","Finance","24 forms","✓"],
        ["Used Vehicle","GA · All","Used","22 forms","✓"],
        ["Out-of-State","FL/AL/TN","Out-of-State","+3 forms","✓"],
        ["Commercial","GA · Fleet","Commercial","Custom","—"],
        ["Lease","GA · GM Financial","Lease","+Lease Agmt","✓"]
      ];
      $("tabHost").innerHTML='<div class="comp-grid"><div>'+
        '<div class="card"><h3>'+svg("map")+'Auto-Generation Rules <span class="more" id="addCompRule">+ Add rule</span></h3>'+RULES.map(function(r){ var col=r[2]==="required"?"#dc2626":r[2]==="auto"?"#64748b":"#7c3aed"; return '<div class="rule"><div class="cond">If <b>'+r[0]+'</b></div><span class="arrow">'+svg("merge").replace(/width="24" height="24"/,'')+'→</span><div class="then">'+r[1]+'</div><span class="rt" style="background:'+col+'1e;color:'+col+'">'+r[2]+'</span></div>'; }).join("")+'</div>'+
        '<div class="card" style="margin-top:16px"><h3>'+svg("layers")+'Packet Assignment Matrix</h3><table class="matrix"><tr><th>Packet</th><th>State / Brand</th><th>Deal Type</th><th>Forms</th><th>Active</th></tr>'+matrix.map(function(m){ return '<tr><td style="font-weight:700">'+m[0]+'</td><td>'+m[1]+'</td><td>'+m[2]+'</td><td>'+m[3]+'</td><td class="'+(m[4]==="✓"?"chk":"dash")+'">'+m[4]+'</td></tr>'; }).join("")+'</table></div>'+
        '</div><div>'+
        '<div class="card ai-scan"><h3><span class="spark">'+svg("spark")+'</span>AI Compliance Checker <span class="more" id="rescan">Re-scan</span></h3>'+scan.map(function(s){ return '<div class="scan-item"><span class="si" style="background:'+s[0]+'1e;color:'+s[0]+'">'+svg(s[1])+'</span><div class="sb"><b>'+s[2]+'</b><span>'+s[3]+'</span></div><span class="sg sev-'+s[4]+'">'+s[5]+'</span></div>'; }).join("")+'</div>'+
        '<div class="card" style="margin-top:16px"><h3>'+svg("shield")+'Approval Workflow</h3><div style="font-size:12.5px;color:var(--muted);line-height:1.6">Forms move through <b style="color:var(--text)">Draft → Pending Review → Approved → Published → Archived</b>. Only <b style="color:#16a34a">Published</b> forms are available to salespeople.</div>'+
          '<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">'+["Draft","Pending Review","Approved","Published","Archived"].map(function(s,i){ return '<span class="fstat '+(i===3?"fs-published":i===4?"fs-archived":i===2?"fs-approved":i===1?"fs-review":"fs-draft")+'">'+s+'</span>'; }).join("")+'</div></div>'+
        '</div></div>';
      $("rescan").addEventListener("click", function(){ toast("AI re-scanned all packets — 3 issues, 2 passed"); });
      $("addCompRule").addEventListener("click", function(){ toast("Add auto-generation rule"); });
    }

    /* ================= MERGE FIELDS ================= */
    function renderMerge(){
      $("tabHost").innerHTML='<div class="card"><h3>'+svg("merge")+'Auto-Fill Merge Fields</h3><div style="font-size:12.5px;color:var(--muted);margin-bottom:16px">Drop any of these tokens into a form — they populate automatically from the active deal at generation time.</div>'+
        '<div class="mf-grid">'+Object.keys(MERGE).map(function(cat){ return '<div class="mf-cat"><h4>'+cat+'</h4>'+MERGE[cat].map(function(f){ return '<div class="mf"><code>'+f[0]+'</code><span class="mv">'+f[1]+'</span></div>'; }).join("")+'</div>'; }).join("")+'</div></div>';
    }

    /* ================= VERSION HISTORY + FORM EDITOR (modal) ================= */
    var modalScrim=$("modalScrim"), modal=$("modal");
    function showModal(){ modal.classList.add("show"); modalScrim.classList.add("show"); }
    function closeModal(){ modal.classList.remove("show"); modalScrim.classList.remove("show"); }
    modalScrim.addEventListener("click", closeModal);
    function openVersions(name){
      var f=FORM_BY[name], cur=f?parseInt(f[5].slice(1)):3;
      var vers=[]; for(var v=cur; v>=1; v--){ vers.push([v, v===cur, ["Dana Morales","Tom Fielder","Admin"][v%3], ["Updated GA tax language","Added GAP disclosure block","Initial version"][ (cur-v)%3 ], v===cur?"Current · Published":"Archived"]); }
      modal.innerHTML='<div class="modal-hd"><h3>Version History — '+name+'</h3><button class="mx" id="mX">'+svg("x")+'</button></div><div class="modal-b">'+vers.map(function(vr){ return '<div class="vrow '+(vr[1]?"cur":"")+'"><span class="vv">v'+vr[0]+'</span><div class="vd"><b>'+vr[3]+'</b><span>'+vr[2]+' · '+vr[4]+'</span></div><div class="va">'+(vr[1]?'':'<button data-restore="'+vr[0]+'">Restore</button>')+'<button data-compare="'+vr[0]+'">Compare</button></div></div>'; }).join("")+'</div>';
      $("mX").addEventListener("click", closeModal);
      modal.querySelectorAll("[data-restore]").forEach(function(b){ b.addEventListener("click", function(){ toast("Restored "+name+" to v"+b.dataset.restore+" (new version created)"); closeModal(); }); });
      modal.querySelectorAll("[data-compare]").forEach(function(b){ b.addEventListener("click", function(){ toast("Comparing v"+b.dataset.compare+" ↔ current"); }); });
      showModal();
    }
    function openFormEditor(name){
      var f=FORM_BY[name];
      modal.style.width="min(680px,94vw)";
      modal.innerHTML='<div class="modal-hd"><h3>Edit Form — '+name+'</h3><button class="mx" id="mX">'+svg("x")+'</button></div><div class="modal-b">'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
          fld("Form name",name)+fld("Category",f?f[2]:"Sales")+fld("Assigned state / jurisdiction",f?f[6]:"GA")+fld("Document type",f?f[3].toUpperCase():"Built")+'</div>'+
        '<div style="margin:14px 0 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--faint)">Editable blocks</div>'+
        ['Heading & dealer logo','Legal / disclosure language','Checkboxes & radio groups','Tables & line items','Custom fields','Signature locations','Margins & page order'].map(function(x){ return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px"><input type="checkbox" checked style="width:16px;height:16px"> '+x+'</label>'; }).join("")+
        '<div style="margin:14px 0 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--faint)">Signature blocks</div>'+
        '<div class="pk-badges">'+["Customer","Co-Buyer","Salesperson","Sales Manager","Finance Manager","Witness","Initials","Date"].map(function(s){ return '<span class="catpill on" style="font-size:11px;padding:5px 10px">'+svg("sign").replace(/width="24" height="24"/,'')+' '+s+'</span>'; }).join("")+'</div>'+
        '<div style="background:var(--accent-soft);border-radius:11px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--accent)">'+svg("merge")+' Insert merge fields like <code style="font-family:ui-monospace">{{customer.name}}</code> — see the Merge Fields tab for all tokens.</div>'+
        '</div>'+
        '<div class="bd-ft" style="border-radius:0 0 16px 16px"><span style="font-size:12px;color:var(--muted)">Saving creates a new version</span><div class="sp"></div><button class="btn btn-ghost" id="mPrint">'+svg("print")+'Print</button><button class="btn btn-primary" id="mSave">Save Version</button></div>';
      $("mX").addEventListener("click", function(){ modal.style.width=""; closeModal(); });
      $("mSave").addEventListener("click", function(){ toast(name+" saved — new version created & sent for review"); modal.style.width=""; closeModal(); });
      $("mPrint").addEventListener("click", function(){ window.print(); });
      showModal();
    }
    function fld(l,v){ return '<div><label style="display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px">'+l+'</label><input value="'+String(v).replace(/"/g,"&quot;")+'" style="width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:var(--card);color:var(--text)"></div>'; }

    /* ================= header actions ================= */
    $("newPacketBtn").addEventListener("click", function(){ tab="packets"; renderTabs(); renderTab(); openBuilder("__new"); });
    $("uploadBtn").addEventListener("click", function(){ var inp=document.createElement("input"); inp.type="file"; inp.accept=".pdf,.docx,.doc"; inp.onchange=function(){ toast("Uploaded "+(inp.files[0]?inp.files[0].name:"form")+" — added as Draft v1"); }; inp.click(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ if(modal.classList.contains("show")) closeModal(); else if(builder.classList.contains("show")) closeBuilder(); } });

    function boot(){ renderStrip(); renderTabs(); renderTab(); }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  </script>
</body>
</html>
