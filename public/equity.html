    .ec-actions { display:flex; gap:8px; margin-top:13px; } .ec-actions button { flex:1; border-radius:10px; padding:9px; font-size:12.5px; font-weight:700; } .ea-task { border:1px solid var(--line); background:#fff; color:var(--accent); } .ea-task:hover{background:var(--accent-soft);} .ea-task.done{background:#e7f7ee;color:#16a34a;border-color:#cdebd8;} .ea-send { border:none; background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; }

    .panel { position:fixed; top:0; right:0; bottom:0; width:480px; max-width:96vw; background:var(--bg); z-index:46; box-shadow:-20px 0 60px -30px rgba(0,0,0,0.5); transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; } .panel.open { transform:none; }
    .panel-hd { display:flex; align-items:flex-start; gap:14px; padding:20px 22px; background:var(--card); border-bottom:1px solid var(--line); } .panel-hd .av { width:46px; height:46px; border-radius:50%; color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; flex:none; } .panel-hd h2 { font-size:18px; font-weight:800; } .panel-hd .pm { color:var(--muted); font-size:13px; margin-top:2px; } .panel-close { margin-left:auto; border:none; background:none; color:var(--muted); width:34px; height:34px; border-radius:9px; } .panel-close svg { width:18px; height:18px; }
    .panel-body { overflow-y:auto; padding:18px 22px 20px; display:flex; flex-direction:column; gap:16px; }
    .score-hero { background:linear-gradient(135deg,#0f2c1e,#0a1c38); color:#fff; border-radius:14px; padding:18px; display:flex; align-items:center; gap:16px; } .score-hero .ring { width:66px; height:66px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; } .score-hero .ring span { background:#0f2233; width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; } .score-hero b { font-size:15px; font-weight:700; display:block; } .score-hero .sh-s { color:#9db4d6; font-size:12.5px; margin-top:2px; }
    .sect { background:var(--card); border:1px solid var(--line); border-radius:13px; padding:16px; } .sect h3 { font-size:13px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:7px; } .sect h3 .si{color:#7c3aed;display:inline-flex;} .sect h3 .si svg{width:15px;height:15px;}
    .fac { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); } .fac:first-child{border-top:none;} .fac .fl { font-size:12.5px; color:var(--muted); width:130px; flex:none; } .fac .bar { flex:1; height:8px; background:#eef2f8; border-radius:999px; overflow:hidden; } .fac .bar > i { display:block; height:100%; border-radius:999px; } .fac .fv { font-size:12px; font-weight:700; width:44px; text-align:right; }

    .rec-veh { display:flex; gap:14px; align-items:center; } .rec-veh .vph { width:96px; height:64px; border-radius:10px; background:linear-gradient(180deg,#f2f6fc,#e7edf6); display:flex; align-items:center; justify-content:center; flex:none; } .rec-veh .vph svg{width:84%;} .rec-veh b { font-weight:700; font-size:14px; } .rec-veh span { font-size:12.5px; color:var(--muted); }
    .p-actions { display:flex; gap:10px; } .p-actions button { flex:1; border-radius:11px; padding:12px; font-size:13.5px; font-weight:700; } .pa-ghost{background:#fff;border:1px solid var(--line);color:var(--text);} .pa-ghost:hover{border-color:#cfe0f7;color:var(--accent);} .pa-primary{background:linear-gradient(180deg,#7c3aed,#6d28d9);border:none;color:#fff;}
    .toast { position:fixed; bottom:24px; right:24px; background:#0f1b2d; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); opacity:0; transform:translateY(18px); transition:all .3s; z-index:60; } .toast.show{opacity:1;transform:none;} .toast .tk{width:22px;height:22px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;flex:none;} .toast .tk svg{width:13px;height:13px;}
    @media (max-width:1240px){ .kpis{grid-template-columns:repeat(2,1fr);} }
    @media (max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{display:none;} }

        <div class="tsearch"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="search" placeholder="Search equity opportunities..." /></div>

          <div><h1>AI Equity Mining <span class="aitag">Live</span></h1><p class="sub">AutoDealer continuously scores every customer for upgrade readiness — equity, mileage, market demand, and engagement.</p></div>
          <button class="btn btn-primary" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 3M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Re-run Scores</button>

  <script src="/roles.js"></script>
  <script>
    var $ = function(id){ return document.getElementById(id); };
    var money = function(n){ return "$"+Math.round(n).toLocaleString(); };
    function car(hex){ return '<svg viewBox="0 0 162 52" style="width:100%"><path d="M12 40 L12 31 C12 29 14 28 18 27 L32 17 C35 14 39 13 46 13 L74 13 L79 27 L150 27 L150 40 Z" fill="'+hex+'"/><path d="M40 26 L48 18 L70 18 L73 26 Z" fill="#dbe6f5" opacity="0.85"/><g><circle cx="46" cy="41" r="10" fill="#1c2330"/><circle cx="46" cy="41" r="4.6" fill="#cbd5e1"/><circle cx="122" cy="41" r="10" fill="#1c2330"/><circle cx="122" cy="41" r="4.6" fill="#cbd5e1"/></g></svg>'; }
    function stars(n){ return '<span class="stars">'+"★".repeat(n)+'<span class="off">'+"★".repeat(5-n)+'</span></span>'; }
    function scoreColor(s){ return s>=85?"#16a34a":s>=70?"#2563eb":s>=55?"#ea8a0b":"#94a3b8"; }

    // customer, current vehicle, equity, monthlyInc, score(1-5 stars), scoreN, recommended, tags, factors, payoff, value, currentPay, newPay
    var E = [
      {id:1,cust:"John Smith",ini:"JS",color:"#3b82f6",veh:"2023 Silverado LT",hex:"#2f5fb0",equity:9200,monthly:36,stars:5,scoreN:92,rec:"2026 Silverado High Country",tags:[["hot","In-Market"],["lease","Lease ends 9mo"]],payoff:38100,value:47300,curPay:614,newPay:650,miles:"18,200",age:"3 yrs",demand:"High",
        factors:[["Equity position",92],["Vehicle age",78],["Market demand",95],["Payment fit",88],["Engagement",96],["Service loyalty",84]]},
      {id:2,cust:"Priya Nair",ini:"PN",color:"#f43f5e",veh:"2024 Cadillac XT5",hex:"#eceef1",equity:6400,monthly:52,stars:5,scoreN:88,rec:"2026 Cadillac XT6",tags:[["hot","In-Market"],["svc","Service-active"]],payoff:42600,value:49000,curPay:788,newPay:840,miles:"7,800",age:"1.5 yrs",demand:"High",
        factors:[["Equity position",78],["Vehicle age",62],["Market demand",90],["Payment fit",84],["Engagement",98],["Service loyalty",92]]},
      {id:3,cust:"Kevin Anderson",ini:"KA",color:"#0ea5e9",veh:"2022 GMC Sierra 1500",hex:"#e6e7ea",equity:11300,monthly:28,stars:4,scoreN:81,rec:"2026 Sierra Denali",tags:[["svc","Service-active"]],payoff:22000,value:33300,curPay:642,newPay:670,miles:"38,900",age:"2.5 yrs",demand:"Normal",
        factors:[["Equity position",96],["Vehicle age",70],["Market demand",72],["Payment fit",80],["Engagement",68],["Service loyalty",88]]},
      {id:4,cust:"Robert Brown",ini:"RB",color:"#14b8a6",veh:"2023 Tahoe Premier",hex:"#23262b",equity:8900,monthly:44,stars:4,scoreN:79,rec:"2026 Tahoe High Country",tags:[["lease","Lease ends 5mo"]],payoff:54000,value:62900,curPay:736,newPay:780,miles:"29,400",age:"1.5 yrs",demand:"High",
        factors:[["Equity position",82],["Vehicle age",60],["Market demand",88],["Payment fit",76],["Engagement",74],["Service loyalty",80]]},
      {id:5,cust:"Amanda Harris",ini:"AH",color:"#ec4899",veh:"2021 Equinox LT",hex:"#3a7ca5",equity:4100,monthly:22,stars:3,scoreN:66,rec:"2026 Equinox RS",tags:[],payoff:16800,value:20900,curPay:398,newPay:420,miles:"41,200",age:"4 yrs",demand:"Normal",
        factors:[["Equity position",64],["Vehicle age",84],["Market demand",60],["Payment fit",70],["Engagement",58],["Service loyalty",62]]},
      {id:6,cust:"Grace Kim",ini:"GK",color:"#eab308",veh:"2020 Telluride SX",hex:"#3a7ca5",equity:6800,monthly:18,stars:3,scoreN:61,rec:"2026 Telluride SX-P",tags:[["svc","Service-active"]],payoff:6800,value:13600,curPay:512,newPay:530,miles:"62,000",age:"5 yrs",demand:"Normal",
        factors:[["Equity position",72],["Vehicle age",92],["Market demand",58],["Payment fit",66],["Engagement",52],["Service loyalty",70]]}
    ];

    function renderKPIs(){
      var avgEq = Math.round(E.reduce(function(a,e){return a+e.equity;},0)/E.length);
      var inMarket = E.filter(function(e){return e.tags.some(function(t){return t[0]==="hot";});}).length;
      $("kpis").innerHTML = [["Equity Opportunities",E.length+" of 1,245","",""],["Avg Positive Equity",money(avgEq),"g",""],["In-Market Now",inMarket,"",""],["Follow-up Tasks Created","3","",""]].map(function(k){ return '<div class="kp"><div class="kl">'+k[0]+'</div><div class="kv '+(k[2]||"")+'">'+k[1]+'</div></div>'; }).join("");
    }
    var filter="all", q="";
    var PILLS=[["all","All"],["5star","5-Star Opportunities"],["market","In-Market Now"],["lease","Lease Ending"],["svc","Service-Active"],["equity","Positive Equity"]];
    function match(e){ if(filter==="5star") return e.stars===5; if(filter==="market") return e.tags.some(function(t){return t[0]==="hot";}); if(filter==="lease") return e.tags.some(function(t){return t[0]==="lease";}); if(filter==="svc") return e.tags.some(function(t){return t[0]==="svc";}); if(filter==="equity") return e.equity>0; return true; }
    function renderPills(){ $("pills").innerHTML=PILLS.map(function(p){ return '<button class="pill '+(filter===p[0]?"on":"")+'" data-f="'+p[0]+'">'+p[1]+'</button>'; }).join(""); document.querySelectorAll(".pill").forEach(function(b){ b.addEventListener("click",function(){ filter=b.dataset.f; renderPills(); renderGrid(); }); }); }

    var created={};
    function renderGrid(){
      var rows = E.filter(function(e){ return match(e) && (!q || (e.cust+" "+e.veh+" "+e.rec).toLowerCase().indexOf(q.toLowerCase())!==-1); }).sort(function(a,b){return b.scoreN-a.scoreN;});
      $("grid").innerHTML = rows.map(function(e){ var sc=scoreColor(e.scoreN); return '<div class="ecard" data-id="'+e.id+'" style="--sc:'+sc+'"><div class="ec-top"><span class="av" style="background:'+e.color+'">'+e.ini+'</span><div><b>'+e.cust+'</b><div class="veh">Currently in '+e.veh+'</div></div><div class="escore"><div class="sc-n" style="color:'+sc+'">'+e.scoreN+'</div>'+stars(e.stars)+'</div></div>'+
        '<div class="ec-eq"><div><div class="k">Estimated Equity</div><div class="v g">'+money(e.equity)+'</div></div><div><div class="k">Payment Change</div><div class="v b">+'+money(e.monthly)+'/mo</div></div></div>'+
        '<div class="ec-rec"><span class="ri"><svg viewBox="0 0 24 24"><path d="M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2a2 2 0 0 1 1.9 1.5L21 13v5h-3v-2H6v2H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><div><div class="rl">Recommended upgrade</div><b>'+e.rec+'</b></div></div>'+
        (e.tags.length?'<div class="ec-tags">'+e.tags.map(function(t){return '<span class="etag '+t[0]+'">'+t[1]+'</span>';}).join("")+'</div>':"")+
        '<div class="ec-actions"><button class="ea-task '+(created[e.id]?"done":"")+'" data-task="'+e.id+'">'+(created[e.id]?"Task created ✓":"Create Follow-up")+'</button><button class="ea-send" data-open="'+e.id+'">View Analysis</button></div></div>'; }).join("");
      document.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); openEq(+b.dataset.open); }); });
      document.querySelectorAll(".ecard").forEach(function(el){ el.addEventListener("click",function(e){ if(e.target.closest("[data-task]")) return; openEq(+el.dataset.id); }); });
      document.querySelectorAll("[data-task]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); created[b.dataset.task]=true; renderGrid(); toast("Follow-up task created & assigned to you"); }); });
    }

    var scrim=$("scrim"), panel=$("panel");
    function openEq(id){
      var e=E.find(function(x){return x.id===id;}); if(!e) return; var sc=scoreColor(e.scoreN);
      panel.innerHTML=''+
      '<div class="panel-hd"><span class="av" style="background:'+e.color+'">'+e.ini+'</span><div><h2>'+e.cust+'</h2><div class="pm">Currently in '+e.veh+' · '+e.miles+' mi</div></div><button class="panel-close" id="pClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>'+
      '<div class="panel-body">'+
        '<div class="score-hero"><span class="ring" style="background:conic-gradient('+sc+' '+(e.scoreN*3.6)+'deg,#1c3350 0)"><span style="color:'+sc+'">'+e.scoreN+'</span></span><div><b>Equity Score · '+e.scoreN+'/100 '+stars(e.stars)+'</b><div class="sh-s">Upgrade readiness is <b style="color:#6fe0a0">'+(e.scoreN>=85?"very high":e.scoreN>=70?"high":"moderate")+'</b> — recommend reaching out this week.</div></div></div>'+
        '<div class="sect"><h3><span class="si"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z" fill="currentColor"/></svg></span>Score factors</h3>'+
          e.factors.map(function(f){ var col=f[1]>=80?"#16a34a":f[1]>=65?"#2563eb":"#ea8a0b"; return '<div class="fac"><span class="fl">'+f[0]+'</span><div class="bar"><i style="width:'+f[1]+'%;background:'+col+'"></i></div><span class="fv">'+f[1]+'</span></div>'; }).join("")+'</div>'+
        '<div class="sect"><h3>Equity calculation</h3><div class="eq-rows">'+
          row("Current market value (ACV)",money(e.value))+row("Estimated payoff","-"+money(e.payoff))+
          '<div class="er tot"><span class="k">Positive Equity</span><span class="v">+'+money(e.equity)+'</span></div>'+
          row("Current payment",money(e.curPay)+"/mo")+row("New payment (recommended)",money(e.newPay)+"/mo")+
          '<div class="er"><span class="k">Payment difference</span><span class="v" style="color:var(--accent)">+'+money(e.monthly)+'/mo</span></div>'+
        '</div></div>'+
        '<div class="sect"><h3>Recommended upgrade</h3><div class="rec-veh"><div class="vph">'+car(e.hex)+'</div><div><b>'+e.rec+'</b><span>Market demand: '+e.demand+' · newer trim, similar payment</span></div></div></div>'+
        '<div class="p-actions"><button class="pa-ghost" id="paTask">Create Follow-up Task</button><button class="pa-primary" id="paSend">Send Upgrade Offer</button></div>'+
      '</div>';
      panel.classList.add("open"); panel.setAttribute("aria-hidden","false"); scrim.classList.add("show");
      $("pClose").addEventListener("click", closeAll);
      $("paTask").addEventListener("click", function(){ created[id]=true; renderGrid(); toast("Follow-up task created for "+e.cust); });
      $("paSend").addEventListener("click", function(){ toast("Upgrade offer drafted for "+e.cust+" · "+e.rec); });
    }
    function row(k,v){ return '<div class="er"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
    function closeAll(){ panel.classList.remove("open"); panel.setAttribute("aria-hidden","true"); scrim.classList.remove("show"); }
    scrim.addEventListener("click", closeAll);
    document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeAll(); });
    $("search").addEventListener("input", function(ev){ q=ev.target.value; renderGrid(); });
    $("refresh").addEventListener("click", function(){ toast("Re-scored 1,245 customers · 11 new opportunities surfaced"); });
    var toastT; function toast(msg){ $("toastMsg").textContent=msg; var el=$("toast"); el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},2400); }
    renderKPIs(); renderPills(); renderGrid();
  </script>
</body>
</html>
