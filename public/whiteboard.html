<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Whiteboard — Autodealer</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230072CE'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='800' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --sidebar:#0a1628; --sidebar-2:#071120; --text:#16202e; --muted:#6b7a90; --faint:#97a4b6; --line:#eef1f6; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:#eef4ff; --green:#16a34a; --shadow:0 1px 2px rgba(16,32,60,0.04), 0 12px 28px -18px rgba(16,32,60,0.28); --radius:16px; }
    * { margin:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:inherit; text-decoration:none; } button { font:inherit; cursor:pointer; }
    svg{display:block;}
    .marker{font-family:"Kalam","Comic Sans MS",cursive;}
    .shell { display:grid; grid-template-columns:244px 1fr; min-height:100vh; }
    .sidebar { background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#c7d4e6; padding:22px 14px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; padding:4px 8px 22px; }
    .brand .sw { width:108px; height:9px; margin-bottom:4px; } .brand .wm { font-size:22px; font-weight:900; letter-spacing:0.5px; color:#fff; } .brand .wm b { color:#2b8fff; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav a { display:flex; align-items:center; gap:13px; padding:10px 14px; border-radius:11px; color:#aebdd2; font-size:14px; font-weight:500; }
    .nav a:hover { background:rgba(255,255,255,0.06); color:#fff; } .nav a.on { background:var(--accent); color:#fff; font-weight:600; box-shadow:0 8px 20px -10px rgba(37,99,235,0.9); }
    .nav a svg { width:18px; height:18px; flex:none; } .nav a .nb { margin-left:auto; background:rgba(255,255,255,0.12); color:#dbe7f7; font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 6px; } .nav a.on .nb { background:rgba(255,255,255,0.25); color:#fff; }
    .side-user { display:flex; align-items:center; gap:11px; padding:12px 8px 4px; border-top:1px solid rgba(255,255,255,0.08); }
    .side-user .av { width:36px; height:36px; border-radius:50%; flex:none; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .side-user .meta b { color:#fff; font-size:13px; font-weight:600; display:block; } .side-user .meta span { color:#8698b0; font-size:11px; } .side-user .chev { margin-left:auto; color:#7e90a8; width:14px; height:14px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:12px 30px; }
    .hamb { border:none; background:none; color:var(--muted); width:36px; height:36px; border-radius:9px; } .hamb svg { width:20px; height:20px; }
    .tsearch { flex:1; max-width:360px; display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:11px 14px; color:var(--muted); }
    .tsearch svg { width:17px; height:17px; } .tsearch input { border:none; background:none; outline:none; width:100%; font-size:13.5px; }
    .role-badge { display:inline-flex; align-items:center; gap:7px; background:#eef4ff; color:#2563eb; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700; }
    .tb-avatar .av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f9bff,#0b57b8); color:#fff; font-weight:700; margin-left:auto; }
    .content { padding:24px 30px 60px; }
    .phead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .phead h1 { font-size:26px; font-weight:800; letter-spacing:-0.6px; } .phead .sub { color:var(--muted); font-size:14.5px; margin-top:6px; }
    .btn-primary { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border:none; border-radius:11px; padding:11px 18px; font-size:13.5px; font-weight:600; box-shadow:0 12px 26px -14px rgba(37,99,235,0.9); } .btn-primary svg { width:16px; height:16px; }

    /* board goal header */
    .board-hd{margin:22px 0 18px;background:linear-gradient(180deg,#122a5e,#0e1f47);border-radius:18px;padding:22px 26px;color:#eaf1fb;box-shadow:var(--shadow);position:relative;overflow:hidden;border:3px solid #0a1836;}
    .board-hd::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(255,255,255,.03) 39px);pointer-events:none;}
    .board-hd .bt{font-family:"Kalam",cursive;font-size:22px;font-weight:700;color:#8fd0ff;position:relative;}
    .board-hd .bnums{display:flex;gap:34px;margin-top:12px;flex-wrap:wrap;position:relative;}
    .board-hd .bn b{font-family:"Kalam",cursive;font-size:38px;font-weight:700;display:block;line-height:1;} .board-hd .bn span{font-size:12px;color:#9fb6dd;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
    .board-hd .bn.goal b{color:#fff;} .board-hd .bn.sold b{color:#6ee7b7;} .board-hd .bn.togo b{color:#fcd34d;} .board-hd .bn.pace b{color:#8fd0ff;} .board-hd .bn.gross b{color:#fff;}
    .board-hd .pacebar{margin-top:16px;height:12px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;max-width:520px;position:relative;} .board-hd .pacebar>i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:8px;} .board-hd .pacebar .goalmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;}

    /* toolbar */
    .toolbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
    .swatches{display:flex;gap:7px;} .sw2{width:24px;height:24px;border-radius:7px;cursor:pointer;border:2px solid transparent;} .sw2.on{border-color:#0f1b2d;transform:scale(1.08);}
    .tb-note{flex:1;min-width:200px;display:flex;gap:10px;} .tb-note input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font:inherit;font-size:13.5px;outline:none;background:#fff;} .tb-note input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    .postbtn{border:none;border-radius:11px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;padding:0 18px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;} .postbtn svg{width:15px;height:15px;}

    /* whiteboard surface */
    .whiteboard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;background-image:linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);background-size:26px 26px;min-height:400px;}
    .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
    .note{border-radius:4px;padding:16px 15px 14px;box-shadow:0 8px 18px -8px rgba(16,32,60,.35);position:relative;min-height:150px;display:flex;flex-direction:column;transition:transform .14s;}
    .note:nth-child(3n){transform:rotate(-1.4deg);} .note:nth-child(3n+1){transform:rotate(1deg);} .note:nth-child(4n){transform:rotate(-.6deg);}
    .note:hover{transform:rotate(0) translateY(-3px);z-index:3;box-shadow:0 16px 30px -10px rgba(16,32,60,.4);}
    .note .tape{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);width:56px;height:18px;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.05);}
    .note .cat{font-family:"Kalam",cursive;font-size:13px;font-weight:700;opacity:.7;}
    .note .body{font-family:"Kalam",cursive;font-size:17px;font-weight:400;line-height:1.4;margin-top:6px;flex:1;color:#1a1a1a;outline:none;}
    .note .foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;opacity:.75;font-weight:700;}
    .note .foot .av{width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none;}
    .note .pin{position:absolute;top:8px;right:8px;width:26px;height:26px;border:none;background:rgba(0,0,0,.05);border-radius:7px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;} .note:hover .pin{opacity:1;} .note .pin svg{width:14px;height:14px;color:#333;} .note.pinned .pin{opacity:1;background:rgba(0,0,0,.12);}
    .note .del{position:absolute;top:8px;right:38px;width:26px;height:26px;border:none;background:rgba(0,0,0,.05);border-radius:7px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;} .note:hover .del{opacity:1;} .note .del svg{width:13px;height:13px;color:#333;}
    /* note colors */
    .c-yellow{background:#fef3c7;} .c-green{background:#d1fae5;} .c-blue{background:#dbeafe;} .c-pink{background:#fce7f3;} .c-purple{background:#ede9fe;} .c-orange{background:#ffedd5;}

    .toast { position:fixed; bottom:24px; right:24px; background:#0f1b2d; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); opacity:0; transform:translateY(18px); transition:all .3s; z-index:60; } .toast.show{opacity:1;transform:none;} .toast .tk{width:22px;height:22px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;flex:none;} .toast .tk svg{width:13px;height:13px;}
    @media (max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{display:none;} }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><svg class="sw" viewBox="0 0 108 9"><path d="M2 7 C26 1, 82 1, 106 5" fill="none" stroke="#2b8fff" stroke-width="2.4" stroke-linecap="round"/></svg><span class="wm">AUTO<b>DEALER</b></span></div>
      <nav class="nav"></nav>
      <div class="side-user"><span class="av">DM</span><span class="meta"><b>Dana Morales</b><span>Sales Manager</span></span><svg class="chev" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="hamb"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div class="tsearch"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input placeholder="Search the board..." /></div>
        <span class="role-badge">Sales Whiteboard</span>
        <span class="tb-avatar"><span class="av">DM</span></span>
      </header>
      <main class="content">
        <div class="phead">
          <div><h1>Sales Whiteboard</h1><p class="sub">The team's shared board — this month's goal up top, and space to post goals, wins, and reminders everyone can see.</p></div>
          <button class="btn-primary" onclick="document.getElementById('noteInput').focus()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add Note</button>
        </div>

        <div class="board-hd">
          <div class="bt">◆ JULY BOARD — 6 days left, let's finish strong!</div>
          <div class="bnums">
            <div class="bn goal"><b>80</b><span>Goal</span></div>
            <div class="bn sold"><b>24</b><span>Sold</span></div>
            <div class="bn togo"><b>56</b><span>To Go</span></div>
            <div class="bn pace"><b>104%</b><span>Pace</span></div>
            <div class="bn gross"><b>$412K</b><span>Gross MTD</span></div>
          </div>
          <div class="pacebar"><i style="width:78%"></i><span class="goalmark" style="left:75%"></span></div>
        </div>

        <div class="toolbar">
          <div class="swatches" id="swatches"></div>
          <div class="tb-note">
            <input id="noteInput" placeholder="Write a note for the team..." onkeydown="if(event.key==='Enter')addNote()" />
            <button class="postbtn" onclick="addNote()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Post</button>
          </div>
        </div>

        <div class="whiteboard"><div class="notes" id="notes"></div></div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="toastMsg">Done</span></div>

  <script src="/roles.js"></script>
  <script>
    var $ = function(id){ return document.getElementById(id); };
    function avColor(s){ var c=['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4','#6366f1']; var h=0; for(var i=0;i<s.length;i++) h=(h+s.charCodeAt(i))%c.length; return c[h]; }
    function initials(n){ return n.split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase(); }

    var COLORS=['yellow','green','blue','pink','purple','orange'];
    var COLHEX={yellow:'#fbbf24',green:'#34d399',blue:'#60a5fa',pink:'#f472b6',purple:'#a78bfa',orange:'#fb923c'};
    var curColor='yellow';

    var NID=100;
    var NOTES=[
      {id:1,cat:'🎯 Goal',color:'blue',body:'56 to go — that\'s ~10 a day. Every up counts. Ask for the appointment!',by:'Dana Morales',pin:true},
      {id:2,cat:'🎉 Win',color:'green',body:'Marcus just delivered his 15th unit this month — new personal record!',by:'Dana Morales',pin:false},
      {id:3,cat:'📌 Reminder',color:'yellow',body:'Toyota weekend cash ends Sunday. Mention it on every deal.',by:'Dana Morales',pin:true},
      {id:4,cat:'💡 Idea',color:'purple',body:'Text your last 10 sold customers for referrals — pipeline is heating up.',by:'Jordan Avery',pin:false},
      {id:5,cat:'🎉 Win',color:'pink',body:'5-star Google review for Sarah today: "best car-buying experience ever."',by:'Riley Brooks',pin:false},
      {id:6,cat:'📣 Shoutout',color:'orange',body:'Big thanks to the whole team for a record Saturday — 9 units in one day!',by:'Dana Morales',pin:false},
      {id:7,cat:'📌 Reminder',color:'yellow',body:'Aged units on the front line — 3 need repricing. See Inventory Intel.',by:'Dana Morales',pin:false},
      {id:8,cat:'🎯 Goal',color:'green',body:'Spiff: first rep to 18 units gets Friday off. Currently Marcus at 15!',by:'Dana Morales',pin:false}
    ];

    function renderSwatches(){
      $('swatches').innerHTML=COLORS.map(function(c){ return '<div class="sw2 c-'+c+(c===curColor?' on':'')+'" data-c="'+c+'" title="'+c+'"></div>'; }).join('');
      $('swatches').querySelectorAll('.sw2').forEach(function(el){ el.addEventListener('click',function(){ curColor=el.getAttribute('data-c'); renderSwatches(); }); });
    }
    function noteHTML(n){
      return '<div class="note c-'+n.color+(n.pin?' pinned':'')+'" data-id="'+n.id+'"><span class="tape"></span>'+
        '<button class="del" onclick="delNote('+n.id+')" title="Remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
        '<button class="pin" onclick="pinNote('+n.id+')" title="Pin"><svg viewBox="0 0 24 24"><path d="M12 3l2 6h5l-4 4 1.5 6L12 15l-4.5 4L9 13 5 9h5z" fill="'+(n.pin?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>'+
        '<div class="cat">'+n.cat+'</div>'+
        '<div class="body" contenteditable="true" oninput="editNote('+n.id+',this.textContent)">'+n.body+'</div>'+
        '<div class="foot"><span class="av" style="background:'+avColor(n.by)+'">'+initials(n.by)+'</span>'+n.by+'</div></div>';
    }
    function renderNotes(){
      var sorted=NOTES.slice().sort(function(a,b){ return (b.pin?1:0)-(a.pin?1:0); });
      $('notes').innerHTML=sorted.map(noteHTML).join('');
    }
    function detectCat(t){ t=t.toLowerCase(); if(t.indexOf('win')>=0||t.indexOf('sold')>=0||t.indexOf('deliver')>=0||t.indexOf('record')>=0) return '🎉 Win'; if(t.indexOf('goal')>=0||t.indexOf('spiff')>=0||t.indexOf('to go')>=0) return '🎯 Goal'; if(t.indexOf('thank')>=0||t.indexOf('shout')>=0||t.indexOf('great job')>=0) return '📣 Shoutout'; if(t.indexOf('idea')>=0||t.indexOf('try')>=0) return '💡 Idea'; return '📌 Reminder'; }
    function addNote(){
      var v=$('noteInput').value.trim(); if(!v) return;
      var me=(window.ADRoles&&window.ADRoles.cfg&&window.ADRoles.cfg().name)||'You';
      NOTES.unshift({id:++NID,cat:detectCat(v),color:curColor,body:v,by:me,pin:false});
      $('noteInput').value=''; renderNotes(); toast('Note posted to the board');
    }
    function editNote(id,txt){ var n=NOTES.find(function(x){return x.id===id;}); if(n) n.body=txt; }
    function pinNote(id){ var n=NOTES.find(function(x){return x.id===id;}); if(n) n.pin=!n.pin; renderNotes(); toast(n&&n.pin?'Pinned to top':'Unpinned'); }
    function delNote(id){ NOTES=NOTES.filter(function(x){return x.id!==id;}); renderNotes(); toast('Note removed'); }

    var tTimer; function toast(m){ $('toastMsg').innerHTML=m; $('toast').classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(function(){ $('toast').classList.remove('show'); },2200); }
    document.addEventListener('DOMContentLoaded', function(){ renderSwatches(); renderNotes(); });
  </script>
</body>
</html>
