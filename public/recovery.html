    function renderGrid(){
      var rows=R.map(function(r,i){return [r,i];}).filter(function(x){ return (filter==="all"||x[0].reason===filter) && (!q||(x[0].n+" "+x[0].veh).toLowerCase().indexOf(q.toLowerCase())!==-1); }).sort(function(a,b){return b[0].score-a[0].score;});
      $("grid").innerHTML=rows.map(function(x){ var r=x[0], rm=REASON[r.reason]; return '<div class="rcard" data-r="'+x[1]+'" style="--rc:'+rm[2]+'"><div class="rc-top"><span class="av" style="background:'+r.c+'">'+r.i+'</span><div><b>'+r.n+'</b><div class="veh">'+r.veh+'</div></div><div class="sc"><div class="n" style="color:'+rm[2]+'">'+r.score+'</div><div class="l">recover</div></div></div>'+
        '<div class="rc-reason"><span class="rt '+rm[0]+'">'+rm[1]+'</span><span>'+r.last+'</span></div>'+
        '<div class="rc-rec"><span class="ri">'+svg(r.aic)+'</span><div><div class="rl">Recommended recovery</div><b>'+r.act+'</b></div></div>'+
        '<div class="rc-meta"><span>Est. deal value</span><b>'+money(r.value)+'</b></div>'+
        '<div class="rc-actions"><button class="ra-add '+(added[x[1]]?"on":"")+'" data-add="'+x[1]+'">'+(added[x[1]]?"In campaign ✓":"Add to Campaign")+'</button><button class="ra-start" data-open="'+x[1]+'">Start Recovery</button></div></div>'; }).join("");
      document.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); openR(+b.dataset.open); }); });
      document.querySelectorAll(".rcard").forEach(function(el){ el.addEventListener("click",function(e){ if(e.target.closest("[data-add]"))return; openR(+el.dataset.r); }); });
      document.querySelectorAll("[data-add]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); added[b.dataset.add]=true; renderGrid(); toast("Added to recovery campaign"); }); });
    }

    var scrim=$("scrim"), panel=$("panel");
    function openR(i){
      var r=R[i], rm=REASON[r.reason];
      panel.innerHTML='<div class="panel-hd"><span class="av" style="background:'+r.c+'">'+r.i+'</span><div><h2>'+r.n+'</h2><div class="pm"><span class="rt '+rm[0]+'" style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px">'+rm[1]+'</span> · '+r.last+'</div></div><button class="panel-close" id="pClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>'+
        '<div class="panel-body"><div class="sect"><h3>Why they slipped</h3><div class="kv2"><div><div class="k">Reason</div><div class="v">'+rm[1]+'</div></div><div><div class="k">Vehicle Interest</div><div class="v">'+r.veh+'</div></div><div><div class="k">Est. Deal Value</div><div class="v">'+money(r.value)+'</div></div><div><div class="k">Recovery Score</div><div class="v" style="color:'+rm[2]+'">'+r.score+'/100</div></div></div></div>'+
        '<div class="sect"><h3><span class="si"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z" fill="currentColor"/></svg></span>AI Recovery Plan</h3><div style="font-size:13px;color:#16a34a;font-weight:700;margin-bottom:10px">→ '+r.act+'</div><div class="opener"><div class="ol">Suggested opener</div>'+r.op+'</div></div>'+
        '<div class="p-actions"><button class="pa-ghost" id="pAdd">Add to Campaign</button><button class="pa-primary" id="pSend">Send Now</button></div></div>';
      panel.classList.add("open"); panel.setAttribute("aria-hidden","false"); scrim.classList.add("show");
      $("pClose").addEventListener("click", closeAll);
      $("pAdd").addEventListener("click", function(){ added[i]=true; renderGrid(); toast(r.n+" added to recovery campaign"); });
      $("pSend").addEventListener("click", function(){ toast("Recovery message sent to "+r.n.split(" ")[0]); closeAll(); });
    }
    function closeAll(){ panel.classList.remove("open"); panel.setAttribute("aria-hidden","true"); scrim.classList.remove("show"); }
    scrim.addEventListener("click", closeAll);
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeAll(); });
    $("search").addEventListener("input", function(e){ q=e.target.value; renderGrid(); });
    $("launch").addEventListener("click", function(){ toast("Recovery campaign builder opened"); });
    var toastT; function toast(msg){ $("toastMsg").textContent=msg; var el=$("toast"); el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},2400); }
    renderKPIs(); renderCamps(); renderPills(); renderGrid();
  </script>
</body>
</html>
